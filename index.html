<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
      --button-bg: #1A1A1A;
      --button-active: #FFCC00;
      --button-active-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .title-group h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 1.05rem;
      color: var(--subtext);
      margin-top: 4px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .weather-svg {
      width: 22px;
      height: 22px;
      vertical-align: middle;
      display: inline-block;
      fill: currentColor;
    }

    .badge-warning {
      background: var(--urgent);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      vertical-align: middle;
      animation: pulse 1.5s infinite;
    }

    #clock {
      font-size: 3.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    #mode-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 14px;
      min-width: 120px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .mode-button.active {
      background: var(--button-active);
      color: var(--button-active-text);
    }

    #last-updated {
      color: var(--subtext);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .toolbar-search {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .toolbar-search.hidden {
      display: none;
    }

    .toolbar-search input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      font-family: inherit;
    }

    .toolbar-search input::placeholder {
      color: var(--subtext);
    }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .stop-group {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 204, 0, 0.05);
    }

    .stop-header-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-header-distance {
      font-size: 0.72rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .stop-card-list {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .eta-card {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 52px;
      min-height: 52px;
      max-height: 52px;
      flex-shrink: 0;
    }

    .eta-card:last-child {
      border-bottom: none;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .route-badge {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      min-width: 58px;
      text-align: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .destination {
      font-size: 1rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .eta-times {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .eta-primary {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .eta-primary .unit {
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 1px;
    }

    .eta-secondary {
      font-size: 0.75rem;
      color: var(--subtext);
      font-weight: 500;
      white-space: nowrap;
    }

    .save-route-btn {
      background: transparent;
      color: var(--subtext);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: transform 0.1s ease, color 0.1s ease;
    }

    .save-route-btn.saved {
      color: var(--accent);
    }

    .save-route-btn:active {
      transform: scale(1.2);
    }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }
    .muted { color: var(--subtext); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.4rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 60px;
    }

    @media (min-width: 700px) {
      #eta-container.daily-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-content: start;
      }

      #eta-container.daily-columns .stop-group {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>即時巴士 ETA</h1>
      <div class="meta-info" id="meta-text">載入天氣中...</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="daily">每日站點</button>
      <button class="mode-button" data-mode="nearby">附近即時</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="last-updated">更新 --:--</div>
    </div>
  </div>

  <div id="toolbar-search" class="toolbar-search hidden">
    <input id="nearby-search" type="text" placeholder="搜尋路線號碼 (例如: 271, 1A)" autocomplete="off" />
  </div>

  <div id="eta-container">
    <div class="status-msg">正在初始化儀表板...</div>
  </div>

  <script>
    const STORAGE_KEY = 'hk-bus-dashboard.saved-routes';
    const ROUTE_DB_KEY = 'hk-bus-dashboard.route-db';
    const ROUTE_DB_TTL = 86400000;
    const PROVIDERS = [
      { id: 'kmb', label: 'KMB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' },
      { id: 'lwb', label: 'LWB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' }
    ];

    let allStops = [];
    let stopMetaMap = {};
    let routeDb = null;
    let userLocation = null;
    let activeStopIds = [];
    let nearbyStopIds = [];
    let currentMode = 'daily';
    let etaPollTimer = null;
    let savedRoutes = [];

    let weatherData = {
      iconId: null,
      tempStr: '',
      rainStr: '',
      warnings: []
    };

    function debounce(func, delay = 300) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => func(...args), delay);
      };
    }

    function getProviderApiBase(providerId) {
      const provider = PROVIDERS.find(p => p.id === providerId) || PROVIDERS[0];
      return provider.api;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateLastUpdated(providerId = 'kmb') {
      const now = new Date();
      const timeText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const providerLabel = (providerId || 'kmb').toUpperCase();
      document.getElementById('last-updated').textContent = `${providerLabel} 更新 ${timeText}`;
    }

    function getCompanyColours(providerIds) {
      const companyMap = { kmb: '#E31E25', lwb: '#2A8F9C' };
      const list = Array.isArray(providerIds) ? providerIds : [providerIds || 'kmb'];
      const normalized = list.filter(Boolean).map(id => companyMap[id] || companyMap[id.toLowerCase?.() || id] || companyMap.kmb);
      if (normalized.length === 1) return normalized[0];
      if (normalized.length >= 2) {
        return `linear-gradient(90deg, ${normalized[0]} 0 50%, ${normalized[1]} 50% 100%)`;
      }
      return companyMap.kmb;
    }

    function getWeatherSvg(iconId) {
      if (!iconId) return '';
      const id = parseInt(iconId, 10);

      // Sunny (50)
      if (id === 50) {
        return `<svg class="weather-svg" viewBox="0 0 24 24" style="color:#FFCC00;"><path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.64 4.22c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41l1.42 1.42c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41L5.64 4.22zm12.72 12.72c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41l1.42 1.42c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41l-1.42-1.42zM4.22 18.36c-.39.39-.39 1.02 0 1.41s1.02.39 1.41 0l1.42-1.42c.39-.39.39-1.02 0-1.41s-1.02-.39-1.41 0l-1.42 1.42zm12.72-12.72c-.39.39-.39 1.02 0 1.41s1.02.39 1.41 0l1.42-1.42c.39-.39.39-1.02 0-1.41s-1.02-.39-1.41 0l-1.42 1.42z"/></svg>`;
      }
      // Sunny Intervals / Part Cloud (51-54)
      if (id >= 51 && id <= 54) {
        return `<svg class="weather-svg" viewBox="0 0 24 24" style="color:#FFAA00;"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46C10.21 6.23 11.08 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5h.5c1.66 0 3 1.34 3 3 0 1.13-.64 2.11-1.58 2.62l1.43 1.43C21.9 18.15 22 17.1 22 16c0-2.97-2.16-5.43-5-5.91V10.04zM3.52 3.82L2.1 5.24l3.15 3.15C3.88 9.53 3 11.16 3 13c0 3.31 2.69 6 6 6h9.17l2.58 2.58 1.41-1.41L3.52 3.82zM9 17c-2.21 0-4-1.79-4-4 0-1.28.61-2.42 1.56-3.15l7.59 7.59H9z"/></svg>`;
      }
      // Rain / Showers (62-65)
      if (id >= 62 && id <= 65) {
        return `<svg class="weather-svg" viewBox="0 0 24 24" style="color:#30D158;"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3zm-8-3h2v4h-2zm-4 0h2v4H7zm8 0h2v4h-2z"/></svg>`;
      }
      // Thunderstorms (90-93)
      if (id >= 90 && id <= 93) {
        return `<svg class="weather-svg" viewBox="0 0 24 24" style="color:#FF453A;"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM11 13H8l4.5-8v4H15l-4.5 8v-4z"/></svg>`;
      }

      // Cloudy / Fallback Default (60-61)
      return `<svg class="weather-svg" viewBox="0 0 24 24" style="color:#A0A0A0;"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/></svg>`;
    }

    async function getOrFetchRouteDB() {
      if (routeDb) return routeDb;
      try {
        const cached = localStorage.getItem(ROUTE_DB_KEY);
        if (cached) {
          const { timestamp, data } = JSON.parse(cached);
          if (Date.now() - timestamp < ROUTE_DB_TTL) {
            routeDb = data;
            return routeDb;
          }
        }
      } catch (e) { /* ignore */ }

      try {
        const res = await fetch(`${getProviderApiBase('kmb')}/route-stop`);
        if (!res.ok) return {};
        const json = await res.json();
        const list = Array.isArray(json.data) ? json.data : [];

        const db = {};
        list.forEach(item => {
          const r = item.route.toUpperCase();
          if (!db[r]) db[r] = [];
          db[r].push({
            stopId: item.stop,
            seq: parseInt(item.seq, 10),
            bound: item.bound
          });
        });

        routeDb = db;
        localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({
          timestamp: Date.now(),
          data: db
        }));
        return db;
      } catch (e) {
        return {};
      }
    }

    function loadSavedRoutes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        savedRoutes = raw ? JSON.parse(raw) : [];
      } catch (e) {
        savedRoutes = [];
      }
    }

    function saveSavedRoutes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRoutes.slice(0, 12)));
    }

    function buildStopMetaMap() {
      stopMetaMap = {};
      allStops.forEach(stop => {
        if (stop && stop.stop) {
          stopMetaMap[stop.stop] = stop.name_tc || stop.name_en || stop.stop;
        }
      });
    }

    function getSavedRouteKey(route, dest, stopId, provider = 'kmb') {
      return `${provider}|${route}|${dest}|${stopId}`;
    }

    function getSavedRouteKeys() {
      return new Set(savedRoutes.map(item => getSavedRouteKey(item.route, item.dest, item.stopId, item.provider || 'kmb')));
    }

    function isSavedRoute(route, dest, stopId, provider = 'kmb') {
      const key = getSavedRouteKey(route, dest, stopId, provider);
      return savedRoutes.some(item => getSavedRouteKey(item.route, item.dest, item.stopId, item.provider || 'kmb') === key);
    }

    function addSavedRoute(route, dest, stopId, provider = 'kmb') {
      const key = getSavedRouteKey(route, dest, stopId, provider);
      if (!route || !dest || !stopId) return;
      if (isSavedRoute(route, dest, stopId, provider)) return;
      const stopName = stopMetaMap[stopId] || '此站';
      savedRoutes.push({ key, route, dest, stopId, provider, stopName, label: `${route} ${dest}` });
      saveSavedRoutes();
    }

    function removeSavedRoute(key) {
      savedRoutes = savedRoutes.filter(item => item.key !== key);
      saveSavedRoutes();
    }

    async function fetchWeather() {
      try {
        const [rhrRes, fndRes, warnRes] = await Promise.allSettled([
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'),
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc')
        ]);

        let iconId = null;
        let currTemp = null;
        let minTemp = null;
        let maxTemp = null;
        let psrText = '';
        let warningBadges = [];

        if (rhrRes.status === 'fulfilled' && rhrRes.value.ok) {
          const rhr = await rhrRes.value.json();
          if (rhr.icon && rhr.icon.length > 0) iconId = rhr.icon[0];
          if (rhr.temperature && rhr.temperature.data && rhr.temperature.data.length > 0) {
            currTemp = rhr.temperature.data[0].value;
          }
        }

        if (fndRes.status === 'fulfilled' && fndRes.value.ok) {
          const fnd = await fndRes.value.json();
          if (fnd.forecastWeather && fnd.forecastWeather.length > 0) {
            const today = fnd.forecastWeather[0];
            minTemp = today.forecastMintemp?.value;
            maxTemp = today.forecastMaxtemp?.value;
            if (today.PSR) {
              psrText = `降雨機率: ${today.PSR}`;
            }
          }
        }

        if (warnRes.status === 'fulfilled' && warnRes.value.ok) {
          const warn = await warnRes.value.json();
          if (warn.WTTC) {
            const code = warn.WTTC.code;
            if (code === 'TC1') warningBadges.push('1號風球');
            else if (code === 'TC3') warningBadges.push('3號風球');
            else if (code?.startsWith('TC8')) warningBadges.push('8號風球');
            else if (code === 'TC9') warningBadges.push('9號風球');
            else if (code === 'TC10') warningBadges.push('10號風球');
          }
          if (warn.WRAIN) {
            const code = warn.WRAIN.code;
            if (code === 'WRAINY') warningBadges.push('黃雨');
            else if (code === 'WRAINR') warningBadges.push('紅雨');
            else if (code === 'WRAINB') warningBadges.push('黑雨');
          }
          if (warn.WHOT) warningBadges.push('酷熱');
          if (warn.WCOLD) warningBadges.push('寒冷');
          if (warn.WFIR) warningBadges.push('火災危險');
          if (warn.WTS) warningBadges.push('雷暴');
        }

        weatherData.iconId = iconId;
        weatherData.tempStr = currTemp !== null ? `${currTemp}°C${(minTemp && maxTemp) ? ` (${minTemp}°-${maxTemp}°)` : ''}` : '';
        weatherData.rainStr = psrText;
        weatherData.warnings = warningBadges;

      } catch (e) { /* ignore weather errors */ }
      updateMetaText();
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    function updateMetaText(statusMsg = '') {
      const container = document.getElementById('meta-text');
      if (!container) return;

      const elements = [];

      if (weatherData.iconId || weatherData.tempStr) {
        let tempHtml = '';
        if (weatherData.iconId) {
          tempHtml += getWeatherSvg(weatherData.iconId) + ' ';
        }
        if (weatherData.tempStr) {
          tempHtml += weatherData.tempStr;
        }
        elements.push(tempHtml);
      }

      if (weatherData.rainStr) {
        elements.push(weatherData.rainStr);
      }

      if (weatherData.warnings && weatherData.warnings.length > 0) {
        const badgeHtml = weatherData.warnings.map(w => `<span class="badge-warning">${w}</span>`).join(' ');
        elements.push(badgeHtml);
      }

      if (statusMsg) {
        elements.push(statusMsg);
      }

      container.innerHTML = elements.join(' • ');
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateSearchVisibility() {
      const searchWrap = document.getElementById('toolbar-search');
      const searchInput = document.getElementById('nearby-search');
      if (!searchWrap || !searchInput) return;
      const shouldShow = currentMode === 'nearby';
      searchWrap.classList.toggle('hidden', !shouldShow);
      if (!shouldShow) {
        searchInput.value = '';
      }
    }

    function attachModeHandlers() {
      document.querySelectorAll('.mode-button').forEach(button => {
        button.addEventListener('click', async () => {
          const selectedMode = button.dataset.mode;
          if (selectedMode === currentMode) return;

          currentMode = selectedMode;
          document.querySelectorAll('.mode-button').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
          updateSearchVisibility();

          try {
            const etaContainerEl = document.getElementById('eta-container');
            if (etaContainerEl) etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');
          } catch (e) { /* ignore */ }

          if (currentMode === 'daily') {
            if (savedRoutes.length > 0) {
              activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })).filter(Boolean))];
              updateMetaText('已儲存站點');
              startEtaLoop();
            } else {
              activeStopIds = [];
              document.getElementById('eta-container').innerHTML = '';
              updateMetaText('已儲存站點');
            }
          } else {
            await initNearbyStops();
          }
        });
      });

      const searchInput = document.getElementById('nearby-search');
      if (searchInput) {
        searchInput.addEventListener('input', debounce(async (event) => {
          if (currentMode !== 'nearby') return;
          const value = event.target.value.trim().toUpperCase();

          if (!value) {
            activeStopIds = nearbyStopIds.slice();
            startEtaLoop();
            return;
          }

          const db = await getOrFetchRouteDB();
          let targetStops = [];

          if (db[value]) {
            targetStops = db[value].map(s => ({ stopId: s.stopId, provider: 'kmb' }));
          } else {
            const matchingRoutes = Object.keys(db).filter(r => r.includes(value));
            const stopSet = new Set();
            matchingRoutes.forEach(r => db[r].forEach(s => stopSet.add(s.stopId)));
            targetStops = Array.from(stopSet).slice(0, 80).map(stopId => ({ stopId, provider: 'kmb' }));
          }

          if (targetStops.length === 0) {
            document.getElementById('eta-container').innerHTML =
              '<div class="status-msg">沒有符合搜尋條件的路線。</div>';
            return;
          }

          activeStopIds = targetStops;
          startEtaLoop();
        }, 300));
      }

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (!target) return;

        if (target.dataset.action === 'save-route') {
          const route = target.dataset.route;
          const dest = target.dataset.dest;
          const stopId = target.dataset.stop;
          const provider = target.dataset.provider || 'kmb';
          addSavedRoute(route, dest, stopId, provider);
          target.dataset.action = 'remove-saved-route';
          target.textContent = '★';
          target.classList.add('saved');
          return;
        }

        if (target.dataset.action === 'remove-saved-route') {
          const route = target.dataset.route;
          const dest = target.dataset.dest;
          const stopId = target.dataset.stop;
          const provider = target.dataset.provider || 'kmb';
          removeSavedRoute(getSavedRouteKey(route, dest, stopId, provider));
          target.dataset.action = 'save-route';
          target.textContent = '☆';
          target.classList.remove('saved');
          return;
        }
      });
    }

    function requestLocation() {
      if (!('geolocation' in navigator)) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (activeStopIds.length > 0) {
            fetchEtas();
          }
        },
        (err) => { /* fallback */ },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function initDashboard() {
      loadSavedRoutes();
      attachModeHandlers();

      try {
        const etaContainerEl = document.getElementById('eta-container');
        if (etaContainerEl) etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');
      } catch (e) { /* ignore */ }

      await initStops();
      getOrFetchRouteDB();
      requestLocation();

      if (currentMode === 'daily') {
        if (savedRoutes.length > 0) {
          activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })).filter(Boolean))];
          updateMetaText('已儲存站點');
          startEtaLoop();
          return;
        }

        activeStopIds = [];
        document.getElementById('eta-container').innerHTML = '';
        updateMetaText('已儲存站點');
        return;
      }

      await initNearbyStops();
    }

    async function fetchKmbStops() {
      try {
        const res = await fetch(`${getProviderApiBase('kmb')}/stop`);
        if (!res.ok) return [];
        const json = await res.json();
        const items = Array.isArray(json) ? json : Array.isArray(json.data) ? json.data : [];
        return items.map(stop => ({ ...stop, provider: 'kmb' }));
      } catch (error) {
        return [];
      }
    }

    async function initStops() {
      allStops = await fetchKmbStops();
      buildStopMetaMap();
    }

    async function initNearbyStops() {
      if (allStops.length === 0) {
        await initStops();
      }

      if (!('geolocation' in navigator)) {
        showError('不支援定位功能。');
        return;
      }

      navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {
        enableHighAccuracy: true,
        timeout: 10000
      });
    }

    function onLocationSuccess(position) {
      const userLat = position.coords.latitude;
      const userLong = position.coords.longitude;
      userLocation = { lat: userLat, lng: userLong };

      const nearbyStops = allStops.filter(stop => {
        const dist = getDistanceKm(userLat, userLong, parseFloat(stop.lat), parseFloat(stop.long));
        return dist <= 0.3;
      });

      nearbyStopIds = nearbyStops.map(stop => ({ stopId: stop.stop, provider: stop.provider || 'kmb' }));
      activeStopIds = nearbyStopIds.slice();

      if (activeStopIds.length === 0) {
        document.getElementById('eta-container').innerHTML =
          '<div class="status-msg">300公尺範圍內沒有巴士站。</div>';
        updateMetaText('沒有附近站點');
        return;
      }

      updateMetaText('附近站點（約300公尺）');
      startEtaLoop();
    }

    function onLocationError() {
      showError('位置存取被拒絕。');
    }

    function stopEtaLoop() {
      if (etaPollTimer) {
        clearInterval(etaPollTimer);
        etaPollTimer = null;
      }
    }

    function startEtaLoop() {
      stopEtaLoop();
      fetchEtas();
      etaPollTimer = setInterval(fetchEtas, 20000);
    }

    async function fetchKmbStopEta(stopId) {
      try {
        const res = await fetch(`${getProviderApiBase('kmb')}/stop-eta/${stopId}`);
        if (!res.ok) return [];
        const json = await res.json();
        return Array.isArray(json) ? json : Array.isArray(json.data) ? json.data : [];
      } catch (error) {
        return [];
      }
    }

    async function fetchEtas() {
      if (!activeStopIds.length) return;

      const routeMap = {};
      const now = new Date();
      const promises = [];
      const seenPairs = new Set();

      if (currentMode === 'daily' && savedRoutes.length > 0) {
        for (const savedRoute of savedRoutes) {
          const provider = savedRoute.provider || 'kmb';
          const stopId = savedRoute.stopId;
          const route = savedRoute.route;
          const pairKey = `${provider}|${stopId}|${route}`;
          if (seenPairs.has(pairKey)) continue;
          seenPairs.add(pairKey);

          promises.push((async () => {
            const itemsAll = await fetchKmbStopEta(stopId);
            const items = Array.isArray(itemsAll) ? itemsAll.filter(it => String(it.route) === String(route)) : [];
            return { stopId, provider, items };
          })());
        }
      } else {
        promises.push(...activeStopIds.map(async ({ stopId, provider } = {}) => {
          const providerId = provider || 'kmb';
          const items = await fetchKmbStopEta(stopId);
          return { stopId, provider: providerId, items };
        }));
      }

      const stopResponses = await Promise.allSettled(promises);
      const resolvedResponses = stopResponses.flatMap(result => result.status === 'fulfilled' ? [result.value] : []);

      resolvedResponses.forEach(({ stopId, provider, items }) => {
        let stopLabel = stopMetaMap[stopId];

        if (!stopLabel && savedRoutes.length > 0) {
          const savedMatch = savedRoutes.find(s => s.stopId === stopId);
          if (savedMatch && savedMatch.stopName && savedMatch.stopName !== '此站') {
            stopLabel = savedMatch.stopName;
          }
        }

        if (!stopLabel) {
          stopLabel = `站點 (${stopId})`;
        }

        const stopInfo = allStops.find(s => s.stop === stopId) || {};
        let distanceText = '';
        if (userLocation && stopInfo.lat && stopInfo.long) {
          const distKm = getDistanceKm(userLocation.lat, userLocation.lng, parseFloat(stopInfo.lat), parseFloat(stopInfo.long));
          distanceText = `${Math.round(distKm * 1000)}m`;
        }

        (items || []).forEach(item => {
          if (!item.eta) return;

          const route = item.route;
          const dest = item.dest_tc || item.dest_en || '未知目的地';
          const serviceType = item.service_type || 1;
          const key = `${provider}|${stopId}|${route}|${dest}|${serviceType}`;

          if (!routeMap[key]) {
            routeMap[key] = {
              route,
              dest,
              stopId,
              stopLabel,
              distanceText,
              provider,
              etas: []
            };
          }

          const diffMins = Math.floor((new Date(item.eta) - now) / 60000);
          if (diffMins >= -1 && diffMins < 120) {
            routeMap[key].etas.push({
              time: diffMins,
              rawTime: item.eta.substring(11, 16),
              rmk: item.rmk_tc || item.rmk_en || ''
            });
          }
        });
      });

      renderDashboard(Object.values(routeMap));
      updateLastUpdated('kmb');
    }

    function renderDashboard(cards) {
      const container = document.getElementById('eta-container');

      if (!cards || cards.length === 0) {
        container.innerHTML = `<div class="status-msg">${
          currentMode === 'daily'
            ? '尚未新增預設路線。<br><br>請先使用「附近即時」選擇站點。'
            : '找不到預計到達時間資料。'
        }</div>`;
        return;
      }

      if (currentMode === 'daily') {
        const savedKeySet = getSavedRouteKeys();
        cards = cards.filter(c => savedKeySet.has(getSavedRouteKey(c.route, c.dest, c.stopId, c.provider || 'kmb')));
      }

      cards.forEach(card => card.etas.sort((a, b) => a.time - b.time));

      cards.sort((a, b) => {
        const minA = a.etas[0] ? a.etas[0].time : 999;
        const minB = b.etas[0] ? b.etas[0].time : 999;
        if (minA !== minB) return minA - minB;
        return a.route.localeCompare(b.route, undefined, { numeric: true });
      });

      const groups = {};
      cards.forEach(card => {
        const groupKey = `${card.provider || 'kmb'}_${card.stopId}`;
        if (!groups[groupKey]) {
          groups[groupKey] = {
            stopId: card.stopId,
            stopLabel: card.stopLabel,
            distanceText: card.distanceText,
            provider: card.provider || 'kmb',
            cards: []
          };
        }
        groups[groupKey].cards.push(card);
      });

      const groupList = Object.values(groups);

      container.innerHTML = groupList.map(group => {
        const cardsHtml = group.cards.map(card => {
          const nextEta = card.etas[0];
          const secondEta = card.etas[1];
          const thirdEta = card.etas[2];

          let primaryClass = 'safe';
          let primaryDisplay = '已到達';

          if (nextEta) {
            if (nextEta.time <= 0) {
              primaryClass = 'due';
              primaryDisplay = '即將到達';
            } else if (nextEta.time <= 3) {
              primaryClass = 'urgent';
              primaryDisplay = `${nextEta.time}<span class="unit">分鐘</span>`;
            } else if (nextEta.time <= 7) {
              primaryClass = 'warning';
              primaryDisplay = `${nextEta.time}<span class="unit">分鐘</span>`;
            } else {
              primaryDisplay = `${nextEta.time}<span class="unit">分鐘</span>`;
            }
          }

          let secondaryText = '';
          const formatEtaText = (eta) => eta ? (eta.time <= 0 ? '即將到達' : `${eta.time}分鐘`) : null;
          const secondText = formatEtaText(secondEta);
          const thirdText = formatEtaText(thirdEta);

          if (secondText && thirdText) {
            secondaryText = `${secondText}, ${thirdText}`;
          } else if (secondText) {
            secondaryText = secondText;
          }

          const saved = isSavedRoute(card.route, card.dest, card.stopId, card.provider || 'kmb');
          const saveIcon = saved ? '★' : '☆';
          const saveAction = saved ? 'remove-saved-route' : 'save-route';
          const savedClass = saved ? 'saved' : '';

          const badgeBg = getCompanyColours([card.provider || 'kmb']);

          return `
            <div class="eta-card">
              <div class="route-info">
                <button class="save-route-btn ${savedClass}" data-action="${saveAction}" data-route="${card.route}" data-dest="${card.dest}" data-stop="${card.stopId}" data-provider="${card.provider || 'kmb'}">${saveIcon}</button>
                <div class="route-badge" style="background: ${badgeBg};">${card.route}</div>
                <div class="destination">往 ${card.dest}</div>
              </div>
              <div class="eta-times">
                <div class="eta-primary ${primaryClass}">${primaryDisplay}</div>
                ${secondaryText ? `<div class="eta-secondary">${secondaryText}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="stop-group">
            <div class="stop-header">
              <div class="stop-header-title">${group.stopLabel}</div>
              ${group.distanceText ? `<div class="stop-header-distance">${group.distanceText}</div>` : ''}
            </div>
            <div class="stop-card-list">
              ${cardsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function showError(msg) {
      document.getElementById('eta-container').innerHTML = `<div class="status-msg">${msg}</div>`;
      updateMetaText('錯誤');
    }

    window.onload = initDashboard;
  </script>
</body>
</html>
