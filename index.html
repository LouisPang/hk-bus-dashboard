<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #8E8E93;
      --border: #1C1C1E;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .title-group h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 0.95rem;
      color: var(--subtext);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .weather-emoji {
      font-size: 1.1rem;
      line-height: 1;
    }

    .badge-warning {
      background: var(--urgent);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }

    #clock {
      font-size: 2.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    #mode-switch {
      display: flex;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .mode-button {
      border: none;
      background: transparent;
      color: var(--subtext);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 16px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-button.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }

    #last-updated {
      color: var(--subtext);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .toolbar-search {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .toolbar-search.hidden { display: none; }

    .toolbar-search input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Minimal Card Layout */
    .stop-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .stop-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 4px;
      display: flex;
      justify-content: space-between;
    }

    .eta-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .route-badge {
      color: #000;
      background: var(--accent);
      font-size: 1.1rem;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 6px;
      min-width: 52px;
      text-align: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .destination {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .eta-times {
      display: flex;
      align-items: baseline;
      gap: 8px;
      text-align: right;
      flex-shrink: 0;
    }

    .eta-primary {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1;
    }

    .eta-primary .unit {
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 1px;
    }

    .eta-secondary {
      font-size: 0.8rem;
      color: var(--subtext);
      font-weight: 500;
    }

    .save-btn {
      background: transparent;
      color: var(--subtext);
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .save-btn.saved { color: var(--accent); }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.1rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>即時巴士 ETA</h1>
      <div class="meta-info" id="meta-text">載入天氣中...</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="daily">每日站點</button>
      <button class="mode-button" data-mode="nearby">附近即時</button>
    </div>
    <div id="last-updated">更新 --:--</div>
  </div>

  <div id="toolbar-search" class="toolbar-search hidden">
    <input id="nearby-search" type="text" placeholder="搜尋路線 (例如: 271, 1A)" autocomplete="off" />
  </div>

  <div id="eta-container">
    <div class="status-msg">載入中...</div>
  </div>

  <script>
    const STORAGE_KEY = 'hk-bus-dashboard.saved-routes';
    const ROUTE_DB_KEY = 'hk-bus-dashboard.route-db';
    const ROUTE_DB_TTL = 86400000;
    const KMB_API = 'https://data.etabus.gov.hk/v1/transport/kmb';

    let allStops = [];
    let stopMetaMap = {};
    let routeDb = null;
    let userLocation = null;
    let activeStopIds = [];
    let nearbyStopIds = [];
    let currentMode = 'daily';
    let etaPollTimer = null;
    let savedRoutes = [];

    let weatherData = { iconId: null, tempStr: '', rainStr: '', warnings: [] };

    function debounce(func, delay = 300) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => func(...args), delay);
      };
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateLastUpdated() {
      const now = new Date();
      document.getElementById('last-updated').textContent =
        `更新 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    // Emoji Weather Mapping
    function getWeatherEmoji(iconId) {
      if (!iconId) return '';
      const id = parseInt(iconId, 10);
      if (id === 50) return '☀️';                       // Sunny
      if (id >= 51 && id <= 54) return '🌤️';            // Sunny intervals
      if (id >= 60 && id <= 61) return '☁️';            // Cloudy
      if (id >= 62 && id <= 65) return '🌧️';            // Rain / Showers
      if (id >= 90 && id <= 93) return '⛈️';            // Thunderstorm
      return '⛅';
    }

    async function getOrFetchRouteDB() {
      if (routeDb) return routeDb;
      try {
        const cached = localStorage.getItem(ROUTE_DB_KEY);
        if (cached) {
          const { timestamp, data } = JSON.parse(cached);
          if (Date.now() - timestamp < ROUTE_DB_TTL) {
            routeDb = data;
            return routeDb;
          }
        }
      } catch (e) {}

      try {
        const res = await fetch(`${KMB_API}/route-stop`);
        if (!res.ok) return {};
        const json = await res.json();
        const list = Array.isArray(json.data) ? json.data : [];

        const db = {};
        list.forEach(item => {
          const r = item.route.toUpperCase();
          if (!db[r]) db[r] = [];
          db[r].push({ stopId: item.stop, seq: parseInt(item.seq, 10), bound: item.bound });
        });

        routeDb = db;
        localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: Date.now(), data: db }));
        return db;
      } catch (e) {
        return {};
      }
    }

    function loadSavedRoutes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        savedRoutes = raw ? JSON.parse(raw) : [];
      } catch (e) {
        savedRoutes = [];
      }
    }

    function saveSavedRoutes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRoutes.slice(0, 15)));
    }

    function buildStopMetaMap() {
      stopMetaMap = {};
      allStops.forEach(stop => {
        if (stop && stop.stop) {
          stopMetaMap[stop.stop] = stop.name_tc || stop.name_en || stop.stop;
        }
      });
    }

    function getSavedRouteKey(route, dest, stopId) {
      return `${route}|${dest}|${stopId}`;
    }

    function isSavedRoute(route, dest, stopId) {
      const key = getSavedRouteKey(route, dest, stopId);
      return savedRoutes.some(item => getSavedRouteKey(item.route, item.dest, item.stopId) === key);
    }

    function addSavedRoute(route, dest, stopId) {
      if (isSavedRoute(route, dest, stopId)) return;
      const stopName = stopMetaMap[stopId] || '站點';
      savedRoutes.push({ key: getSavedRouteKey(route, dest, stopId), route, dest, stopId, stopName });
      saveSavedRoutes();
    }

    function removeSavedRoute(route, dest, stopId) {
      const key = getSavedRouteKey(route, dest, stopId);
      savedRoutes = savedRoutes.filter(item => getSavedRouteKey(item.route, item.dest, item.stopId) !== key);
      saveSavedRoutes();
    }

    async function fetchWeather() {
      try {
        const [rhrRes, fndRes, warnRes] = await Promise.allSettled([
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc'),
          fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc')
        ]);

        let iconId = null;
        let currTemp = null;
        let warningBadges = [];

        if (rhrRes.status === 'fulfilled' && rhrRes.value.ok) {
          const rhr = await rhrRes.value.json();
          if (rhr.icon && rhr.icon.length > 0) iconId = rhr.icon[0];
          if (rhr.temperature?.data?.length > 0) currTemp = rhr.temperature.data[0].value;
        }

        if (warnRes.status === 'fulfilled' && warnRes.value.ok) {
          const warn = await warnRes.value.json();
          if (warn.WTTC) warningBadges.push('颱風');
          if (warn.WRAIN) warningBadges.push('暴雨');
          if (warn.WTS) warningBadges.push('雷暴');
        }

        weatherData.iconId = iconId;
        weatherData.tempStr = currTemp !== null ? `${currTemp}°C` : '';
        weatherData.warnings = warningBadges;
      } catch (e) {}
      updateMetaText();
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    function updateMetaText(statusMsg = '') {
      const container = document.getElementById('meta-text');
      if (!container) return;

      const elements = [];
      if (weatherData.iconId || weatherData.tempStr) {
        let text = '';
        if (weatherData.iconId) text += `<span class="weather-emoji">${getWeatherEmoji(weatherData.iconId)}</span> `;
        if (weatherData.tempStr) text += weatherData.tempStr;
        elements.push(text);
      }

      if (weatherData.warnings.length > 0) {
        elements.push(weatherData.warnings.map(w => `<span class="badge-warning">${w}</span>`).join(' '));
      }

      if (statusMsg) elements.push(statusMsg);
      container.innerHTML = elements.join(' • ');
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function attachModeHandlers() {
      document.querySelectorAll('.mode-button').forEach(button => {
        button.addEventListener('click', async () => {
          const selectedMode = button.dataset.mode;
          if (selectedMode === currentMode) return;

          currentMode = selectedMode;
          document.querySelectorAll('.mode-button').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
          document.getElementById('toolbar-search').classList.toggle('hidden', currentMode !== 'nearby');

          if (currentMode === 'daily') {
            if (savedRoutes.length > 0) {
              activeStopIds = [...new Set(savedRoutes.map(item => item.stopId))];
              startEtaLoop();
            } else {
              activeStopIds = [];
              document.getElementById('eta-container').innerHTML = '<div class="status-msg">未有儲存路線。</div>';
            }
          } else {
            await initNearbyStops();
          }
        });
      });

      const searchInput = document.getElementById('nearby-search');
      if (searchInput) {
        searchInput.addEventListener('input', debounce(async (e) => {
          const value = e.target.value.trim().toUpperCase();
          if (!value) {
            activeStopIds = nearbyStopIds.slice();
            startEtaLoop();
            return;
          }

          const db = await getOrFetchRouteDB();
          if (db[value]) {
            activeStopIds = db[value].map(s => s.stopId);
            startEtaLoop();
          }
        }, 300));
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;

        const { route, dest, stop } = btn.dataset;
        if (btn.dataset.action === 'save') {
          addSavedRoute(route, dest, stop);
          btn.dataset.action = 'remove';
          btn.textContent = '★';
          btn.classList.add('saved');
        } else if (btn.dataset.action === 'remove') {
          removeSavedRoute(route, dest, stop);
          btn.dataset.action = 'save';
          btn.textContent = '☆';
          btn.classList.remove('saved');
        }
      });
    }

    async function initDashboard() {
      loadSavedRoutes();
      attachModeHandlers();
      await initStops();
      getOrFetchRouteDB();

      if (currentMode === 'daily' && savedRoutes.length > 0) {
        activeStopIds = [...new Set(savedRoutes.map(item => item.stopId))];
        startEtaLoop();
      } else {
        await initNearbyStops();
      }
    }

    async function initStops() {
      try {
        const res = await fetch(`${KMB_API}/stop`);
        if (!res.ok) return;
        const json = await res.json();
        allStops = Array.isArray(json.data) ? json.data : [];
        buildStopMetaMap();
      } catch (e) {}
    }

    async function initNearbyStops() {
      if (!('geolocation' in navigator)) return;

      navigator.geolocation.getCurrentPosition(pos => {
        userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const nearby = allStops.filter(s => getDistanceKm(userLocation.lat, userLocation.lng, parseFloat(s.lat), parseFloat(s.long)) <= 0.35);
        nearbyStopIds = nearby.map(s => s.stop);
        activeStopIds = nearbyStopIds.slice();
        startEtaLoop();
      }, () => {
        document.getElementById('eta-container').innerHTML = '<div class="status-msg">無法存取位置。</div>';
      }, { enableHighAccuracy: true, timeout: 8000 });
    }

    function startEtaLoop() {
      if (etaPollTimer) clearInterval(etaPollTimer);
      fetchEtas();
      etaPollTimer = setInterval(fetchEtas, 20000);
    }

    async function fetchEtas() {
      if (!activeStopIds.length) return;

      const routeMap = {};
      const now = new Date();

      const promises = activeStopIds.map(async stopId => {
        try {
          const res = await fetch(`${KMB_API}/stop-eta/${stopId}`);
          if (!res.ok) return [];
          const json = await res.json();
          return json.data || [];
        } catch (e) { return []; }
      });

      const results = await Promise.all(promises);

      results.flat().forEach(item => {
        if (!item.eta) return;
        const key = `${item.stop}|${item.route}|${item.dest_tc}`;
        
        if (!routeMap[key]) {
          routeMap[key] = {
            stopId: item.stop,
            route: item.route,
            dest: item.dest_tc || item.dest_en,
            stopLabel: stopMetaMap[item.stop] || '巴士站',
            etas: []
          };
        }

        const diffMins = Math.floor((new Date(item.eta) - now) / 60000);
        if (diffMins >= -1 && diffMins < 120) {
          routeMap[key].etas.push(diffMins);
        }
      });

      renderDashboard(Object.values(routeMap));
      updateLastUpdated();
    }

    function renderDashboard(cards) {
      const container = document.getElementById('eta-container');

      if (currentMode === 'daily') {
        cards = cards.filter(c => isSavedRoute(c.route, c.dest, c.stopId));
      }

      if (!cards.length) {
        container.innerHTML = '<div class="status-msg">沒有相關巴士班次。</div>';
        return;
      }

      cards.forEach(c => c.etas.sort((a, b) => a - b));
      cards.sort((a, b) => (a.etas[0] ?? 999) - (b.etas[0] ?? 999));

      const groups = {};
      cards.forEach(c => {
        if (!groups[c.stopId]) groups[c.stopId] = { label: c.stopLabel, cards: [] };
        groups[c.stopId].cards.push(c);
      });

      container.innerHTML = Object.values(groups).map(g => `
        <div class="stop-group">
          <div class="stop-header">
            <span>${g.label}</span>
          </div>
          ${g.cards.map(c => {
            const next = c.etas[0];
            const second = c.etas[1];

            let primaryClass = 'safe';
            let primaryDisplay = '已到達';

            if (next !== undefined) {
              if (next <= 0) { primaryClass = 'due'; primaryDisplay = '即將到達'; }
              else if (next <= 3) { primaryClass = 'urgent'; primaryDisplay = `${next}<span class="unit">分</span>`; }
              else if (next <= 7) { primaryClass = 'warning'; primaryDisplay = `${next}<span class="unit">分</span>`; }
              else { primaryDisplay = `${next}<span class="unit">分</span>`; }
            }

            const saved = isSavedRoute(c.route, c.dest, c.stopId);
            const action = saved ? 'remove' : 'save';
            const icon = saved ? '★' : '☆';

            return `
              <div class="eta-card">
                <div class="route-info">
                  <button class="save-btn ${saved ? 'saved' : ''}" data-action="${action}" data-route="${c.route}" data-dest="${c.dest}" data-stop="${c.stopId}">${icon}</button>
                  <div class="route-badge">${c.route}</div>
                  <div class="destination">往 ${c.dest}</div>
                </div>
                <div class="eta-times">
                  <div class="eta-primary ${primaryClass}">${primaryDisplay}</div>
                  ${second !== undefined ? `<div class="eta-secondary">${second <= 0 ? '即將' : second + '分'}</div>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `).join('');
    }

    window.onload = initDashboard;
  </script>
</body>
</html>
