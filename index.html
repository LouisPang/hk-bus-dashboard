<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
    }

    .title-group h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 1.1rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    #clock {
      font-size: 3.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .eta-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .route-badge {
      background: var(--accent);
      color: #000;
      font-size: 2rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 8px;
      min-width: 100px;
      text-align: center;
    }

    .destination {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .eta-times {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .eta-primary {
      font-size: 2.4rem;
      font-weight: 800;
    }

    .eta-secondary {
      font-size: 1.3rem;
      color: var(--subtext);
      font-weight: 600;
    }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.5rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 80px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>LIVE BUS ETA</h1>
      <div class="meta-info" id="meta-text">Locating & Loading Weather...</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div id="eta-container">
    <div class="status-msg">Initializing Dashboard...</div>
  </div>

  <script>
    // OPTIONAL: Hardcode your specific stop IDs here if you want to bypass GPS
    // e.g., const HARDCODED_STOPS = ['AA97FFC49AE957A5'];
    const HARDCODED_STOPS = []; 

    let allStops = [];
    let activeStopIds = [];
    let currentTemp = '';

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = 
        `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // HKO Weather
    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
        const data = await res.json();
        currentTemp = `${data.temperature.data[0].value}°C`;
      } catch (e) {
        currentTemp = '';
      }
      updateMetaText();
    }
    fetchWeather();
    setInterval(fetchWeather, 600000); // 10 min refresh

    function updateMetaText(statusMsg = '') {
      const parts = ['Hong Kong'];
      if (currentTemp) parts.push(currentTemp);
      if (statusMsg) parts.push(statusMsg);
      document.getElementById('meta-text').textContent = parts.join(' • ');
    }

    // Distance calculation
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function initDashboard() {
      if (HARDCODED_STOPS.length > 0) {
        activeStopIds = HARDCODED_STOPS;
        updateMetaText('Saved Stops');
        startEtaLoop();
        return;
      }

      try {
        // Load stop database
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const json = await res.json();
        allStops = json.data || [];

        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {
            enableHighAccuracy: true,
            timeout: 10000
          });
        } else {
          showError("Geolocation not supported.");
        }
      } catch (e) {
        showError("Failed to fetch KMB stop metadata.");
      }
    }

    function onLocationSuccess(position) {
      const userLat = position.coords.latitude;
      const userLong = position.coords.longitude;

      const nearbyStops = allStops.filter(stop => {
        const dist = getDistanceKm(userLat, userLong, parseFloat(stop.lat), parseFloat(stop.long));
        return dist <= 0.35; // ~350m radius
      });

      activeStopIds = nearbyStops.map(s => s.stop);

      if (activeStopIds.length === 0) {
        document.getElementById('eta-container').innerHTML = 
          `<div class="status-msg">No KMB stops found within 350m.</div>`;
        updateMetaText('No nearby stops');
        return;
      }

      updateMetaText(`Nearby Stops (~350m)`);
      startEtaLoop();
    }

    function onLocationError() {
      showError("Location access denied.");
    }

    function startEtaLoop() {
      fetchEtas();
      setInterval(fetchEtas, 20000); // refresh every 20s
    }

    async function fetchEtas() {
      let routeMap = {};
      const now = new Date();

      const promises = activeStopIds.map(stopId =>
        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`)
          .then(res => res.json())
          .then(json => json.data || [])
          .catch(() => [])
      );

      const results = await Promise.all(promises);

      results.flat().forEach(item => {
        if (item && item.eta && item.eta.trim() !== "") {
          const etaTime = new Date(item.eta);
          const diffMins = Math.round((etaTime - now) / 60000);
          
          if (diffMins >= 0) {
            const key = `${item.route}-${item.dest_en}`;
            if (!routeMap[key]) {
              routeMap[key] = {
                route: item.route,
                dest: item.dest_en || item.dest_tc,
                etas: []
              };
            }
            routeMap[key].etas.push(diffMins);
          }
        }
      });

      let groupedList = Object.values(routeMap).map(r => {
        r.etas.sort((a, b) => a - b);
        return r;
      });

      groupedList.sort((a, b) => a.etas[0] - b.etas[0]);
      renderEtas(groupedList.slice(0, 6));
    }

    function renderEtas(routes) {
      const container = document.getElementById('eta-container');
      if (routes.length === 0) {
        container.innerHTML = `<div class="status-msg">No upcoming buses found.</div>`;
        return;
      }

      container.innerHTML = routes.map(r => {
        const firstEta = r.etas[0];
        const nextEtas = r.etas.slice(1, 3).map(m => `${m}m`).join(', ');

        let timeClass = 'safe';
        let displayTime = `${firstEta} <span style="font-size:1.2rem">min</span>`;

        if (firstEta === 0) {
          timeClass = 'due';
          displayTime = 'Due';
        } else if (firstEta <= 3) {
          timeClass = 'urgent';
        } else if (firstEta <= 7) {
          timeClass = 'warning';
        }

        return `
          <div class="eta-card">
            <div class="route-info">
              <div class="route-badge">${r.route}</div>
              <div class="destination">to ${r.dest}</div>
            </div>
            <div class="eta-times">
              <div class="eta-primary ${timeClass}">${displayTime}</div>
              ${nextEtas ? `<div class="eta-secondary">Next: ${nextEtas}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function showError(msg) {
      document.getElementById('eta-container').innerHTML = `<div class="status-msg">${msg}</div>`;
      updateMetaText('Error');
    }

    initDashboard();
  </script>
</body>
</html>
