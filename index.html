<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bus ETA Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
    }

    .title-group h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .title-group p {
      font-size: 1rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    #clock {
      font-size: 3.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .eta-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .route-badge {
      background: var(--accent);
      color: #000;
      font-size: 2.2rem;
      font-weight: 900;
      padding: 4px 16px;
      border-radius: 8px;
      min-width: 110px;
      text-align: center;
    }

    .destination-group {
      display: flex;
      flex-direction: column;
    }

    .destination {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .stop-name {
      font-size: 1rem;
      color: var(--subtext);
      margin-top: 2px;
    }

    .eta-time {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      text-align: right;
    }

    .eta-unit {
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--subtext);
    }

    .status-msg {
      font-size: 1.5rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>LIVE BUS ETA</h1>
      <p id="status">Locating...</p>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div id="eta-container">
    <div class="status-msg">Fetching GPS location...</div>
  </div>

  <script>
    // Digital Clock
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    let allStops = [];
    const MAX_DISTANCE_KM = 0.35; // ~350m radius

    // Distance calculation formula
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function initDashboard() {
      try {
        // Fetch all KMB stops metadata once
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const json = await res.json();
        allStops = json.data;

        // Trigger Geolocation
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {
            enableHighAccuracy: true,
            timeout: 10000
          });
        } else {
          showError("Geolocation not supported on this browser.");
        }
      } catch (e) {
        showError("Failed to load KMB stops data.");
      }
    }

    async function onLocationSuccess(position) {
      const userLat = position.coords.latitude;
      const userLong = position.coords.longitude;

      document.getElementById('status').textContent = `Nearby Stops (~350m)`;

      // Filter stops within radius
      const nearbyStops = allStops.filter(stop => {
        const dist = getDistanceKm(userLat, userLong, parseFloat(stop.lat), parseFloat(stop.long));
        return dist <= MAX_DISTANCE_KM;
      });

      if (nearbyStops.length === 0) {
        document.getElementById('eta-container').innerHTML = 
          `<div class="status-msg">No KMB bus stops found within 350 meters.</div>`;
        return;
      }

      fetchEtasForStops(nearbyStops);
      setInterval(() => fetchEtasForStops(nearbyStops), 30000); // 30s auto-refresh
    }

    function onLocationError() {
      showError("Location access denied. Please enable Location Services.");
    }

    async function fetchEtasForStops(stops) {
      let allEtas = [];

      // Query ETA API for nearby stops
      const promises = stops.map(stop =>
        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop.stop}`)
          .then(res => res.json())
          .then(json => ({ stopName: stop.name_en, data: json.data }))
          .catch(() => null)
      );

      const results = await Promise.all(promises);

      const now = new Date();

      results.forEach(result => {
        if (!result || !result.data) return;
        result.data.forEach(item => {
          if (item.eta) {
            const etaTime = new Date(item.eta);
            const diffMins = Math.round((etaTime - now) / 60000);
            if (diffMins >= 0) {
              allEtas.push({
                route: item.route,
                dest: item.dest_en,
                stopName: result.stopName,
                mins: diffMins
              });
            }
          }
        });
      });

      // Sort arrivals chronologically
      allEtas.sort((a, b) => a.mins - b.mins);
      renderEtas(allEtas.slice(0, 8)); // Display top 8 incoming routes
    }

    function renderEtas(etas) {
      const container = document.getElementById('eta-container');
      if (etas.length === 0) {
        container.innerHTML = `<div class="status-msg">No upcoming buses in the next hour.</div>`;
        return;
      }

      container.innerHTML = etas.map(eta => `
        <div class="eta-card">
          <div class="route-info">
            <div class="route-badge">${eta.route}</div>
            <div class="destination-group">
              <div class="destination">to ${eta.dest}</div>
              <div class="stop-name">${eta.stopName}</div>
            </div>
          </div>
          <div class="eta-time">
            ${eta.mins === 0 ? 'Due' : eta.mins}
            <span class="eta-unit">${eta.mins === 0 ? '' : 'min'}</span>
          </div>
        </div>
      `).join('');
    }

    function showError(msg) {
      document.getElementById('eta-container').innerHTML = `<div class="status-msg">${msg}</div>`;
    }

    initDashboard();
  </script>
</body>
</html>
