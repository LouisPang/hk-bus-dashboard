<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
      --button-bg: #1A1A1A;
      --button-active: #FFCC00;
      --button-active-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 18px 22px 12px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .title-group h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 1.05rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    .weather-summary {
      margin-top: 5px;
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .weather-commute {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      font-size: 0.86rem;
      color: var(--text);
      font-weight: 700;
      line-height: 1.25;
    }

    .weather-commute .weather-icon {
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .weather-commute.warn { color: var(--warning); }
    .weather-commute.alert { color: var(--urgent); }
    .weather-commute.good { color: var(--safe); }

    .weather-source { display: none; }

    #clock {
      font-size: 3.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    #mode-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 14px;
      min-width: 100px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .mode-button.active {
      background: var(--button-active);
      color: var(--button-active-text);
    }

    #last-updated, #ctb-updated {
      color: var(--subtext);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .toolbar-search {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .toolbar-search.hidden { display: none; }

    .toolbar-search input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      font-family: inherit;
    }

    .toolbar-search input::placeholder { color: var(--subtext); }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .stop-group {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 204, 0, 0.05);
    }

    .stop-header-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-header-distance {
      font-size: 0.72rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .stop-card-list {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .eta-card {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 52px;
      height: auto;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .eta-card:last-child { border-bottom: none; }

    .route-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .destination-wrap {
      min-width: 0;
      overflow: hidden;
      flex: 1;
    }

    .eta-time-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 0;
    }

    .eta-remark {
      width: 100%;
      font-size: 0.68rem;
      color: var(--warning);
      padding: 4px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 4px;
    }

    .eta-secondary-remark {
      max-width: 180px;
      font-size: 0.62rem;
      line-height: 1.2;
      color: var(--warning);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .route-badge {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      min-width: 58px;
      text-align: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .destination {
      font-size: 1rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .eta-times {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .eta-primary {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .eta-primary .unit {
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 1px;
    }

    .eta-secondary {
      font-size: 0.75rem;
      color: var(--subtext);
      font-weight: 500;
      white-space: nowrap;
    }

    .save-route-btn {
      background: transparent;
      color: var(--subtext);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: transform 0.1s ease, color 0.1s ease;
    }

    .save-route-btn.saved { color: var(--accent); }
    .save-route-btn:active { transform: scale(1.2); }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }
    .muted { color: var(--subtext); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.4rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 60px;
    }

    @media (min-width: 700px) {
      #eta-container.daily-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-content: start;
      }
      #eta-container.daily-columns .stop-group { margin-bottom: 0; }
    }

    .provider-status {
      display: inline-flex;
      gap: 12px;
      align-items: center;
      font-size: 14px;
    }
    .provider-status .ok { color: #22c55e; }
    .provider-status .err { color: #ef4444; }
    .provider-status .loading { color: #f59e0b; }
    .provider-status .muted { color: #9ca3af; }

    /* DEBUG TAB STYLES */
    #debug-panel {
      flex: 1;
      overflow-y: auto;
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #debug-panel.hidden { display: none !important; }
    .debug-section {
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      background: #111;
    }
    .debug-title {
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 6px;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .debug-log {
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #aaa;
    }
    .debug-json {
      max-height: 200px;
      overflow-y: auto;
      white-space: pre;
      background: #000;
      padding: 6px;
      color: #38bdf8;
      border-radius: 4px;
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    #rain-map-panel {
      flex-shrink: 0;
      width: 100%;
      height: 260px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    #rain-map-panel.hidden {
      display: none !important;
    }
    #rain-map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(255,204,0,.06);
      border-bottom: 1px solid var(--border);
      font-size: .82rem;
      font-weight: 700;
      flex-shrink: 0;
      z-index: 10;
      gap: 8px;
    }
    #rain-map-header .title { color: var(--accent); white-space: nowrap; }
    #rain-map-header .meta { color: var(--subtext); font-weight: 600; font-size: .75rem; white-space: nowrap; }
    #rain-map { flex: 1; width: 100%; min-height: 150px; background: #0a0a0a; z-index: 1; }
    
    .playback-controller {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 18, 18, 0.9);
      padding: 4px 10px;
      border-top: 1px solid var(--border);
      z-index: 10;
      flex-shrink: 0;
    }
    .playback-btn {
      background: #1a1a1a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .playback-btn:hover { background: #333; }
    .playback-time-label {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      min-width: 110px;
      text-align: center;
      white-space: nowrap;
    }
    .playback-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #333;
      outline: none;
      cursor: pointer;
    }
    .playback-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    #rain-map-legend {
      position: absolute;
      bottom: 42px;
      left: 8px;
      z-index: 1000;
      background: rgba(0,0,0,.75);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: .65rem;
      color: #ccc;
      display: flex;
      gap: 6px;
      align-items: center;
      pointer-events: none;
    }
    #rain-map-legend .swatch { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
    .leaflet-container { background: #0a0a0a!important; font-family: inherit; }
    .leaflet-control-attribution { font-size: 9px!important; background: rgba(0,0,0,.5)!important; color: #888!important; }
    .leaflet-control-zoom a { background: #1a1a1a!important; color: #fff!important; border-color: #333!important; }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>即時巴士 ETA</h1>
      <div class="meta-info" id="meta-text">定位中...</div>
      <div class="weather-summary" id="weather-summary">☁️ 天氣資料載入中</div>
      <div class="weather-commute" id="weather-commute"><span class="weather-icon">·</span><span id="weather-advice">正在載入通勤建議...</span></div>
      <div class="weather-source" id="weather-source">天文台</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="nearby">附近即時</button>
      <button class="mode-button" data-mode="daily">我的路線</button>
      <button class="mode-button" data-mode="debug">調試 (Debug)</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="last-updated">KMB/LWB 更新 --:--</div><div id="ctb-updated">CTB 更新 --:--:--</div>
    </div>
  </div>

  <div id="toolbar-search" class="toolbar-search hidden">
    <div id="providerStatus" class="provider-status">
      <span id="kmbStatus" class="muted">KMB/LWB 更新 --:--</span>
      <span id="ctbStatus" class="muted">CTB 更新 --:--</span>
    </div>
    <input id="nearby-search" type="text" placeholder="搜尋路線號碼 (例如: 271, 1A)" autocomplete="off" />
  </div>

  <div id="eta-container">
    <div class="status-msg">正在初始化儀表板...</div>
  </div>

  <!-- DEBUG PANEL CONTAINER -->
  <div id="debug-panel" class="hidden">
    <div class="debug-section">
      <div class="debug-title">
        <span>系統 & 定位狀態</span>
        <button onclick="updateDebugPanel()" style="background:#222;color:#fff;border:1px solid #555;padding:2px 6px;border-radius:4px;cursor:pointer;">刷新 Debug</button>
      </div>
      <div id="debug-system-info">載入中...</div>
    </div>

    <div class="debug-section">
      <div class="debug-title">降雨預報 (Rain Forecast) CSV Inspector</div>
      <div id="debug-rain-info">未載入降雨資料</div>
    </div>

    <div class="debug-section">
      <div class="debug-title">最新巴士 ETA Data Stream</div>
      <div id="debug-eta-json" class="debug-json">無紀錄</div>
    </div>

    <div class="debug-section">
      <div class="debug-title">系統 Console Logs</div>
      <div id="debug-log-console" class="debug-log"></div>
    </div>
  </div>

  <div id="rain-map-panel" class="hidden">
    <div id="rain-map-header">
      <div class="title">🌧️ 降雨熱力圖預報</div>
      <div class="meta" id="rain-updated">載入中…</div>
    </div>
    <div id="rain-map"></div>
    
    <div class="playback-controller">
      <button class="playback-btn" id="play-prev-btn" title="上一個時段">⏮</button>
      <button class="playback-btn" id="play-toggle-btn" title="播放 / 暫停">▶</button>
      <button class="playback-btn" id="play-next-btn" title="下一個時段">⏭</button>
      <span class="playback-time-label" id="playback-time-display">--:--</span>
      <input type="range" class="playback-slider" id="playback-slider" min="0" max="0" value="0" step="1">
    </div>

    <div id="rain-map-legend">
      <span class="swatch" style="background:#00FF00"></span>&gt;0.5
      <span class="swatch" style="background:#FFA500"></span>&gt;5
      <span class="swatch" style="background:#FF0000"></span>&gt;15
      <span class="swatch" style="background:#800080"></span>&gt;30 mm/hr
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
  const STORAGE_KEY = 'hk-bus-dashboard.saved-routes';
  const ROUTE_DB_KEY = 'hk-bus-dashboard.route-db.v5';
  const ROUTE_DB_TTL = 86400000;
  const ETA_CACHE_TTL = 15000;
  const REQUEST_CONCURRENCY = 6;

  // DEBUG LOGGING OVERRIDE
  const debugLogs = [];
  function logDebug(msg) {
    const timestamp = new Date().toLocaleTimeString();
    debugLogs.unshift(`[${timestamp}] ${msg}`);
    if (debugLogs.length > 50) debugLogs.pop();
    const logEl = document.getElementById('debug-log-console');
    if (logEl) logEl.textContent = debugLogs.join('\n');
  }

  const PROVIDERS = {
    kmb: { id: 'kmb', code: 'KMB', label: 'KMB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' },
    lwb: { id: 'lwb', code: 'LWB', label: 'LWB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' },
    ctb: { id: 'ctb', code: 'CTB', label: 'CTB', api: 'https://rt.data.gov.hk/v2/transport/citybus' }
  };

  let allStops = [];
  let stopMetaMap = {};
  let routeDb = null;
  let userLocation = null;
  const PRESET_TEST_LOCATION = { lat: 22.3193, lng: 114.1694, label: '旺角（測試位置）' };
  let locationSource = 'none';

  let activeStopIds = [];
  let nearbyStopIds = [];

  let latestEtaResults = [];
  let latestGeneratedTimestamps = new Set();
  let currentTemp = '';
  let currentStation = '';
  let currentHumidity = '';
  let currentPsr = '';
  let currentMode = 'nearby';
  let etaPollTimer = null;
  let etaRefreshGeneration = 0;
  let savedRoutes = [];
  let etaCache = new Map();
  let requestQueue = [];
  let activeRequests = 0;
  let providerRefreshTimestamps = { kmb: null, lwb: null, ctb: null };
  let cachedHkoStations = null;

  const providerLiveStatus = {
    kmb: { state: 'idle', lastSuccess: null, lastAttempt: null, error: '' },
    ctb: { state: 'idle', lastSuccess: null, lastAttempt: null, error: '' }
  };

  function loadSavedRoutes() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      savedRoutes = data ? JSON.parse(data) : [];
      logDebug(`Loaded ${savedRoutes.length} saved routes.`);
    } catch (e) { savedRoutes = []; }
  }

  function saveSavedRoutes() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRoutes)); } catch (e) {}
  }

  function getSavedRouteKey(route, dest, stopId, provider = 'kmb', serviceType = 1, dir = '') {
    return [normalizeProvider(provider), stopId, String(route).toUpperCase(), dest, serviceType, dir].join('|');
  }

  function isSavedRoute(route, dest, stopId, provider = 'kmb', serviceType = 1, dir = '') {
    const key = getSavedRouteKey(route, dest, stopId, provider, serviceType, dir);
    return savedRoutes.some(r => getSavedRouteKey(r.route, r.dest, r.stopId, r.provider, r.serviceType, r.dir) === key);
  }

  function addSavedRoute(route, dest, stopId, provider = 'kmb', serviceType = 1, dir = '') {
    if (!isSavedRoute(route, dest, stopId, provider, serviceType, dir)) {
      savedRoutes.push({
        route: String(route).toUpperCase(),
        dest,
        stopId,
        provider: normalizeProvider(provider),
        serviceType: normalizeServiceType(serviceType),
        dir: normalizeDirection(dir)
      });
      saveSavedRoutes();
    }
  }

  function removeSavedRoute(key) {
    savedRoutes = savedRoutes.filter(r => getSavedRouteKey(r.route, r.dest, r.stopId, r.provider, r.serviceType, r.dir) !== key);
    saveSavedRoutes();
  }

  function getStopKey(stopId, provider = 'kmb') {
    return `${normalizeProvider(provider)}|${String(stopId).padStart(6, '0')}`;
  }

  function buildStopMetaMap() {
    stopMetaMap = {};
    allStops.forEach(stop => {
      const id = stop.stop || stop.stop_id;
      if (!id) return;
      const key = getStopKey(id, stop.provider || stop.co);
      stopMetaMap[key] = {
        name: stop.name_tc || stop.name_en || stop.stop_name || '巴士站',
        lat: parseFloat(stop.lat),
        long: parseFloat(stop.long || stop.lng)
      };
    });
  }

  function getStopName(stopId, provider = 'kmb') {
    const key = getStopKey(stopId, provider);
    return stopMetaMap[key]?.name || `站點 ${stopId}`;
  }

  function getStopInfo(stopId, provider = 'kmb') {
    const key = getStopKey(stopId, provider);
    return stopMetaMap[key] || null;
  }

  function updateMetaText(statusMsg = '') {
    const parts = [];
    if (statusMsg) parts.push(statusMsg);
    if (currentStation) parts.push(currentStation);
    if (currentTemp) parts.push(currentTemp);
    if (currentHumidity) parts.push(currentHumidity);
    if (currentPsr) parts.push(currentPsr);
    
    const el = document.getElementById('meta-text');
    if (el && parts.length > 0) {
      el.textContent = parts.join(' • ');
    }
  }

  function applyLocation(lat, lng, sourceLabel) {
    userLocation = { lat, lng };
    locationSource = sourceLabel;
    logDebug(`Location updated: ${lat.toFixed(4)}, ${lng.toFixed(4)} (${sourceLabel})`);
  }

  function usePresetMongKokLocation(reason = '') {
    applyLocation(PRESET_TEST_LOCATION.lat, PRESET_TEST_LOCATION.lng, PRESET_TEST_LOCATION.label);
  }

  function debounce(func, delay = 300) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => func(...args), delay);
    };
  }

  function getProvider(providerId = 'kmb') { return PROVIDERS[providerId] || PROVIDERS.kmb; }
  function normalizeProvider(value) {
    const code = String(value || '').toUpperCase();
    if (code === 'LWB') return 'lwb';
    if (code === 'CTB') return 'ctb';
    return 'kmb';
  }
  function getProviderApiBase(providerId = 'kmb') { return getProvider(providerId).api; }

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  function formatClockTime(timestamp, withSeconds = false) {
    if (!timestamp) return '--:--' + (withSeconds ? ':--' : '');
    const d = new Date(timestamp);
    if (!Number.isFinite(d.getTime())) return '--:--' + (withSeconds ? ':--' : '');
    return withSeconds
      ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`
      : `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function markProviderRefresh(providerId) {
    const id = normalizeProvider(providerId);
    providerRefreshTimestamps[id] = Date.now();
    const ctbEl = document.getElementById('ctb-updated');
    if (ctbEl) ctbEl.textContent = `CTB 更新 ${formatClockTime(providerRefreshTimestamps.ctb, true)}`;
    const lastEl = document.getElementById('last-updated');
    if (lastEl) {
      const kmb = providerRefreshTimestamps.kmb;
      const lwb = providerRefreshTimestamps.lwb;
      const parts = [];
      if (kmb) parts.push(`KMB ${formatClockTime(kmb)}`);
      if (lwb) parts.push(`LWB ${formatClockTime(lwb)}`);
      lastEl.textContent = parts.length ? parts.join(' · ') : 'KMB/LWB 更新 --:--';
    }
  }

  function updateLastUpdated(providerIds = ['kmb']) {
    const ids = Array.isArray(providerIds) ? providerIds : [providerIds];
    ids.forEach(id => markProviderRefresh(id));
  }

  function getCompanyColours(providerIds) {
    const companyMap = { kmb: '#E31E25', lwb: '#2A8F9C', ctb: '#0055B8' };
    const list = Array.isArray(providerIds) ? providerIds : [providerIds || 'kmb'];
    const normalized = list.filter(Boolean).map(id => companyMap[normalizeProvider(id)] || companyMap.kmb);
    if (normalized.length === 1) return normalized[0];
    if (normalized.length >= 2) return `linear-gradient(90deg, ${normalized[0]} 0 50%, ${normalized[1]} 50% 100%)`;
    return companyMap.kmb;
  }

  function formatProviderTime(ts) {
    if (!ts) return '--:--';
    const d = ts instanceof Date ? ts : new Date(ts);
    if (Number.isNaN(d.getTime())) return '--:--';
    return d.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  function setProviderLiveStatus(provider, state, extra = {}) {
    const key = provider === 'CTB' ? 'ctb' : 'kmb';
    Object.assign(providerLiveStatus[key], { state, ...extra });

    const el = document.getElementById(key === 'ctb' ? 'ctbStatus' : 'kmbStatus');
    if (!el) return;

    el.className = state === 'success' ? 'ok' : state === 'error' ? 'err' : state === 'loading' ? 'loading' : 'muted';
    if (state === 'success') {
      el.textContent = `${key === 'ctb' ? 'CTB' : 'KMB/LWB'} 更新 ${formatProviderTime(providerLiveStatus[key].lastSuccess)}`;
    } else if (state === 'error') {
      el.textContent = `${key === 'ctb' ? 'CTB' : 'KMB/LWB'} ✕ ${providerLiveStatus[key].error || 'API failed'}`;
      el.title = providerLiveStatus[key].error || '';
    } else if (state === 'loading') {
      el.textContent = `${key === 'ctb' ? 'CTB' : 'KMB/LWB'} 更新中…`;
    } else {
      el.textContent = `${key === 'ctb' ? 'CTB' : 'KMB/LWB'} 更新 --:--`;
    }
  }

  function markProviderAttempt(provider) { setProviderLiveStatus(provider, 'loading', { lastAttempt: new Date(), error: '' }); }
  function markProviderSuccess(provider) { setProviderLiveStatus(provider, 'success', { lastSuccess: new Date(), error: '' }); }
  function markProviderError(provider, error) {
    const msg = error instanceof Error ? error.message : String(error || 'API failed');
    setProviderLiveStatus(provider, 'error', { error: msg.slice(0, 80) });
    logDebug(`[ERROR] ${provider} API failed: ${msg}`);
  }

  async function fetchProviderJson(url, provider) {
    markProviderAttempt(provider);
    try {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      let json;
      try { json = JSON.parse(text); } catch { throw new Error(`HTTP ${response.status} / invalid JSON`); }
      markProviderSuccess(provider);
      return json;
    } catch (err) {
      markProviderError(provider, err);
      throw err;
    }
  }

  async function fetchJson(url, options = {}) {
    const response = await fetch(url, { ...options, cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  }

  function extractData(json) {
    if (!json) return [];
    if (Array.isArray(json)) return json;
    return Array.isArray(json.data) ? json.data : [];
  }

  function normalizeServiceType(value) {
    const n = parseInt(value, 10);
    return Number.isFinite(n) ? n : 1;
  }

  function normalizeDirection(value) {
    return String(value || '').toUpperCase();
  }

  function formatDataAge(timestamp) {
    if (!timestamp) return '';
    const t = new Date(timestamp).getTime();
    if (!Number.isFinite(t)) return '';
    const seconds = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (seconds < 60) return `${seconds}秒前`;
    return `${Math.round(seconds / 60)}分鐘前`;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  async function getOrFetchRouteDB() {
    if (routeDb) return routeDb;
    try {
      const cached = localStorage.getItem(ROUTE_DB_KEY);
      if (cached) {
        const { timestamp, data } = JSON.parse(cached);
        if (Date.now() - timestamp < ROUTE_DB_TTL && data) {
          routeDb = { kmb: data.kmb || {}, lwb: data.lwb || {}, ctb: data.ctb || {} };
          return routeDb;
        }
      }
    } catch (e) {}

    const db = { kmb: {}, lwb: {}, ctb: {} };
    try {
      const kmbJson = await fetchJson(`${getProviderApiBase('kmb')}/route-stop`);
      extractData(kmbJson).forEach(item => {
        if (!item?.route || !item?.stop) return;
        const provider = normalizeProvider(item.co);
        const route = String(item.route).toUpperCase();
        if (!db[provider][route]) db[provider][route] = [];
        db[provider][route].push({
          route,
          stopId: String(item.stop),
          seq: parseInt(item.seq, 10) || 0,
          dir: normalizeDirection(item.dir || item.bound),
          serviceType: normalizeServiceType(item.service_type),
          provider,
          providerCode: getProvider(provider).code
        });
      });
    } catch (e) {}

    routeDb = db;
    try { localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: Date.now(), data: db })); } catch (e) {}
    return routeDb;
  }

  const CTB_ROUTE_STOP_DB_TTL = 24 * 60 * 60 * 1000;
  let ctbRouteStopLoadPromise = null;
  let ctbRouteStopLastLoadedAt = 0;

  async function fetchCtbRouteStops(route) {
    const routeKey = String(route || '').trim().toUpperCase();
    if (!routeKey) return [];

    await getOrFetchRouteDB();
    if (routeDb.ctb[routeKey]?.length) return routeDb.ctb[routeKey];

    const results = [];
    for (const direction of ['inbound', 'outbound']) {
      try {
        const url = `https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${encodeURIComponent(routeKey)}/${direction}`;
        const json = await fetchWithCache(url);
        extractData(json).forEach(item => {
          if (!item?.route || !item?.stop) return;
          results.push({
            route: String(item.route).toUpperCase(),
            stopId: String(item.stop).padStart(6, '0'),
            seq: parseInt(item.seq, 10) || 0,
            dir: normalizeDirection(item.dir),
            serviceType: 1,
            provider: 'ctb',
            providerCode: 'CTB'
          });
        });
      } catch (e) {}
    }

    routeDb.ctb[routeKey] = results;
    try { localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: Date.now(), data: routeDb })); } catch (e) {}
    return results;
  }

  async function loadCtbRouteStopDatabase(force = false) {
    if (!force && ctbRouteStopLoadPromise) return ctbRouteStopLoadPromise;

    ctbRouteStopLoadPromise = (async () => {
      await getOrFetchRouteDB();
      if (!force && ctbRouteStopLastLoadedAt && Date.now() - ctbRouteStopLastLoadedAt < CTB_ROUTE_STOP_DB_TTL) {
        return routeDb.ctb;
      }

      try {
        const cached = JSON.parse(localStorage.getItem(ROUTE_DB_KEY) || 'null');
        if (!force && cached?.timestamp && Date.now() - cached.timestamp < CTB_ROUTE_STOP_DB_TTL && cached.data?.ctb && Object.keys(cached.data.ctb).length) {
          routeDb.ctb = cached.data.ctb;
          ctbRouteStopLastLoadedAt = cached.timestamp;
          return routeDb.ctb;
        }
      } catch (e) {}

      const routeJson = await fetchWithCache('https://rt.data.gov.hk/v2/transport/citybus/route/CTB');
      const routeRows = extractData(routeJson);
      const routes = [...new Set(routeRows.map(x => String(x.route || '').trim().toUpperCase()).filter(Boolean))];

      const nextIndex = { value: 0 };
      const worker = async () => {
        while (true) {
          const i = nextIndex.value++;
          if (i >= routes.length) return;
          await fetchCtbRouteStops(routes[i]);
        }
      };
      await Promise.all(Array.from({ length: Math.min(6, routes.length) }, worker));

      ctbRouteStopLastLoadedAt = Date.now();
      try { localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: ctbRouteStopLastLoadedAt, data: routeDb })); } catch (e) {}
      return routeDb.ctb;
    })();

    try { return await ctbRouteStopLoadPromise; } finally { ctbRouteStopLoadPromise = null; }
  }

  async function getHkoStationCoordinates() {
    if (cachedHkoStations) return cachedHkoStations;
    try {
      const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/opendata.php?dataType=CLIMSTAT&lang=tc');
      const json = await res.json();
      
      if (Array.isArray(json)) {
        cachedHkoStations = json.map(stn => ({
          name: stn.stationNameTC || stn.stationName || stn.name,
          lat: parseFloat(stn.latitude || stn.lat),
          lng: parseFloat(stn.longitude || stn.lng || stn.lon)
        })).filter(s => s.name && Number.isFinite(s.lat) && Number.isFinite(s.lng));
        return cachedHkoStations;
      }
    } catch (e) {
      console.warn('Failed to dynamically fetch station list, using live payload matching fallback');
    }
    return [];
  }

  function findClosestStationName(userLat, userLng, stationList) {
    if (!stationList || !stationList.length) return null;
    let closest = null;
    let minDistance = Infinity;

    stationList.forEach(stn => {
      const dist = getDistanceKm(userLat, userLng, stn.lat, stn.lng);
      if (dist < minDistance) {
        minDistance = dist;
        closest = stn.name;
      }
    });

    return closest;
  }

  async function fetchWeather() {
    try {
      const base = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php';
      
      const [rhr, flw, warnsum, fnd] = await Promise.all([
        fetchJson(`${base}?dataType=rhrread&lang=tc`),
        fetchJson(`${base}?dataType=flw&lang=tc`),
        fetchJson(`${base}?dataType=warnsum&lang=tc`),
        fetchJson(`${base}?dataType=fnd&lang=tc`)
      ]);

      const tempDataList = rhr?.temperature?.data || [];
      let matchedTemp = null;
      currentStation = '';

      if (userLocation && tempDataList.length > 0) {
        const dynamicStations = await getHkoStationCoordinates();
        
        if (dynamicStations.length > 0) {
          const nearest = findClosestStationName(userLocation.lat, userLocation.lng, dynamicStations);
          const stnData = tempDataList.find(s => s.place === nearest);
          if (stnData) {
            currentStation = stnData.place;
            matchedTemp = stnData.value;
          }
        }

        if (!matchedTemp) {
          currentStation = tempDataList[0]?.place || '';
          matchedTemp = tempDataList[0]?.value;
        }
      } else if (tempDataList.length > 0) {
        currentStation = tempDataList[0]?.place || '';
        matchedTemp = tempDataList[0]?.value;
      }

      currentTemp = Number.isFinite(Number(matchedTemp)) ? `${matchedTemp}°C` : '';

      const humidityVal = rhr?.humidity?.data?.[0]?.value;
      currentHumidity = humidityVal ? ` ${humidityVal}%` : '';
      
      const todayForecast = fnd?.weatherForecast?.[0];
      currentPsr = todayForecast?.PSR ? `降雨概率 ${todayForecast.PSR}` : '';

      const locationLabel = currentMode === 'daily' 
        ? '已儲存站點' 
        : (locationSource === 'preset-mong-kok' ? '旺角測試位置 (約300m)' : '附近站點 (約300m)');
      
      updateMetaText(locationLabel);

      let warningNames = [];
      if (warnsum && typeof warnsum === 'object') {
        warningNames = Object.values(warnsum)
          .map(w => w.name || w.code)
          .filter(Boolean);
      }

      const summaryEl = document.getElementById('weather-summary');
      const adviceEl = document.getElementById('weather-advice');
      const commuteContainer = document.getElementById('weather-commute');

      if (warningNames.length > 0) {
        if (summaryEl) summaryEl.textContent = `⚠️ 生效警告：${warningNames.join('、')}`;
        if (adviceEl) adviceEl.textContent = flw?.generalSituation || '天氣變化不穩定，建議帶備雨具並留意交通狀況。';
        if (commuteContainer) commuteContainer.className = 'weather-commute alert';
      } else {
        const forecastDesc = flw?.forecastDesc || '天氣大致良好';
        if (summaryEl) summaryEl.textContent = `🌤️ ${forecastDesc.slice(0, 30)}...`;
        if (adviceEl) adviceEl.textContent = flw?.outlook || '適合出行';
        if (commuteContainer) commuteContainer.className = 'weather-commute good';
      }

    } catch (e) {
      console.error('Weather load error:', e);
      const summaryEl = document.getElementById('weather-summary');
      if (summaryEl) summaryEl.textContent = '☁️ 天氣資料暫時未能取得';
    }
  }

  fetchWeather();
  setInterval(fetchWeather, 600000);

  function attachModeHandlers() {
    document.querySelectorAll('.mode-button').forEach(button => {
