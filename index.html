<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body>
  <header>
    <div class="title-group">
      <h1>即時巴士 ETA</h1>
      <div class="meta-info" id="meta-text">定位中...</div>
      <div class="weather-summary" id="weather-summary">☁️ 天氣資料載入中</div>
      <div class="weather-commute" id="weather-commute"><span class="weather-icon">·</span><span id="weather-advice">正在載入通勤建議...</span></div>
      <div class="weather-source" id="weather-source">天文台</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="nearby">附近即時</button>
      <button class="mode-button" data-mode="daily">我的路線</button>
      <button class="mode-button" data-mode="debug">調試 (Debug)</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="last-updated">KMB/LWB 更新 --:--</div><div id="ctb-updated">CTB 更新 --:--:--</div>
    </div>
  </div>

  <div id="toolbar-search" class="toolbar-search hidden">
    <div id="providerStatus" class="provider-status">
      <span id="kmbStatus" class="muted">KMB/LWB 更新 --:--</span>
      <span id="ctbStatus" class="muted">CTB 更新 --:--</span>
    </div>
    <input id="nearby-search" type="text" placeholder="搜尋路線號碼 (例如: 271, 1A)" autocomplete="off" />
  </div>

  <div id="eta-container">
    <div class="status-msg">正在初始化儀表板...</div>
  </div>

  <!-- DEBUG PANEL CONTAINER -->
  <div id="debug-panel" class="hidden">
    <div class="debug-section">
      <div class="debug-title">
        <span>系統 & 定位狀態</span>
        <button onclick="updateDebugPanel()" style="background:#222;color:#fff;border:1px solid #555;padding:2px 6px;border-radius:4px;cursor:pointer;">刷新 Debug</button>
      </div>
      <div id="debug-system-info">載入中...</div>
    </div>

    <div class="debug-section">
      <div class="debug-title">降雨預報 (Rain Forecast) CSV Inspector</div>
      <div id="debug-rain-info">未載入降雨資料</div>
    </div>

    <div class="debug-section">
      <div class="debug-title">最新巴士 ETA Data Stream</div>
      <div id="debug-eta-json" class="debug-json">無紀錄</div>
    </div>

    <div class="debug-section">
      <div class="debug-title">系統 Console Logs</div>
      <div id="debug-log-console" class="debug-log"></div>
    </div>
  </div>

  <div id="rain-map-panel" class="hidden">
    <div id="rain-map-header">
      <div class="title">🌧️ 降雨熱力圖預報</div>
      <div class="local-rain dry" id="rain-local-badge" title="你附近網格的半小時累計雨量">附近 -- mm</div>
      <div class="meta" id="rain-updated">載入中…</div>
    </div>
    <div id="rain-map"></div>
    
    <div class="playback-controller">
      <button class="playback-btn" id="play-prev-btn" title="上一個時段">⏮</button>
      <button class="playback-btn" id="play-toggle-btn" title="播放 / 暫停">▶</button>
      <button class="playback-btn" id="play-next-btn" title="下一個時段">⏭</button>
      <span class="playback-time-label" id="playback-time-display">--:--</span>
      <input type="range" class="playback-slider" id="playback-slider" min="0" max="0" value="0" step="1">
    </div>

    <div id="rain-map-legend">
      <span class="swatch" style="background:#7CFF7C"></span><span class="legend-label">≥0.5</span>
      <span class="swatch" style="background:#FFD700"></span><span class="legend-label">≥2.5</span>
      <span class="swatch" style="background:#FFA500"></span><span class="legend-label">≥5</span>
      <span class="swatch" style="background:#FF4500"></span><span class="legend-label">≥10</span>
      <span class="swatch" style="background:#C084FC"></span><span class="legend-label">≥20 mm</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
