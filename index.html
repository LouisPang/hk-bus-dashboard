<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
      --button-bg: #1A1A1A;
      --button-active: #FFCC00;
      --button-active-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }

    .title-group h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 1.05rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    #clock {
      font-size: 3.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    #mode-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 14px;
      min-width: 120px;
      transition: 0.2s ease;
    }

    .mode-button.active {
      background: var(--button-active);
      color: var(--button-active-text);
    }

    #last-updated {
      color: var(--subtext);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .saved-routes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      min-height: 36px;
    }

    .saved-route-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 7px 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .saved-route-chip button {
      background: transparent;
      border: none;
      color: var(--subtext);
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .eta-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 94px;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1;
    }

    .route-badge {
      background: var(--accent);
      color: #000;
      font-size: 2.7rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 10px;
      min-width: 110px;
      text-align: center;
      line-height: 1.1;
    }

    .destination {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      max-width: 52%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .eta-times {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      text-align: right;
    }

    .eta-primary {
      font-size: 2.45rem;
      font-weight: 800;
      line-height: 1;
    }

    .eta-secondary {
      font-size: 1.05rem;
      color: var(--subtext);
      font-weight: 600;
    }

    .save-route-btn {
      background: var(--button-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .save-route-btn:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }
    .muted { color: var(--subtext); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.4rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>LIVE BUS ETA</h1>
      <div class="meta-info" id="meta-text">Locating & Loading Weather...</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="daily">Daily Stops</button>
      <button class="mode-button" data-mode="nearby">Nearby Live</button>
    </div>
    <div id="last-updated">Updated --:--</div>
  </div>

  <div id="saved-routes" class="saved-routes"></div>

  <div id="eta-container">
    <div class="status-msg">Initializing Dashboard...</div>
  </div>

  <script>
    const STORAGE_KEY = 'hk-bus-dashboard.saved-routes';
    const HARDCODED_STOPS = [];
    const MAX_ROUTE_CARDS = 4;

    let allStops = [];
    let activeStopIds = [];
    let currentTemp = '';
    let currentMode = HARDCODED_STOPS.length > 0 ? 'daily' : 'nearby';
    let etaPollTimer = null;
    let savedRoutes = [];

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateLastUpdated() {
      const now = new Date();
      const timeText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('last-updated').textContent = `Updated ${timeText}`;
    }

    function loadSavedRoutes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        savedRoutes = raw ? JSON.parse(raw) : [];
      } catch (e) {
        savedRoutes = [];
      }
    }

    function saveSavedRoutes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRoutes.slice(0, 12)));
    }

    function getSavedRouteKey(route, dest, stopId) {
      return `${stopId}|${route}|${dest}`;
    }

    function isSavedRoute(route, dest, stopId) {
      const key = getSavedRouteKey(route, dest, stopId);
      return savedRoutes.some(item => item.key === key);
    }

    function addSavedRoute(route, dest, stopId) {
      const key = getSavedRouteKey(route, dest, stopId);
      if (!route || !dest || !stopId) return;
      if (isSavedRoute(route, dest, stopId)) return;
      savedRoutes.push({ key, route, dest, stopId, label: `${route} ${dest}` });
      saveSavedRoutes();
      renderSavedRoutes();
    }

    function removeSavedRoute(key) {
      savedRoutes = savedRoutes.filter(item => item.key !== key);
      saveSavedRoutes();
      renderSavedRoutes();
    }

    function renderSavedRoutes() {
      const container = document.getElementById('saved-routes');
      if (!savedRoutes.length) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = savedRoutes.map(item => `
        <div class="saved-route-chip">
          <span>${item.route} · ${item.dest}</span>
          <button type="button" data-action="remove-saved" data-key="${item.key}" aria-label="Remove saved route">×</button>
        </div>
      `).join('');
    }

    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
        const data = await res.json();
        currentTemp = `${data.temperature.data[0].value}°C`;
      } catch (e) {
        currentTemp = '';
      }
      updateMetaText();
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    function updateMetaText(statusMsg = '') {
      const parts = ['Hong Kong'];
      if (currentTemp) parts.push(currentTemp);
      if (statusMsg) parts.push(statusMsg);
      document.getElementById('meta-text').textContent = parts.join(' • ');
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function attachModeHandlers() {
      document.querySelectorAll('.mode-button').forEach(button => {
        button.addEventListener('click', async () => {
          const selectedMode = button.dataset.mode;
          if (selectedMode === currentMode) return;

          currentMode = selectedMode;
          document.querySelectorAll('.mode-button').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));

          if (currentMode === 'daily') {
            if (savedRoutes.length > 0) {
              activeStopIds = [...new Set(savedRoutes.map(item => item.stopId).filter(Boolean))];
              updateMetaText('Saved Stops');
              startEtaLoop();
            } else if (HARDCODED_STOPS.length > 0) {
              activeStopIds = HARDCODED_STOPS;
              updateMetaText('Daily Stops');
              startEtaLoop();
            } else {
              showError('No saved daily stops configured.');
            }
          } else {
            await initNearbyStops();
          }
        });
      });

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (!target) return;

        if (target.dataset.action === 'save-route') {
          const route = target.dataset.route;
          const dest = target.dataset.dest;
          const stopId = target.dataset.stop;
          addSavedRoute(route, dest, stopId);
          target.textContent = 'Saved';
          target.disabled = true;
          return;
        }

        if (target.dataset.action === 'remove-saved') {
          removeSavedRoute(target.dataset.key);
        }
      });
    }

    async function initDashboard() {
      loadSavedRoutes();
      renderSavedRoutes();
      attachModeHandlers();

      try {
        const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const json = await res.json();
        allStops = json.data || [];
      } catch (e) {
        allStops = [];
      }

      if (currentMode === 'daily') {
        if (savedRoutes.length > 0) {
          activeStopIds = [...new Set(savedRoutes.map(item => item.stopId).filter(Boolean))];
          updateMetaText('Saved Stops');
          startEtaLoop();
          return;
        }

        if (HARDCODED_STOPS.length > 0) {
          activeStopIds = HARDCODED_STOPS;
          updateMetaText('Daily Stops');
          startEtaLoop();
          return;
        }
      }

      await initNearbyStops();
    }

    async function initNearbyStops() {
      if (allStops.length === 0) {
        try {
          const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
          const json = await res.json();
          allStops = json.data || [];
        } catch (e) {
          showError('Failed to fetch nearby stop data.');
          return;
        }
      }

      if (!('geolocation' in navigator)) {
        showError('Geolocation not supported.');
        return;
      }

      navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {
        enableHighAccuracy: true,
        timeout: 10000
      });
    }

    function onLocationSuccess(position) {
      const userLat = position.coords.latitude;
      const userLong = position.coords.longitude;

      const nearbyStops = allStops.filter(stop => {
        const dist = getDistanceKm(userLat, userLong, parseFloat(stop.lat), parseFloat(stop.long));
        return dist <= 0.5;
      });

      activeStopIds = nearbyStops.map(s => s.stop);

      if (activeStopIds.length === 0) {
        document.getElementById('eta-container').innerHTML =
          '<div class="status-msg">No KMB stops found within 500m.</div>';
        updateMetaText('No nearby stops');
        return;
      }

      updateMetaText('Nearby Stops (~500m)');
      startEtaLoop();
    }

    function onLocationError() {
      showError('Location access denied.');
    }

    function stopEtaLoop() {
      if (etaPollTimer) {
        clearInterval(etaPollTimer);
        etaPollTimer = null;
      }
    }

    function startEtaLoop() {
      stopEtaLoop();
      fetchEtas();
      etaPollTimer = setInterval(fetchEtas, 20000);
    }

    async function fetchEtas() {
      if (!activeStopIds.length) {
        return;
      }

      const routeMap = {};
      const now = new Date();

      const promises = activeStopIds.map(stopId =>
        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`)
          .then(res => res.json())
          .then(json => json.data || [])
          .catch(() => [])
      );

      const results = await Promise.all(promises);

      results.flat().forEach(item => {
        if (!item || !item.route) return;

        const destination = item.dest_en || item.dest_tc || 'Unknown';
        const key = `${item.route}-${destination}`;

        if (!routeMap[key]) {
          routeMap[key] = {
            route: item.route,
            dest: destination,
            etas: [],
            hasSchedule: false
          };
        }

        if (item.eta && item.eta.trim() !== '') {
          const etaTime = new Date(item.eta);
          const diffMins = Math.round((etaTime - now) / 60000);
          if (diffMins >= 0) {
            routeMap[key].etas.push(diffMins);
          }
        } else {
          routeMap[key].hasSchedule = true;
        }
      });

      const groupedList = Object.values(routeMap)
        .map(r => {
          r.etas.sort((a, b) => a - b);
          return r;
        })
        .sort((a, b) => {
          if (a.etas.length === 0 && b.etas.length === 0) return 0;
          if (a.etas.length === 0) return 1;
          if (b.etas.length === 0) return -1;
          return a.etas[0] - b.etas[0];
        });

      renderEtas(groupedList.slice(0, MAX_ROUTE_CARDS));
      updateLastUpdated();
    }

    function renderEtas(routes) {
      const container = document.getElementById('eta-container');
      if (routes.length === 0) {
        container.innerHTML = '<div class="status-msg">No upcoming buses found.</div>';
        return;
      }

      container.innerHTML = routes.map(r => {
        const firstEta = r.etas[0];
        const nextEtas = r.etas.slice(1, 3).map(m => `${m}m`).join(', ');

        let timeClass = 'safe';
        let displayTime = `${firstEta} <span style="font-size:1.2rem">min</span>`;

        if (r.etas.length === 0) {
          timeClass = 'muted';
          displayTime = 'No schedule';
        } else if (firstEta === 0) {
          timeClass = 'due';
          displayTime = 'Due';
        } else if (firstEta <= 3) {
          timeClass = 'urgent';
        } else if (firstEta <= 7) {
          timeClass = 'warning';
        }

        const stopId = activeStopIds[0] || '';
        const isSaved = isSavedRoute(r.route, r.dest, stopId);

        return `
          <div class="eta-card">
            <div class="route-info">
              <div class="route-badge">${r.route}</div>
              <div class="destination">to ${r.dest}</div>
            </div>
            <div class="eta-times">
              <div class="eta-primary ${timeClass}">${displayTime}</div>
              ${nextEtas ? `<div class="eta-secondary">Next: ${nextEtas}</div>` : ''}
              <button class="save-route-btn" data-action="save-route" data-route="${r.route}" data-dest="${r.dest}" data-stop="${stopId}" ${isSaved ? 'disabled' : ''}>${isSaved ? 'Saved' : 'Save'}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function showError(msg) {
      document.getElementById('eta-container').innerHTML = `<div class="status-msg">${msg}</div>`;
      updateMetaText('Error');
    }

    initDashboard();
  </script>
</body>
</html>
