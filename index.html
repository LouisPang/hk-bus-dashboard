<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
      --button-bg: #1A1A1A;
      --button-active: #FFCC00;
      --button-active-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .title-group h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 1.05rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    #clock {
      font-size: 3.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    #mode-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 14px;
      min-width: 120px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .mode-button.active {
      background: var(--button-active);
      color: var(--button-active-text);
    }

    #last-updated {
      color: var(--subtext);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .toolbar-search {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .toolbar-search.hidden {
      display: none;
    }

    .toolbar-search input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      font-family: inherit;
    }

    .toolbar-search input::placeholder {
      color: var(--subtext);
    }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .stop-group {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 204, 0, 0.05);
    }

    .stop-header-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-header-distance {
      font-size: 0.72rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .stop-card-list {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .eta-card {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 52px;
      min-height: 52px;
      max-height: 52px;
      flex-shrink: 0;
    }

    .eta-card:last-child {
      border-bottom: none;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .route-badge {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      min-width: 58px;
      text-align: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .destination {
      font-size: 1rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .eta-times {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .eta-primary {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .eta-primary .unit {
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 1px;
    }

    .eta-secondary {
      font-size: 0.75rem;
      color: var(--subtext);
      font-weight: 500;
      white-space: nowrap;
    }

    .save-route-btn {
      background: transparent;
      color: var(--subtext);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: transform 0.1s ease, color 0.1s ease;
    }

    .save-route-btn.saved {
      color: var(--accent);
    }

    .save-route-btn:active {
      transform: scale(1.2);
    }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }
    .muted { color: var(--subtext); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.4rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 60px;
    }

    @media (min-width: 700px) {
      #eta-container.daily-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-content: start;
      }

      #eta-container.daily-columns .stop-group {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>即時巴士 ETA</h1>
      <div class="meta-info" id="meta-text">定位中 • 正在載入天氣...</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="daily">每日站點</button>
      <button class="mode-button" data-mode="nearby">附近即時</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="last-updated">更新 --:--</div>
    </div>
  </div>

  <div id="toolbar-search" class="toolbar-search hidden">
    <input id="nearby-search" type="text" placeholder="搜尋路線號碼 (例如: 271, 1A)" autocomplete="off" />
  </div>

  <div id="eta-container">
    <div class="status-msg">正在初始化儀表板...</div>
  </div>

  <script>
    const STORAGE_KEY = 'hk-bus-dashboard.saved-routes';
    const ROUTE_DB_KEY = 'hk-bus-dashboard.route-db';
    const ROUTE_DB_TTL = 86400000;
    const PROVIDERS = [
      { id: 'kmb', label: 'KMB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' },
      { id: 'lwb', label: 'LWB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' }
    ];

    let allStops = [];
    let stopMetaMap = {};
    let routeDb = null;
    let userLocation = null;
    let activeStopIds = [];
    let nearbyStopIds = [];
    let currentTemp = '';
    let currentMode = 'daily';
    let etaPollTimer = null;
    let savedRoutes = [];

    function debounce(func, delay = 300) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => func(...args), delay);
      };
    }

    function getProviderApiBase(providerId) {
      const provider = PROVIDERS.find(p => p.id === providerId) || PROVIDERS[0];
      return provider.api;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateLastUpdated(providerId = 'kmb') {
      const now = new Date();
      const timeText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const providerLabel = (providerId || 'kmb').toUpperCase();
      document.getElementById('last-updated').textContent = `${providerLabel} 更新 ${timeText}`;
    }

    function getCompanyColours(providerIds) {
      const companyMap = { kmb: '#E31E25', lwb: '#2A8F9C' };
      const list = Array.isArray(providerIds) ? providerIds : [providerIds || 'kmb'];
      const normalized = list.filter(Boolean).map(id => companyMap[id] || companyMap[id.toLowerCase?.() || id] || companyMap.kmb);
      if (normalized.length === 1) return normalized[0];
      if (normalized.length >= 2) {
        return `linear-gradient(90deg, ${normalized[0]} 0 50%, ${normalized[1]} 50% 100%)`;
      }
      return companyMap.kmb;
    }

    async function getOrFetchRouteDB() {
      if (routeDb) return routeDb;
      try {
        const cached = localStorage.getItem(ROUTE_DB_KEY);
        if (cached) {
          const { timestamp, data } = JSON.parse(cached);
          if (Date.now() - timestamp < ROUTE_DB_TTL) {
            routeDb = data;
            return routeDb;
          }
        }
      } catch (e) { /* ignore cache read error */ }

      try {
        const res = await fetch(`${getProviderApiBase('kmb')}/route-stop`);
        if (!res.ok) return {};
        const json = await res.json();
        const list = Array.isArray(json.data) ? json.data : [];

        const db = {};
        list.forEach(item => {
          const r = item.route.toUpperCase();
          if (!db[r]) db[r] = [];
          db[r].push({
            stopId: item.stop,
            seq: parseInt(item.seq, 10),
            bound: item.bound
          });
        });

        routeDb = db;
        localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({
          timestamp: Date.now(),
          data: db
        }));
        return db;
      } catch (e) {
        return {};
      }
    }

    function loadSavedRoutes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        savedRoutes = raw ? JSON.parse(raw) : [];
      } catch (e) {
        savedRoutes = [];
      }
    }

    function saveSavedRoutes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRoutes.slice(0, 12)));
    }

    function buildStopMetaMap() {
      stopMetaMap = {};
      allStops.forEach(stop => {
        if (stop && stop.stop) {
          stopMetaMap[stop.stop] = stop.name_tc || stop.name_en || stop.stop;
        }
      });
    }

    function getSavedRouteKey(route, dest, stopId, provider = 'kmb') {
      return `${provider}|${route}|${dest}|${stopId}`;
    }

    function getSavedRouteKeys() {
      return new Set(savedRoutes.map(item => getSavedRouteKey(item.route, item.dest, item.stopId, item.provider || 'kmb')));
    }

    function isSavedRoute(route, dest, stopId, provider = 'kmb') {
      const key = getSavedRouteKey(route, dest, stopId, provider);
      return savedRoutes.some(item => getSavedRouteKey(item.route, item.dest, item.stopId, item.provider || 'kmb') === key);
    }

    function addSavedRoute(route, dest, stopId, provider = 'kmb') {
      const key = getSavedRouteKey(route, dest, stopId, provider);
      if (!route || !dest || !stopId) return;
      if (isSavedRoute(route, dest, stopId, provider)) return;
      const stopName = stopMetaMap[stopId] || '此站';
      savedRoutes.push({ key, route, dest, stopId, provider, stopName, label: `${route} ${dest}` });
      saveSavedRoutes();
    }

    function removeSavedRoute(key) {
      savedRoutes = savedRoutes.filter(item => item.key !== key);
      saveSavedRoutes();
    }

    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        currentTemp = `${data.temperature.data[0].value}°C`;
      } catch (e) {
        currentTemp = '';
      }
      updateMetaText();
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    function updateMetaText(statusMsg = '') {
      const parts = ['香港'];
      if (currentTemp) parts.push(currentTemp);
      if (statusMsg) parts.push(statusMsg);
      document.getElementById('meta-text').textContent = parts.join(' • ');
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateSearchVisibility() {
      const searchWrap = document.getElementById('toolbar-search');
      const searchInput = document.getElementById('nearby-search');
      if (!searchWrap || !searchInput) return;
      const shouldShow = currentMode === 'nearby';
      searchWrap.classList.toggle('hidden', !shouldShow);
      if (!shouldShow) {
        searchInput.value = '';
      }
    }

    function attachModeHandlers() {
      document.querySelectorAll('.mode-button').forEach(button => {
        button.addEventListener('click', async () => {
          const selectedMode = button.dataset.mode;
          if (selectedMode === currentMode) return;

          currentMode = selectedMode;
          document.querySelectorAll('.mode-button').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
          updateSearchVisibility();

          try {
            const etaContainerEl = document.getElementById('eta-container');
            if (etaContainerEl) etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');
          } catch (e) { /* ignore */ }

          if (currentMode === 'daily') {
            if (savedRoutes.length > 0) {
              activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })).filter(Boolean))];
              updateMetaText('已儲存站點');
              startEtaLoop();
            } else {
              activeStopIds = [];
              document.getElementById('eta-container').innerHTML = '';
              updateMetaText('已儲存站點');
            }
          } else {
            await initNearbyStops();
          }
        });
      });

      const searchInput = document.getElementById('nearby-search');
      if (searchInput) {
        searchInput.addEventListener('input', debounce(async (event) => {
          if (currentMode !== 'nearby') return;
          const value = event.target.value.trim().toUpperCase();

          if (!value) {
            activeStopIds = nearbyStopIds.slice();
            startEtaLoop();
            return;
          }

          const db = await getOrFetchRouteDB();
          let targetStops = [];

          if (db[value]) {
            targetStops = db[value].map(s => ({ stopId: s.stopId, provider: 'kmb' }));
          } else {
            const matchingRoutes = Object.keys(db).filter(r => r.includes(value));
            const stopSet = new Set();
            matchingRoutes.forEach(r => db[r].forEach(s => stopSet.add(s.stopId)));
            targetStops = Array.from(stopSet).slice(0, 80).map(stopId => ({ stopId, provider: 'kmb' }));
          }

          if (targetStops.length === 0) {
            document.getElementById('eta-container').innerHTML =
              '<div class="status-msg">沒有符合搜尋條件的路線。</div>';
            return;
          }

          activeStopIds = targetStops;
          startEtaLoop();
        }, 300));
      }

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (!target) return;

        if (target.dataset.action === 'save-route') {
          const route = target.dataset.route;
          const dest = target.dataset.dest;
          const stopId = target.dataset.stop;
          const provider = target.dataset.provider || 'kmb';
          addSavedRoute(route, dest, stopId, provider);
          target.dataset.action = 'remove-saved-route';
          target.textContent = '★';
          target.classList.add('saved');
          return;
        }

        if (target.dataset.action === 'remove-saved-route') {
          const route = target.dataset.route;
          const dest = target.dataset.dest;
          const stopId = target.dataset.stop;
          const provider = target.dataset.provider || 'kmb';
          removeSavedRoute(getSavedRouteKey(route, dest, stopId, provider));
          target.dataset.action = 'save-route';
          target.textContent = '☆';
          target.classList.remove('saved');
          return;
        }
      });
    }

    async function initDashboard() {
      loadSavedRoutes();
      attachModeHandlers();

      try {
        const etaContainerEl = document.getElementById('eta-container');
        if (etaContainerEl) etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');
      } catch (e) { /* ignore */ }

      await initStops();
      getOrFetchRouteDB();

      if (currentMode === 'daily') {
        if (savedRoutes.length > 0) {
          activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })).filter(Boolean))];
          updateMetaText('已儲存站點');
          startEtaLoop();
          return;
        }

        activeStopIds = [];
        document.getElementById('eta-container').innerHTML = '';
        updateMetaText('已儲存站點');
        return;
      }

      await initNearbyStops();
    }

    async function fetchKmbStops() {
      try {
        const res = await fetch(`${getProviderApiBase('kmb')}/stop`);
        if (!res.ok) return [];
        const json = await res.json();
        const items = Array.isArray(json) ? json : Array.isArray(json.data) ? json.data : [];
        return items.map(stop => ({ ...stop, provider: 'kmb' }));
      } catch (error) {
        return [];
      }
    }

    async function initStops() {
      allStops = await fetchKmbStops();
      buildStopMetaMap();
    }

    async function initNearbyStops() {
      if (allStops.length === 0) {
        await initStops();
      }

      if (!('geolocation' in navigator)) {
        showError('不支援定位功能。');
        return;
      }

      navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {
        enableHighAccuracy: true,
        timeout: 10000
      });
    }

    function onLocationSuccess(position) {
      const userLat = position.coords.latitude;
      const userLong = position.coords.longitude;
      userLocation = { lat: userLat, lng: userLong };

      const nearbyStops = allStops.filter(stop => {
        const dist = getDistanceKm(userLat, userLong, parseFloat(stop.lat), parseFloat(stop.long));
        return dist <= 0.3;
      });

      nearbyStopIds = nearbyStops.map(stop => ({ stopId: stop.stop, provider: stop.provider || 'kmb' }));
      activeStopIds = nearbyStopIds.slice();

      if (activeStopIds.length === 0) {
        document.getElementById('eta-container').innerHTML =
          '<div class="status-msg">300公尺範圍內沒有巴士站。</div>';
        updateMetaText('沒有附近站點');
        return;
      }

      updateMetaText('附近站點（約300公尺）');
      startEtaLoop();
    }

    function onLocationError() {
      showError('位置存取被拒絕。');
    }

    function stopEtaLoop() {
      if (etaPollTimer) {
        clearInterval(etaPollTimer);
        etaPollTimer = null;
      }
    }

    function startEtaLoop() {
      stopEtaLoop();
      fetchEtas();
      etaPollTimer = setInterval(fetchEtas, 20000);
    }

    async function fetchKmbStopEta(stopId) {
      try {
        const res = await fetch(`${getProviderApiBase('kmb')}/stop-eta/${stopId}`);
        if (!res.ok) return [];
        const json = await res.json();
        return Array.isArray(json) ? json : Array.isArray(json.data) ? json.data : [];
      } catch (error) {
        return [];
      }
    }

    async function fetchEtas() {
      if (!activeStopIds.length) return;

      const routeMap = {};
      const now = new Date();
      const promises = [];
      const seenPairs = new Set();

      if (currentMode === 'daily' && savedRoutes.length > 0) {
        for (const savedRoute of savedRoutes) {
          const provider = savedRoute.provider || 'kmb';
          const stopId = savedRoute.stopId;
          const route = savedRoute.route;
          const pairKey = `${provider}|${stopId}|${route}`;
          if (seenPairs.has(pairKey)) continue;
          seenPairs.add(pairKey);

          promises.push((async () => {
            const itemsAll = await fetchKmbStopEta(stopId);
            const items = Array.isArray(itemsAll) ? itemsAll.filter(it => String(it.route) === String(route)) : [];
            return { stopId, provider, items };
          })());
        }
      } else {
        promises.push(...activeStopIds.map(async ({ stopId, provider } = {}) => {
          const providerId = provider || 'kmb';
          const items = await fetchKmbStopEta(stopId);
          return { stopId, provider: providerId, items };
        }));
      }

      const stopResponses = await Promise.allSettled(promises);
      const resolvedResponses = stopResponses.flatMap(result => result.status === 'fulfilled' ? [result.value] : []);

      resolvedResponses.forEach(({ stopId, provider, items }) => {
        const stopLabel = stopMetaMap[stopId] || '此站';
        const stopInfo = allStops.find(stop => stop && stop.stop === stopId);
        const stopDistance = userLocation && stopInfo
          ? getDistanceKm(userLocation.lat, userLocation.lng, parseFloat(stopInfo.lat), parseFloat(stopInfo.long))
          : Number.POSITIVE_INFINITY;

        items.forEach(item => {
          if (!item || !item.route) return;

          const destination = item.dest_tc || item.dest_en || '未知';
          const routeKey = getSavedRouteKey(item.route, destination, stopId, provider || 'kmb');
          const dailySavedRouteKeys = currentMode === 'daily' && savedRoutes.length > 0 ? getSavedRouteKeys() : null;
          if (dailySavedRouteKeys && !dailySavedRouteKeys.has(routeKey)) return;

          const key = `${provider || 'kmb'}-${stopId}-${item.route}-${destination}`;

          if (!routeMap[key]) {
            routeMap[key] = {
              route: item.route,
              dest: destination,
              stopId: stopId,
              provider: provider || 'kmb',
              stopName: stopLabel,
              stopDistance: stopDistance,
              etas: []
            };
          }

          if (item.eta && item.eta.trim() !== '') {
            const etaTime = new Date(item.eta);
            const diffMins = Math.round((etaTime - now) / 60000);
            if (diffMins >= 0) {
              routeMap[key].etas.push(diffMins);
            }
          }
        });
      });

      const groupedList = Object.values(routeMap).map(r => {
        r.etas.sort((a, b) => a - b);
        return r;
      });

      renderEtas(groupedList);
      updateLastUpdated('kmb');
    }

    function renderEtas(routes) {
      const container = document.getElementById('eta-container');
      if (routes.length === 0) {
        const searchInput = document.getElementById('nearby-search');
        const query = searchInput && currentMode === 'nearby' ? searchInput.value.trim() : '';
        container.innerHTML = `<div class="status-msg">${query ? '沒有符合搜尋條件的巴士。' : '沒有即將到達的巴士。'}</div>`;
        return;
      }

      const stopsMap = new Map();
      routes.forEach(r => {
        const stopId = r.stopId || 'unknown';
        if (!stopsMap.has(stopId)) {
          stopsMap.set(stopId, {
            stopId,
            stopName: r.stopName || '站點資料未提供',
            stopDistance: r.stopDistance,
            items: []
          });
        }
        stopsMap.get(stopId).items.push(r);
      });

      const sortedStops = [...stopsMap.values()].sort((a, b) => {
        const getMinEta = (stop) => {
          let min = Infinity;
          stop.items.forEach(item => {
            if (item.etas && item.etas.length > 0 && item.etas[0] < min) {
              min = item.etas[0];
            }
          });
          return min;
        };

        const minEtaA = getMinEta(a);
        const minEtaB = getMinEta(b);

        if (minEtaA !== minEtaB) return minEtaA - minEtaB;

        const distA = Number.isFinite(a.stopDistance) ? a.stopDistance : Infinity;
        const distB = Number.isFinite(b.stopDistance) ? b.stopDistance : Infinity;
        if (distA !== distB) return distA - distB;

        return a.stopName.localeCompare(b.stopName, 'zh-HK');
      });

      container.innerHTML = sortedStops.map(({ stopId, stopName, stopDistance, items }) => {
        const stopDistanceText = Number.isFinite(stopDistance)
          ? `${Math.round(stopDistance * 1000)}m`
          : '站點';

        items.sort((a, b) => {
          const etaA = (a.etas && a.etas.length > 0) ? a.etas[0] : Infinity;
          const etaB = (b.etas && b.etas.length > 0) ? b.etas[0] : Infinity;
          return etaA - etaB;
        });

        const cardMarkup = items.map(r => {
          const firstEta = r.etas[0];
          // Reverse secondary ETAs so Left = later (3rd ETA), Middle = next (2nd ETA)
          const nextEtas = r.etas.slice(1, 3).reverse().join(' | ');

          let timeClass = 'safe';
          let displayTime = `${firstEta}<span class="unit">分</span>`;

          if (r.etas.length === 0) {
            timeClass = 'muted';
            displayTime = '暫無';
          } else if (firstEta === 0) {
            timeClass = 'due';
            displayTime = '到站';
          } else if (firstEta <= 3) {
            timeClass = 'urgent';
          } else if (firstEta <= 7) {
            timeClass = 'warning';
          }

          const provider = r.provider || 'kmb';
          const isSaved = isSavedRoute(r.route, r.dest, stopId, provider);
          const action = isSaved ? 'remove-saved-route' : 'save-route';
          const starIcon = isSaved ? '★' : '☆';
          const savedClass = isSaved ? 'saved' : '';

          return `
            <div class="eta-card">
              <div class="route-info">
                <div class="route-badge" style="background: ${getCompanyColours(provider)};">${r.route}</div>
                <div class="destination">${r.dest}</div>
              </div>
              <div class="eta-times">
                ${nextEtas ? `<div class="eta-secondary">${nextEtas}</div>` : ''}
                <div class="eta-primary ${timeClass}">${displayTime}</div>
                <button class="save-route-btn ${savedClass}" data-action="${action}" data-route="${r.route}" data-dest="${r.dest}" data-stop="${stopId}" data-provider="${provider}">${starIcon}</button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="stop-group">
            <div class="stop-header">
              <div class="stop-header-title">${stopName}</div>
              <div class="stop-header-distance">${stopDistanceText}</div>
            </div>
            <div class="stop-card-list">${cardMarkup}</div>
          </div>
        `;
      }).join('');
    }

    function showError(msg) {
      document.getElementById('eta-container').innerHTML = `<div class="status-msg">${msg}</div>`;
      updateMetaText('錯誤');
    }

    updateSearchVisibility();
    initDashboard();
  </script>
</body>
</html>
