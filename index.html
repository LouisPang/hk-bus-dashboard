<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
      --button-bg: #1A1A1A;
      --button-active: #FFCC00;
      --button-active-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }

    .title-group h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 1.05rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    #clock {
      font-size: 3.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    #mode-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 14px;
      min-width: 120px;
      transition: 0.2s ease;
    }

    .mode-button.active {
      background: var(--button-active);
      color: var(--button-active-text);
    }

    #last-updated {
      color: var(--subtext);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .toolbar-search {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
    }

    .toolbar-search.hidden {
      display: none;
    }

    .toolbar-search input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      font-family: inherit;
    }

    .toolbar-search input::placeholder {
      color: var(--subtext);
    }

    .saved-routes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      min-height: 36px;
    }

    .saved-route-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 7px 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .saved-route-chip button {
      background: transparent;
      border: none;
      color: var(--subtext);
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .stop-group {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: visible;
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
    }

    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 204, 0, 0.05);
    }

    .stop-header-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-header-distance {
      font-size: 0.72rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .stop-card-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
    }

    .eta-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 82px;
      min-height: 82px;
      max-height: 82px;
      flex-shrink: 0;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1;
    }

    .route-badge {
      background: var(--accent);
      color: #000;
      font-size: 2rem;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 10px;
      min-width: 82px;
      text-align: center;
      line-height: 1.1;
    }

    .route-copy {
      display: flex;
      flex-direction: column;
      min-width: 0;
      justify-content: center;
      gap: 2px;
      max-width: 52%;
    }

    .destination {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-name {
      font-size: 0.75rem;
      color: var(--subtext);
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .eta-times {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      text-align: right;
    }

    .eta-primary {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .eta-secondary {
      font-size: 0.9rem;
      color: var(--subtext);
      font-weight: 600;
    }

    .save-route-btn {
      background: var(--button-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .save-route-btn:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }
    .muted { color: var(--subtext); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.4rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>即時巴士 ETA</h1>
      <div class="meta-info" id="meta-text">定位中 • 正在載入天氣...</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="daily">每日站點</button>
      <button class="mode-button" data-mode="nearby">附近即時</button>
    </div>
    <div id="last-updated">更新 --:--</div>
  </div>

  <div id="toolbar-search" class="toolbar-search hidden">
    <input id="nearby-search" type="text" placeholder="搜尋路線 / 站名 / 目的地" autocomplete="off" />
  </div>

  <div id="saved-routes" class="saved-routes"></div>

  <div id="eta-container">
    <div class="status-msg">正在初始化儀表板...</div>
  </div>

  <script>
    const STORAGE_KEY = 'hk-bus-dashboard.saved-routes';
    const HARDCODED_STOPS = [];
    const MAX_ROUTE_CARDS = Number.MAX_SAFE_INTEGER;
    const PROVIDERS = [
      { id: 'kmb', label: 'KMB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' }
    ];

    let allStops = [];
    let stopMetaMap = {};
    let userLocation = null;
    let activeStopIds = [];
    let nearbyStopIds = [];
    let currentTemp = '';
    let currentMode = 'daily';
    let etaPollTimer = null;
    let savedRoutes = [];
    let latestNearbyRoutes = [];

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateLastUpdated() {
      const now = new Date();
      const timeText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('last-updated').textContent = `更新 ${timeText}`;
    }

    function getProviderById(providerId) {
      return PROVIDERS.find(provider => provider.id === providerId) || PROVIDERS[0];
    }

    function loadSavedRoutes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        savedRoutes = raw ? JSON.parse(raw) : [];
      } catch (e) {
        savedRoutes = [];
      }
    }

    function saveSavedRoutes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRoutes.slice(0, 12)));
    }

    function buildStopMetaMap() {
      stopMetaMap = {};
      allStops.forEach(stop => {
        if (stop && stop.stop) {
          stopMetaMap[stop.stop] = stop.name_tc || stop.name_en || stop.stop;
        }
      });
    }

    function getSavedRouteKey(route, dest, stopId, provider = 'kmb') {
      return `${provider}|${route}|${dest}|${stopId}`;
    }

    function getSavedRouteKeys() {
      return new Set(savedRoutes.map(item => getSavedRouteKey(item.route, item.dest, item.stopId, item.provider || 'kmb')));
    }

    function isSavedRoute(route, dest, stopId, provider = 'kmb') {
      const key = getSavedRouteKey(route, dest, stopId, provider);
      return savedRoutes.some(item => getSavedRouteKey(item.route, item.dest, item.stopId, item.provider || 'kmb') === key);
    }

    function addSavedRoute(route, dest, stopId, provider = 'kmb') {
      const key = getSavedRouteKey(route, dest, stopId, provider);
      if (!route || !dest || !stopId) return;
      if (isSavedRoute(route, dest, stopId, provider)) return;
      const stopName = stopMetaMap[stopId] || '此站';
      savedRoutes.push({ key, route, dest, stopId, provider, stopName, label: `${route} ${dest}` });
      saveSavedRoutes();
      renderSavedRoutes();
    }

    function removeSavedRoute(key) {
      savedRoutes = savedRoutes.filter(item => item.key !== key);
      saveSavedRoutes();
      renderSavedRoutes();
    }

    function renderSavedRoutes() {
      const container = document.getElementById('saved-routes');
      if (!savedRoutes.length) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = savedRoutes.map(item => `
        <div class="saved-route-chip" title="${item.stopName}">
          <span>${item.route} · ${item.dest} · ${item.stopName}</span>
          <button type="button" data-action="remove-saved" data-key="${item.key}" aria-label="移除儲存站點">×</button>
        </div>
      `).join('');
    }

    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        currentTemp = `${data.temperature.data[0].value}°C`;
      } catch (e) {
        currentTemp = '';
      }
      updateMetaText();
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    function updateMetaText(statusMsg = '') {
      const parts = ['香港'];
      if (currentTemp) parts.push(currentTemp);
      if (statusMsg) parts.push(statusMsg);
      document.getElementById('meta-text').textContent = parts.join(' • ');
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateSearchVisibility() {
      const searchWrap = document.getElementById('toolbar-search');
      const searchInput = document.getElementById('nearby-search');
      if (!searchWrap || !searchInput) return;
      const shouldShow = currentMode === 'nearby';
      searchWrap.classList.toggle('hidden', !shouldShow);
      if (!shouldShow) {
        searchInput.value = '';
      }
    }

    function attachModeHandlers() {
      document.querySelectorAll('.mode-button').forEach(button => {
        button.addEventListener('click', async () => {
          const selectedMode = button.dataset.mode;
          if (selectedMode === currentMode) return;

          currentMode = selectedMode;
          document.querySelectorAll('.mode-button').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
          updateSearchVisibility();

          if (currentMode === 'daily') {
            if (savedRoutes.length > 0) {
              activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })).filter(Boolean))];
              updateMetaText('已儲存站點');
              startEtaLoop();
            } else {
              activeStopIds = [];
              document.getElementById('eta-container').innerHTML = '';
              updateMetaText('已儲存站點');
            }
          } else {
            await initNearbyStops();
          }
        });
      });

      const searchInput = document.getElementById('nearby-search');
      if (searchInput) {
        searchInput.addEventListener('input', (event) => {
          if (currentMode !== 'nearby') return;
          const value = event.target.value.trim().toLowerCase();

          if (value) {
            activeStopIds = allStops.map(stop => ({ stopId: stop.stop, provider: stop.provider || 'kmb' }));
            startEtaLoop();
            return;
          }

          activeStopIds = nearbyStopIds.slice();
          startEtaLoop();
        });
      }

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (!target) return;

        if (target.dataset.action === 'save-route') {
          const route = target.dataset.route;
          const dest = target.dataset.dest;
          const stopId = target.dataset.stop;
          const provider = target.dataset.provider || 'kmb';
          addSavedRoute(route, dest, stopId, provider);
          target.textContent = '已儲存';
          target.disabled = true;
          return;
        }

        if (target.dataset.action === 'remove-saved') {
          removeSavedRoute(target.dataset.key);
        }
      });
    }

    async function initDashboard() {
      loadSavedRoutes();
      renderSavedRoutes();
      attachModeHandlers();

      await initStops();
      if (currentMode === 'daily') {
        if (savedRoutes.length > 0) {
          activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })).filter(Boolean))];
          updateMetaText('已儲存站點');
          startEtaLoop();
          return;
        }

        activeStopIds = [];
        document.getElementById('eta-container').innerHTML = '';
        updateMetaText('已儲存站點');
        return;
      }

      await initNearbyStops();
    }

    async function initStops() {
      const providerList = [PROVIDERS[0].id];
      const stopRequests = providerList.map(async (providerId) => {
        const provider = getProviderById(providerId);
        try {
          const res = await fetch(`${provider.api}/stop`);
          if (!res.ok) return [];
          const json = await res.json();
          return (json.data || []).map(stop => ({ ...stop, provider: provider.id }));
        } catch (e) {
          return [];
        }
      });

      const stopSets = await Promise.all(stopRequests);
      allStops = stopSets.flat();
      buildStopMetaMap();
    }

    async function initNearbyStops() {
      if (allStops.length === 0) {
        await initStops();
      }

      if (!('geolocation' in navigator)) {
        showError('不支援定位功能。');
        return;
      }

      navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {
        enableHighAccuracy: true,
        timeout: 10000
      });
    }

    function onLocationSuccess(position) {
      const userLat = position.coords.latitude;
      const userLong = position.coords.longitude;
      userLocation = { lat: userLat, lng: userLong };

      const nearbyStops = allStops.filter(stop => {
        const dist = getDistanceKm(userLat, userLong, parseFloat(stop.lat), parseFloat(stop.long));
        return dist <= 0.5;
      });

      nearbyStopIds = nearbyStops.map(stop => ({ stopId: stop.stop, provider: stop.provider || 'kmb' }));
      activeStopIds = nearbyStopIds.slice();

      if (activeStopIds.length === 0) {
        document.getElementById('eta-container').innerHTML =
          '<div class="status-msg">500公尺範圍內沒有巴士站。</div>';
        updateMetaText('沒有附近站點');
        return;
      }

      updateMetaText('附近站點（約500公尺）');
      startEtaLoop();
    }

    function onLocationError() {
      showError('位置存取被拒絕。');
    }

    function stopEtaLoop() {
      if (etaPollTimer) {
        clearInterval(etaPollTimer);
        etaPollTimer = null;
      }
    }

    function startEtaLoop() {
      stopEtaLoop();
      fetchEtas();
      etaPollTimer = setInterval(fetchEtas, 20000);
    }

    async function fetchEtas() {
      if (!activeStopIds.length) {
        return;
      }

      const routeMap = {};
      const now = new Date();

      const stopResponses = await Promise.all(activeStopIds.map(async ({ stopId, provider } = {}) => {
        const providerId = provider || 'kmb';
        try {
          const providerUrl = getProviderById(providerId).api;
          const res = await fetch(`${providerUrl}/stop-eta/${stopId}`);
          const json = await res.json();
          return { stopId, provider: providerId, items: json.data || [] };
        } catch (e) {
          return { stopId, provider: providerId, items: [] };
        }
      }));

      stopResponses.forEach(({ stopId, provider, items }) => {
        const stopLabel = stopMetaMap[stopId] || '此站';
        const stopInfo = allStops.find(stop => stop && stop.stop === stopId && (stop.provider || 'kmb') === provider)
          || allStops.find(stop => stop && stop.stop === stopId);
        const stopDistance = userLocation && stopInfo
          ? getDistanceKm(userLocation.lat, userLocation.lng, parseFloat(stopInfo.lat), parseFloat(stopInfo.long))
          : Number.POSITIVE_INFINITY;

        items.forEach(item => {
          if (!item || !item.route) return;

          const destination = item.dest_tc || item.dest_en || item.dest_sc || '未知';
          const routeKey = getSavedRouteKey(item.route, destination, stopId, provider || 'kmb');
          const dailySavedRouteKeys = currentMode === 'daily' && savedRoutes.length > 0 ? getSavedRouteKeys() : null;
          const isDailySavedRoute = dailySavedRouteKeys && !dailySavedRouteKeys.has(routeKey);
          if (isDailySavedRoute) return;

          const key = `${provider || 'kmb'}-${stopId}-${item.route}-${destination}`;

          if (!routeMap[key]) {
            routeMap[key] = {
              route: item.route,
              dest: destination,
              stopId: stopId,
              provider: provider || 'kmb',
              stopName: stopLabel,
              stopDistance: stopDistance,
              etas: []
            };
          }

          if (item.eta && item.eta.trim() !== '') {
            const etaTime = new Date(item.eta);
            const diffMins = Math.round((etaTime - now) / 60000);
            if (diffMins >= 0) {
              routeMap[key].etas.push(diffMins);
            }
          }
        });
      });

      const groupedList = Object.values(routeMap)
        .map(r => {
          r.etas.sort((a, b) => a - b);
          return r;
        })
        .sort((a, b) => {
          const distanceDiff = (a.stopDistance ?? Number.POSITIVE_INFINITY) - (b.stopDistance ?? Number.POSITIVE_INFINITY);
          if (distanceDiff !== 0) return distanceDiff;
          if (a.etas.length === 0 && b.etas.length === 0) return 0;
          if (a.etas.length === 0) return 1;
          if (b.etas.length === 0) return -1;
          return a.etas[0] - b.etas[0];
        });

      latestNearbyRoutes = groupedList.slice(0, MAX_ROUTE_CARDS);
      const currentSearch = document.getElementById('nearby-search');
      const searchTerm = currentSearch ? currentSearch.value.trim().toLowerCase() : '';
      const finalRoutes = searchTerm && currentMode === 'nearby'
        ? latestNearbyRoutes.filter(route => {
            const haystack = [
              String(route.route),
              route.dest || '',
              route.stopName || '',
              String(route.stopId || '')
            ].join(' ').toLowerCase();
            return haystack.includes(searchTerm);
          })
        : latestNearbyRoutes;

      renderEtas(finalRoutes);
      updateLastUpdated();
    }

    function renderEtas(routes) {
      const container = document.getElementById('eta-container');
      if (routes.length === 0) {
        const searchInput = document.getElementById('nearby-search');
        const query = searchInput && currentMode === 'nearby' ? searchInput.value.trim() : '';
        container.innerHTML = `<div class="status-msg">${query ? '沒有符合搜尋條件的巴士。' : '沒有即將到達的巴士。'}</div>`;
        return;
      }

      const stopsMap = new Map();
      routes.forEach(r => {
        const stopId = r.stopId || 'unknown';
        if (!stopsMap.has(stopId)) {
          stopsMap.set(stopId, {
            stopId,
            stopName: r.stopName || '站點資料未提供',
            stopDistance: r.stopDistance,
            items: []
          });
        }
        stopsMap.get(stopId).items.push(r);
      });

      container.innerHTML = [...stopsMap.values()].map(({ stopId, stopName, stopDistance, items }) => {
        const stopDistanceText = Number.isFinite(stopDistance)
          ? `${Math.round(stopDistance * 1000)}m`
          : '站點';

        const cardMarkup = items.map(r => {
          const firstEta = r.etas[0];
          const nextEtas = r.etas.slice(1, 3).map(m => `${m}分鐘`).join('、');

          let timeClass = 'safe';
          let displayTime = `${firstEta} <span style="font-size:1.2rem">分鐘</span>`;

          if (r.etas.length === 0) {
            timeClass = 'muted';
            displayTime = '暫無班次';
          } else if (firstEta === 0) {
            timeClass = 'due';
            displayTime = '即將到達';
          } else if (firstEta <= 3) {
            timeClass = 'urgent';
          } else if (firstEta <= 7) {
            timeClass = 'warning';
          }

          const provider = r.provider || 'kmb';
          const isSaved = isSavedRoute(r.route, r.dest, stopId, provider);

          return `
            <div class="eta-card">
              <div class="route-info">
                <div class="route-badge">${r.route}</div>
                <div class="route-copy">
                  <div class="destination">往 ${r.dest}</div>
                </div>
              </div>
              <div class="eta-times">
                <div class="eta-primary ${timeClass}">${displayTime}</div>
                ${nextEtas ? `<div class="eta-secondary">下一班: ${nextEtas}</div>` : ''}
                <button class="save-route-btn" data-action="save-route" data-route="${r.route}" data-dest="${r.dest}" data-stop="${stopId}" data-provider="${provider}" ${isSaved ? 'disabled' : ''}>${isSaved ? '已儲存' : '儲存'}</button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="stop-group">
            <div class="stop-header">
              <div class="stop-header-title">${stopName}</div>
              <div class="stop-header-distance">${stopDistanceText}</div>
            </div>
            <div class="stop-card-list">${cardMarkup}</div>
          </div>
        `;
      }).join('');
    }

    function showError(msg) {
      document.getElementById('eta-container').innerHTML = `<div class="status-msg">${msg}</div>`;
      updateMetaText('錯誤');
    }

    updateSearchVisibility();
    initDashboard();
  </script>
</body>
</html>
