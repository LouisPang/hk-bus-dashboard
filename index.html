<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
      --button-bg: #1A1A1A;
      --button-active: #FFCC00;
      --button-active-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .title-group h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 1.05rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    #clock {
      font-size: 3.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    #mode-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 14px;
      min-width: 120px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .mode-button.active {
      background: var(--button-active);
      color: var(--button-active-text);
    }

    #last-updated {
      color: var(--subtext);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .toolbar-search {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .toolbar-search.hidden {
      display: none;
    }

    .toolbar-search input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      font-family: inherit;
    }

    .toolbar-search input::placeholder {
      color: var(--subtext);
    }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .stop-group {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 204, 0, 0.05);
    }

    .stop-header-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-header-distance {
      font-size: 0.72rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .stop-card-list {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .eta-card {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 52px;
      min-height: 52px;
      max-height: 52px;
      flex-shrink: 0;
    }

    .eta-card:last-child {
      border-bottom: none;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }


    .destination-wrap {
      min-width: 0;
      overflow: hidden;
      flex: 1;
    }

    .route-meta {
      font-size: 0.68rem;
      color: var(--subtext);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .eta-time-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 0;
    }

    .eta-remark {
      font-size: 0.68rem;
      color: var(--warning);
      padding: 0 12px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: -2px;
      padding-top: 4px;
    }

    .eta-secondary-remark {
      max-width: 180px;
      font-size: 0.62rem;
      line-height: 1.2;
      color: var(--warning);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .eta-card:has(.eta-remark) {
      height: auto;
      min-height: 52px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      row-gap: 0;
    }

    .eta-card:has(.eta-remark) .eta-remark {
      grid-column: 1 / -1;
    }

    .route-badge {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      min-width: 58px;
      text-align: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .destination {
      font-size: 1rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .eta-times {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .eta-primary {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .eta-primary .unit {
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 1px;
    }

    .eta-secondary {
      font-size: 0.75rem;
      color: var(--subtext);
      font-weight: 500;
      white-space: nowrap;
    }

    .save-route-btn {
      background: transparent;
      color: var(--subtext);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: transform 0.1s ease, color 0.1s ease;
    }

    .save-route-btn.saved {
      color: var(--accent);
    }

    .save-route-btn:active {
      transform: scale(1.2);
    }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }
    .muted { color: var(--subtext); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.4rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 60px;
    }

    @media (min-width: 700px) {
      #eta-container.daily-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-content: start;
      }

      #eta-container.daily-columns .stop-group {
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>即時巴士 ETA</h1>
      <div class="meta-info" id="meta-text">定位中 • 正在載入天氣...</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="daily">每日站點</button>
      <button class="mode-button" data-mode="nearby">附近即時</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="last-updated">更新 --:--</div>
    </div>
  </div>

  <div id="toolbar-search" class="toolbar-search hidden">
    <input id="nearby-search" type="text" placeholder="搜尋路線號碼 (例如: 271, 1A)" autocomplete="off" />
  </div>

  <div id="eta-container">
    <div class="status-msg">正在初始化儀表板...</div>
  </div>

  <script>
    /*
      HK Bus Dashboard — API/data-layer enhancement
      Implemented:
      3) Route-specific ETA API for saved routes / route searches
      4) Rich route DB with operator, direction, service type and sequence
      5) Direction + service type aware grouping/filtering
      6) ETA remarks + generated timestamp
      7) Provider abstraction for KMB/LWB/CTB; CTB uses the official Citybus API
    */

    const STORAGE_KEY = 'hk-bus-dashboard.saved-routes';
    const ROUTE_DB_KEY = 'hk-bus-dashboard.route-db.v3';
    const ROUTE_DB_TTL = 86400000;
    const ETA_CACHE_TTL = 15000;
    const REQUEST_CONCURRENCY = 6;

    const PROVIDERS = {
      kmb: {
        id: 'kmb',
        code: 'KMB',
        label: 'KMB',
        api: 'https://data.etabus.gov.hk/v1/transport/kmb'
      },
      lwb: {
        id: 'lwb',
        code: 'LWB',
        label: 'LWB',
        api: 'https://data.etabus.gov.hk/v1/transport/kmb'
      },
      ctb: {
        id: 'ctb',
        code: 'CTB',
        label: 'CTB',
        api: 'https://rt.data.gov.hk/v2/transport/citybus'
      }
    };

    let allStops = [];
    let stopMetaMap = {};
    let routeDb = null;
    let userLocation = null;
    let activeStopIds = [];
    let nearbyStopIds = [];
    let currentTemp = '';
    let currentMode = 'daily';
    let etaPollTimer = null;
    let savedRoutes = [];
    let etaCache = new Map();
    let requestQueue = [];
    let activeRequests = 0;

    function debounce(func, delay = 300) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => func(...args), delay);
      };
    }

    function getProvider(providerId = 'kmb') {
      return PROVIDERS[providerId] || PROVIDERS.kmb;
    }

    function normalizeProvider(value) {
      const code = String(value || '').toUpperCase();
      if (code === 'LWB') return 'lwb';
      if (code === 'CTB') return 'ctb';
      return 'kmb';
    }

    function getProviderApiBase(providerId = 'kmb') {
      return getProvider(providerId).api;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateLastUpdated(providerIds = ['kmb']) {
      const ids = Array.isArray(providerIds) ? providerIds : [providerIds];
      const labels = [...new Set(ids.map(normalizeProvider).map(id => getProvider(id).label))];
      const now = new Date();
      const timeText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('last-updated').textContent =
        `${labels.join(' + ')} 更新 ${timeText}`;
    }

    function getCompanyColours(providerIds) {
      const companyMap = { kmb: '#E31E25', lwb: '#2A8F9C', ctb: '#0055B8' };
      const list = Array.isArray(providerIds) ? providerIds : [providerIds || 'kmb'];
      const normalized = list
        .filter(Boolean)
        .map(id => companyMap[normalizeProvider(id)] || companyMap.kmb);
      if (normalized.length === 1) return normalized[0];
      if (normalized.length >= 2) {
        return `linear-gradient(90deg, ${normalized[0]} 0 50%, ${normalized[1]} 50% 100%)`;
      }
      return companyMap.kmb;
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function extractData(json) {
      if (!json) return [];
      if (Array.isArray(json)) return json;
      return Array.isArray(json.data) ? json.data : [];
    }

    function extractGeneratedTimestamp(json) {
      return json?.generated_timestamp || '';
    }

    function normalizeServiceType(value) {
      const n = parseInt(value, 10);
      return Number.isFinite(n) ? n : 1;
    }

    function normalizeDirection(value) {
      const v = String(value || '').toUpperCase();
      return v || '';
    }

    function directionLabel(dir) {
      const d = normalizeDirection(dir);
      if (d === 'O') return '出';
      if (d === 'I') return '入';
      return d || '';
    }

    function formatDataAge(timestamp) {
      if (!timestamp) return '';
      const t = new Date(timestamp).getTime();
      if (!Number.isFinite(t)) return '';
      const seconds = Math.max(0, Math.round((Date.now() - t) / 1000));
      if (seconds < 60) return `${seconds}秒前`;
      return `${Math.round(seconds / 60)}分鐘前`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function getOrFetchRouteDB() {
      if (routeDb) return routeDb;

      try {
        const cached = localStorage.getItem(ROUTE_DB_KEY);
        if (cached) {
          const { timestamp, data } = JSON.parse(cached);
          if (Date.now() - timestamp < ROUTE_DB_TTL && data) {
            routeDb = data;
            return routeDb;
          }
        }
      } catch (e) {
        /* Ignore malformed/stale cache. */
      }

      try {
        const [kmbJson, ctbJson] = await Promise.all([
          fetchJson(`${getProviderApiBase('kmb')}/route-stop`),
          fetchJson('https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/ctb')
        ]);

        // Keep route-stop data separated by operator. KMB/LWB and CTB have
        // different API schemas and may share route numbers.
        const db = { kmb: {}, lwb: {}, ctb: {} };

        extractData(kmbJson).forEach(item => {
          if (!item?.route || !item?.stop) return;
          const provider = normalizeProvider(item.co);
          const route = String(item.route).toUpperCase();
          if (!db[provider]) db[provider] = {};
          if (!db[provider][route]) db[provider][route] = [];

          db[provider][route].push({
            route,
            stopId: item.stop,
            seq: parseInt(item.seq, 10) || 0,
            dir: normalizeDirection(item.dir || item.bound),
            serviceType: normalizeServiceType(item.service_type),
            provider,
            providerCode: getProvider(provider).code
          });
        });

        // CTB Route-Stop API fields are explicitly: co, route, dir, seq, stop.
        extractData(ctbJson).forEach(item => {
          if (!item?.route || !item?.stop) return;
          const provider = 'ctb';
          const route = String(item.route).toUpperCase();
          if (!db.ctb[route]) db.ctb[route] = [];

          db.ctb[route].push({
            route,
            stopId: String(item.stop).padStart(6, '0'),
            seq: parseInt(item.seq, 10) || 0,
            dir: normalizeDirection(item.dir),
            serviceType: 1,
            provider,
            providerCode: 'CTB'
          });
        });

        routeDb = db;
        localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({
          timestamp: Date.now(),
          data: db
        }));
        return db;
      } catch (e) {
        return { kmb: {}, lwb: {}, ctb: {} };
      }
    }

    function loadSavedRoutes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        savedRoutes = Array.isArray(parsed)
          ? parsed.map(item => {
              const provider = normalizeProvider(item.provider);
              const serviceType = normalizeServiceType(item.serviceType);
              const dir = normalizeDirection(item.dir);
              return {
                ...item,
                provider,
                serviceType,
                dir,
                // Migrate older saved-route keys to the four-part identity:
                // provider + stopId + route + destination.
                key: getSavedRouteKey(item.route, item.dest, item.stopId, provider)
              };
            })
          : [];
      } catch (e) {
        savedRoutes = [];
      }
    }

    function saveSavedRoutes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRoutes.slice(0, 12)));
    }

    function getStopKey(stopId, provider = 'kmb') {
      return `${normalizeProvider(provider)}|${String(stopId)}`;
    }

    function getStopInfo(stopId, provider = 'kmb') {
      const normalizedProvider = normalizeProvider(provider);
      return allStops.find(stop =>
        stop?.stop === stopId && normalizeProvider(stop.provider || stop.co) === normalizedProvider
      );
    }

    function getStopName(stopId, provider = 'kmb') {
      return stopMetaMap[getStopKey(stopId, provider)] || stopMetaMap[stopId] || '此站';
    }

    function buildStopMetaMap() {
      stopMetaMap = {};
      allStops.forEach(stop => {
        if (stop?.stop) {
          const name = stop.name_tc || stop.name_en || stop.stop;
          const provider = normalizeProvider(stop.provider || stop.co);
          stopMetaMap[getStopKey(stop.stop, provider)] = name;
          // Keep the legacy fallback for older KMB/LWB records.
          if (provider === 'kmb' || provider === 'lwb') {
            stopMetaMap[stop.stop] = name;
          }
        }
      });
    }

    // Saved-route identity intentionally remains simple:
    // provider + stopId + route + destination.
    // Direction/service type are still retained as API metadata, but do not
    // create separate saved-route identities.
    function getSavedRouteKey(route, dest, stopId, provider = 'kmb') {
      return [
        normalizeProvider(provider),
        String(stopId),
        String(route),
        String(dest)
      ].join('|');
    }

    function getSavedRouteKeys() {
      return new Set(savedRoutes.map(item =>
        getSavedRouteKey(
          item.route,
          item.dest,
          item.stopId,
          item.provider
        )
      ));
    }

    function isSavedRoute(route, dest, stopId, provider = 'kmb', serviceType = 1, dir = '') {
      const key = getSavedRouteKey(route, dest, stopId, provider);
      return savedRoutes.some(item =>
        getSavedRouteKey(
          item.route,
          item.dest,
          item.stopId,
          item.provider
        ) === key
      );
    }

    function addSavedRoute(route, dest, stopId, provider = 'kmb', serviceType = 1, dir = '') {
      if (!route || !dest || !stopId) return;

      const normalizedProvider = normalizeProvider(provider);
      const normalizedServiceType = normalizeServiceType(serviceType);
      const normalizedDir = normalizeDirection(dir);

      if (isSavedRoute(
        route,
        dest,
        stopId,
        normalizedProvider,
        normalizedServiceType,
        normalizedDir
      )) return;

      const stopName = getStopName(stopId, normalizedProvider);
      const key = getSavedRouteKey(
        route,
        dest,
        stopId,
        normalizedProvider
      );

      savedRoutes.push({
        key,
        route: String(route),
        dest: String(dest),
        stopId,
        provider: normalizedProvider,
        serviceType: normalizedServiceType,
        dir: normalizedDir,
        stopName,
        label: `${route} ${dest}`
      });

      saveSavedRoutes();
    }

    function removeSavedRoute(key) {
      savedRoutes = savedRoutes.filter(item => item.key !== key);
      saveSavedRoutes();
    }

    async function fetchWeather() {
      try {
        const data = await fetchJson(
          'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'
        );
        currentTemp = `${data.temperature.data[0].value}°C`;
      } catch (e) {
        currentTemp = '';
      }
      updateMetaText();
    }

    fetchWeather();
    setInterval(fetchWeather, 600000);

    function updateMetaText(statusMsg = '') {
      const parts = ['香港'];
      if (currentTemp) parts.push(currentTemp);
      if (statusMsg) parts.push(statusMsg);
      document.getElementById('meta-text').textContent = parts.join(' • ');
    }

    function updateSearchVisibility() {
      const searchWrap = document.getElementById('toolbar-search');
      const searchInput = document.getElementById('nearby-search');
      if (!searchWrap || !searchInput) return;

      const shouldShow = currentMode === 'nearby';
      searchWrap.classList.toggle('hidden', !shouldShow);

      if (!shouldShow) searchInput.value = '';
    }

    function attachModeHandlers() {
      document.querySelectorAll('.mode-button').forEach(button => {
        button.addEventListener('click', async () => {
          const selectedMode = button.dataset.mode;
          if (selectedMode === currentMode) return;

          currentMode = selectedMode;

          document.querySelectorAll('.mode-button').forEach(b =>
            b.classList.toggle('active', b.dataset.mode === currentMode)
          );

          updateSearchVisibility();

          const etaContainerEl = document.getElementById('eta-container');
          if (etaContainerEl) {
            etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');
          }

          if (currentMode === 'daily') {
            if (savedRoutes.length > 0) {
              activeStopIds = [...new Set(
                savedRoutes.map(item => ({
                  stopId: item.stopId,
                  provider: item.provider || 'kmb'
                }))
              )];
              updateMetaText('已儲存站點');
              startEtaLoop();
            } else {
              activeStopIds = [];
              stopEtaLoop();
              document.getElementById('eta-container').innerHTML = '';
              updateMetaText('已儲存站點');
            }
          } else {
            await initNearbyStops();
          }
        });
      });

      const searchInput = document.getElementById('nearby-search');

      if (searchInput) {
        searchInput.addEventListener('input', debounce(async event => {
          if (currentMode !== 'nearby') return;

          const value = event.target.value.trim().toUpperCase();

          if (!value) {
            activeStopIds = nearbyStopIds.slice();
            startEtaLoop();
            return;
          }

          const db = await getOrFetchRouteDB();
          let targetStops = [];

          if (db[value]) {
            targetStops = db[value].map(s => ({
              stopId: s.stopId,
              provider: s.provider || 'kmb'
            }));
          } else {
            const matchingRoutes = Object.keys(db).filter(r => r.includes(value));
            const seen = new Set();

            matchingRoutes.forEach(route => {
              db[route].forEach(s => {
                const key = `${s.provider || 'kmb'}|${s.stopId}`;
                if (!seen.has(key)) {
                  seen.add(key);
                  targetStops.push({
                    stopId: s.stopId,
                    provider: s.provider || 'kmb'
                  });
                }
              });
            });

            targetStops = targetStops.slice(0, 80);
          }

          if (targetStops.length === 0) {
            document.getElementById('eta-container').innerHTML =
              '<div class="status-msg">沒有符合搜尋條件的路線。</div>';
            return;
          }

          activeStopIds = targetStops;
          startEtaLoop();
        }, 300));
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;

        if (target.dataset.action === 'save-route') {
          addSavedRoute(
            target.dataset.route,
            target.dataset.dest,
            target.dataset.stop,
            target.dataset.provider || 'kmb',
            target.dataset.serviceType || 1,
            target.dataset.dir || ''
          );

          target.dataset.action = 'remove-saved-route';
          target.textContent = '★';
          target.classList.add('saved');
          return;
        }

        if (target.dataset.action === 'remove-saved-route') {
          removeSavedRoute(target.dataset.key);
          target.dataset.action = 'save-route';
          target.textContent = '☆';
          target.classList.remove('saved');
        }
      });
    }

    function requestLocation() {
      if (!('geolocation' in navigator)) return;

      navigator.geolocation.getCurrentPosition(
        pos => {
          userLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };

          if (activeStopIds.length > 0) fetchEtas();
        },
        () => {
          /* Keep distance as Infinity if permission is denied. */
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function initDashboard() {
      loadSavedRoutes();
      attachModeHandlers();

      const etaContainerEl = document.getElementById('eta-container');
      if (etaContainerEl) {
        etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');
      }

      await initStops();
      getOrFetchRouteDB();
      requestLocation();

      if (currentMode === 'daily') {
        if (savedRoutes.length > 0) {
          activeStopIds = [...new Set(
            savedRoutes.map(item => ({
              stopId: item.stopId,
              provider: item.provider || 'kmb'
            }))
          )];

          updateMetaText('已儲存站點');
          startEtaLoop();
          return;
        }

        activeStopIds = [];
        document.getElementById('eta-container').innerHTML = '';
        updateMetaText('已儲存站點');
        return;
      }

      await initNearbyStops();
    }

    async function fetchKmbStops() {
      try {
        const json = await fetchJson(`${getProviderApiBase('kmb')}/stop`);
        return extractData(json).map(stop => ({
          ...stop,
          provider: normalizeProvider(stop.co)
        }));
      } catch (error) {
        return [];
      }
    }

    async function fetchCtbStops() {
      try {
        const json = await fetchJson('https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop');
        return extractData(json).map(stop => ({
          ...stop,
          provider: 'ctb',
          co: 'CTB',
        }));
      } catch (error) {
        return [];
      }
    }

    async function initStops() {
      const [kmbStops, ctbStops] = await Promise.all([
        fetchKmbStops(),
        fetchCtbStops()
      ]);
      allStops = [...kmbStops, ...ctbStops];
      buildStopMetaMap();
    }

    async function initNearbyStops() {
      if (allStops.length === 0) await initStops();

      if (!('geolocation' in navigator)) {
        showError('不支援定位功能。');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        onLocationSuccess,
        onLocationError,
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function onLocationSuccess(position) {
      const userLat = position.coords.latitude;
      const userLong = position.coords.longitude;

      userLocation = {
        lat: userLat,
        lng: userLong
      };

      const nearbyStops = allStops.filter(stop => {
        const lat = parseFloat(stop.lat);
        const lng = parseFloat(stop.long);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;

        const dist = getDistanceKm(userLat, userLong, lat, lng);
        return dist <= 0.3;
      });

      nearbyStopIds = nearbyStops.map(stop => ({
        stopId: stop.stop,
        provider: stop.provider || 'kmb'
      }));

      activeStopIds = nearbyStopIds.slice();

      if (activeStopIds.length === 0) {
        document.getElementById('eta-container').innerHTML =
          '<div class="status-msg">300公尺範圍內沒有巴士站。</div>';
        updateMetaText('沒有附近站點');
        return;
      }

      updateMetaText('附近站點（約300公尺）');
      startEtaLoop();
    }

    function onLocationError() {
      showError('位置存取被拒絕。');
    }

    function stopEtaLoop() {
      if (etaPollTimer) {
        clearInterval(etaPollTimer);
        etaPollTimer = null;
      }
    }

    function getPollingInterval() {
      // Keep the dashboard refresh at 20 seconds as requested.
      return 20000;
    }

    function scheduleNextEtaPoll() {
      stopEtaLoop();

      if (!activeStopIds.length) return;

      const interval = getPollingInterval();
      etaPollTimer = setTimeout(async () => {
        await fetchEtas();
        scheduleNextEtaPoll();
      }, interval);
    }

    async function startEtaLoop() {
      stopEtaLoop();
      await fetchEtas();
      scheduleNextEtaPoll();
    }

    function enqueueRequest(task) {
      return new Promise((resolve, reject) => {
        requestQueue.push({ task, resolve, reject });
        pumpRequestQueue();
      });
    }

    function pumpRequestQueue() {
      while (activeRequests < REQUEST_CONCURRENCY && requestQueue.length) {
        const item = requestQueue.shift();
        activeRequests++;

        Promise.resolve()
          .then(item.task)
          .then(item.resolve)
          .catch(item.reject)
          .finally(() => {
            activeRequests--;
            pumpRequestQueue();
          });
      }
    }

    async function fetchWithCache(url) {
      const cached = etaCache.get(url);

      if (cached && Date.now() - cached.timestamp < ETA_CACHE_TTL) {
        return cached.json;
      }

      const json = await enqueueRequest(() => fetchJson(url));

      etaCache.set(url, {
        timestamp: Date.now(),
        json
      });

      return json;
    }

    async function fetchKmbStopEta(stopId) {
      const url = `${getProviderApiBase('kmb')}/stop-eta/${encodeURIComponent(stopId)}`;

      try {
        return await fetchWithCache(url);
      } catch (error) {
        return { data: [] };
      }
    }

    async function fetchKmbRouteEta(stopId, route, serviceType = 1) {
      const safeRoute = encodeURIComponent(route);
      const safeServiceType = encodeURIComponent(normalizeServiceType(serviceType));
      const url =
        `${getProviderApiBase('kmb')}/eta/${encodeURIComponent(stopId)}/${safeRoute}/${safeServiceType}`;

      try {
        return await fetchWithCache(url);
      } catch (error) {
        return { data: [] };
      }
    }

    async function fetchCtbStopEta(stopId) {
      const url = `https://rt.data.gov.hk/v1/transport/batch/stop-eta/CTB/${encodeURIComponent(String(stopId).padStart(6, '0'))}?lang=zh-hant`;
      try {
        return await fetchWithCache(url);
      } catch (error) {
        return { data: [] };
      }
    }

    async function fetchCtbRouteEta(stopId, route) {
      const safeStop = encodeURIComponent(String(stopId).padStart(6, '0'));
      const safeRoute = encodeURIComponent(route);
      const url = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${safeStop}/${safeRoute}`;
      try {
        const json = await fetchWithCache(url);
        if (extractData(json).length > 0) return json;

        // Fallback to the official consolidated stop-ETA API. This is useful
        // for CTB routes where the route-specific V2 response has no rows.
        return await fetchCtbStopEta(stopId);
      } catch (error) {
        try {
          return await fetchCtbStopEta(stopId);
        } catch (fallbackError) {
          return { data: [] };
        }
      }
    }

    // KMB uses "原定班次" / "Scheduled Bus" as a normal status marker.
    // It is useful in raw API data but is not actionable enough to occupy card space.
    // Keep other remarks at ETA-record granularity so a remark belongs to the
    // specific arrival it describes, rather than the whole route card.
    function normalizeEtaRemark(remark) {
      const text = String(remark || '').trim();
      // Only show remarks that contain the Chinese character "慢".
      // All other remarks, including "原定班次", are hidden.
      return text.includes('慢') ? text : '';
    }

    function normalizeEtaItem(item, fallback = {}) {
      return {
        co: item?.co || fallback.co || getProvider(fallback.provider).code,
        route: String(item?.route ?? fallback.route ?? ''),
        dir: normalizeDirection(item?.dir ?? fallback.dir),
        serviceType: normalizeServiceType(item?.service_type ?? fallback.serviceType),
        seq: parseInt(item?.seq ?? fallback.seq, 10) || 0,
        stop: item?.stop || fallback.stopId,
        destination:
          item?.dest_tc ||
          item?.dest_en ||
          item?.dest ||
          fallback.dest ||
          '未知',
        eta: item?.eta || '',
        etaSeq: item?.eta_seq ?? null,
        remark: item?.rmk_tc || item?.rmk || item?.rmk_en || '',
        generatedTimestamp: fallback.generatedTimestamp || '',
        provider: normalizeProvider(item?.co || fallback.provider)
      };
    }

    function buildDailyTasks() {
      const tasks = [];
      const seen = new Set();

      savedRoutes.forEach(savedRoute => {
        const provider = normalizeProvider(savedRoute.provider);
        const key = [
          provider,
          savedRoute.stopId,
          savedRoute.route,
          savedRoute.dest
        ].join('|');

        if (seen.has(key)) return;
        seen.add(key);

        tasks.push({
          mode: 'specific',
          provider,
          stopId: savedRoute.stopId,
          route: savedRoute.route,
          serviceType: normalizeServiceType(savedRoute.serviceType),
          dir: normalizeDirection(savedRoute.dir),
          dest: savedRoute.dest
        });
      });

      return tasks;
    }

    async function fetchEtas() {
      if (!activeStopIds.length) return;

      const routeMap = {};
      const now = new Date();
      const generatedTimestamps = new Set();
      const searchInput = document.getElementById('nearby-search');
      const searchQuery =
        currentMode === 'nearby' && searchInput
          ? searchInput.value.trim().toUpperCase()
          : '';

      if (currentMode === 'daily' && savedRoutes.length > 0) {
        // Daily mode uses the route-specific ETA endpoint.
        const tasks = buildDailyTasks();

        const responses = await Promise.all(
          tasks.map(async task => {
            try {
              const json = task.provider === 'ctb'
                ? await fetchCtbRouteEta(task.stopId, task.route)
                : await fetchKmbRouteEta(
                    task.stopId,
                    task.route,
                    task.serviceType
                  );
              return { task, json, items: extractData(json) };
            } catch (error) {
              return { task, json: null, items: [] };
            }
          })
        );

        responses.forEach(({ task, json, items }) => {
          if (json?.generated_timestamp) {
            generatedTimestamps.add(json.generated_timestamp);
          }

          const savedMatches = savedRoutes.filter(saved =>
            saved.stopId === task.stopId &&
            normalizeProvider(saved.provider) === task.provider &&
            String(saved.route).toUpperCase() === String(task.route).toUpperCase() &&
            normalizeServiceType(saved.serviceType) === task.serviceType
          );

          items.forEach(rawItem => {
            const item = normalizeEtaItem(rawItem, {
              provider: task.provider,
              stopId: task.stopId,
              route: task.route,
              serviceType: task.serviceType,
              dir: task.dir,
              dest: task.dest,
              generatedTimestamp: json?.generated_timestamp || ''
            });

            if (item.provider !== task.provider) return;
            if (item.route.toUpperCase() !== String(task.route).toUpperCase()) return;
            if (task.dir && item.dir && item.dir !== task.dir) return;

            const savedMatch = savedMatches.find(saved =>
              saved.dir ? saved.dir === item.dir : true
            );

            if (!savedMatch) return;

            addEtaRecord(routeMap, item, now);
          });
        });
      } else {
        // Nearby mode without a route query uses Stop-ETA, which is the
        // appropriate all-routes endpoint for a physical bus stop.
        const stopTasks = [...new Map(
          activeStopIds.map(item => [
            `${normalizeProvider(item.provider)}|${item.stopId}`,
            item
          ])
        ).values()];

        const responses = await Promise.all(
          stopTasks.map(async task => {
            try {
              const json = task.provider === 'ctb'
                ? await fetchCtbStopEta(task.stopId)
                : await fetchKmbStopEta(task.stopId);
              return { task, json, items: extractData(json) };
            } catch (error) {
              return { task, json: null, items: [] };
            }
          })
        );

        responses.forEach(({ task, json, items }) => {
          if (json?.generated_timestamp) {
            generatedTimestamps.add(json.generated_timestamp);
          }

          items.forEach(rawItem => {
            const item = normalizeEtaItem(rawItem, {
              provider: task.provider,
              stopId: task.stopId,
              generatedTimestamp: json?.generated_timestamp || ''
            });

            if (item.provider !== task.provider) return;
            if (searchQuery &&
                !item.route.toUpperCase().includes(searchQuery)) return;

            addEtaRecord(routeMap, item, now);
          });
        });
      }

      const groupedList = Object.values(routeMap).map(r => {
        r.etas.sort((a, b) => a.minutes - b.minutes);
        return r;
      });

      renderEtas(groupedList, generatedTimestamps);
      updateLastUpdated(
        [...new Set(groupedList.map(item => item.provider))]
      );
    }

    function addEtaRecord(routeMap, item, now) {
      if (!item.route || !item.stop) return;

      const stopId = item.stop;
      const provider = normalizeProvider(item.provider);
      const stopLabel = getStopName(stopId, provider);
      const stopInfo = getStopInfo(stopId, provider);

      const stopDistance = userLocation && stopInfo
        ? getDistanceKm(
            userLocation.lat,
            userLocation.lng,
            parseFloat(stopInfo.lat),
            parseFloat(stopInfo.long)
          )
        : Number.POSITIVE_INFINITY;

      const destination = item.destination;
      const serviceType = normalizeServiceType(item.serviceType);
      const dir = normalizeDirection(item.dir);

      // Route display/grouping identity intentionally remains:
      // provider + stopId + route + destination only.
      const key = [
        provider,
        stopId,
        item.route,
        destination
      ].join('|');

      if (!routeMap[key]) {
        routeMap[key] = {
          route: item.route,
          dest: destination,
          stopId,
          provider,
          serviceType,
          dir,
          stopName: stopLabel,
          stopDistance,
          generatedTimestamp: item.generatedTimestamp || '',
          etas: []
        };
      }

      if (item.eta && String(item.eta).trim() !== '') {
        const etaTime = new Date(item.eta);
        const diffMins = Math.round((etaTime - now) / 60000);

        if (diffMins >= 0 && diffMins <= 180) {
          routeMap[key].etas.push({
            minutes: diffMins,
            timestamp: item.eta,
            etaSeq: item.etaSeq,
            remark: normalizeEtaRemark(item.remark)
          });
        }
      }
    }

    function renderEtas(routes, generatedTimestamps = new Set()) {
      const container = document.getElementById('eta-container');
      const searchInput = document.getElementById('nearby-search');

      const searchQuery =
        currentMode === 'nearby' && searchInput
          ? searchInput.value.trim().toUpperCase()
          : '';

      if (searchQuery) {
        const hasExactMatch = routes.some(
          r => r.route.toUpperCase() === searchQuery
        );

        routes = hasExactMatch
          ? routes.filter(r => r.route.toUpperCase() === searchQuery)
          : routes.filter(r => r.route.toUpperCase().includes(searchQuery));
      }

      if (routes.length === 0) {
        container.innerHTML =
          `<div class="status-msg">${searchQuery ? '沒有符合搜尋條件的巴士。' : '沒有即將到達的巴士。'}</div>`;
        return;
      }

      const stopsMap = new Map();

      routes.forEach(r => {
        const stopId = r.stopId || 'unknown';

        if (!stopsMap.has(stopId)) {
          stopsMap.set(stopId, {
            stopId,
            stopName: r.stopName || '站點資料未提供',
            stopDistance: r.stopDistance,
            items: []
          });
        }

        stopsMap.get(stopId).items.push(r);
      });

      const isExactMatch = routeStr =>
        searchQuery && routeStr.toUpperCase() === searchQuery;

      const sortedStops = [...stopsMap.values()].sort((a, b) => {
        const distA = Number.isFinite(a.stopDistance) ? a.stopDistance : Infinity;
        const distB = Number.isFinite(b.stopDistance) ? b.stopDistance : Infinity;

        if (currentMode === 'nearby' && searchQuery) {
          const exactA = a.items.some(item => isExactMatch(item.route));
          const exactB = b.items.some(item => isExactMatch(item.route));

          if (exactA !== exactB) return exactA ? -1 : 1;
        }

        if (distA !== distB) return distA - distB;

        if (currentMode === 'daily') {
          const indexA = savedRoutes.findIndex(item => item.stopId === a.stopId);
          const indexB = savedRoutes.findIndex(item => item.stopId === b.stopId);
          return (indexA !== -1 ? indexA : 999) -
                 (indexB !== -1 ? indexB : 999);
        }

        return a.stopName.localeCompare(b.stopName, 'zh-HK');
      });

      container.innerHTML = sortedStops.map(
        ({ stopId, stopName, stopDistance, items }) => {
          const stopDistanceText = Number.isFinite(stopDistance)
            ? `${Math.round(stopDistance * 1000)}m`
            : '站點';

          items.sort((a, b) => {
            if (currentMode === 'nearby' && searchQuery) {
              const exactA = isExactMatch(a.route);
              const exactB = isExactMatch(b.route);
              if (exactA !== exactB) return exactA ? -1 : 1;
            }

            const etaA = a.etas[0]?.minutes ?? 9999;
            const etaB = b.etas[0]?.minutes ?? 9999;

            if (etaA !== etaB) return etaA - etaB;

            return a.route.localeCompare(
              b.route,
              undefined,
              { numeric: true, sensitivity: 'base' }
            );
          });

          const cardMarkup = items.map(r => {
            const firstEta = r.etas[0]?.minutes;
            const nextEtas = r.etas
              .slice(1, 3)
              .map(eta => `${eta.minutes}分`)
              .reverse()
              .join(' | ');

            const primaryEtaRemark = normalizeEtaRemark(r.etas[0]?.remark);
            const secondaryRemarks = r.etas
              .slice(1, 3)
              .map((eta, index) => ({
                label: eta.minutes,
                remark: normalizeEtaRemark(eta.remark),
                ordinal: index + 2
              }))
              .filter(item => item.remark);

            let timeClass = 'safe';
            let displayTime = firstEta != null
              ? `${firstEta}<span class="unit">分</span>`
              : '暫無';

            if (firstEta == null) {
              timeClass = 'muted';
            } else if (firstEta === 0) {
              timeClass = 'due';
              displayTime = '到站';
            } else if (firstEta <= 3) {
              timeClass = 'urgent';
            } else if (firstEta <= 7) {
              timeClass = 'warning';
            }

            const provider = r.provider || 'kmb';
            const isSaved = isSavedRoute(
              r.route,
              r.dest,
              stopId,
              provider,
              r.serviceType,
              r.dir
            );

            const action = isSaved
              ? 'remove-saved-route'
              : 'save-route';

            const starIcon = isSaved ? '★' : '☆';
            const savedClass = isSaved ? 'saved' : '';
            const key = getSavedRouteKey(
              r.route,
              r.dest,
              stopId,
              provider,
              r.serviceType,
              r.dir
            );

            // Direction and sequence remain internal API metadata only.
            // They are deliberately not shown on the card.
            const remarkMarkup = primaryEtaRemark
              ? `<div class="eta-remark" title="${escapeHtml(primaryEtaRemark)}">${escapeHtml(primaryEtaRemark)}</div>`
              : '';

            const secondaryRemarkMarkup = secondaryRemarks.length
              ? `<div class="eta-secondary-remark" title="${escapeHtml(secondaryRemarks.map(x => `${x.label}分：${x.remark}`).join('；'))}">${escapeHtml(secondaryRemarks.map(x => `${x.label}分：${x.remark}`).join('；'))}</div>`
              : '';

            return `
              <div class="eta-card">
                <div class="route-info">
                  <div class="route-badge"
                       style="background:${getCompanyColours(provider)};"
                       title="${escapeHtml(getProvider(provider).label)}">
                    ${escapeHtml(r.route)}
                  </div>
                  <div class="destination-wrap">
                    <div class="destination">${escapeHtml(r.dest)}</div>
                  </div>
                </div>

                <div class="eta-times">
                  <div class="eta-time-stack">
                    ${nextEtas
                      ? `<div class="eta-secondary">${nextEtas}</div>`
                      : ''}
                    <div class="eta-primary ${timeClass}">
                      ${displayTime}
                    </div>
                    ${secondaryRemarkMarkup}
                  </div>
                  <button
                    class="save-route-btn ${savedClass}"
                    data-action="${action}"
                    data-key="${escapeHtml(key)}"
                    data-route="${escapeHtml(r.route)}"
                    data-dest="${escapeHtml(r.dest)}"
                    data-stop="${escapeHtml(stopId)}"
                    data-provider="${escapeHtml(provider)}"
                    data-service-type="${escapeHtml(r.serviceType)}"
                    data-dir="${escapeHtml(r.dir)}"
                    title="${isSaved ? '取消儲存' : '儲存路線'}">
                    ${starIcon}
                  </button>
                </div>

                ${remarkMarkup}
              </div>
            `;
          }).join('');

          const timestampText = [...generatedTimestamps][0]
            ? `資料 ${formatDataAge([...generatedTimestamps][0])}`
            : '';

          return `
            <div class="stop-group">
              <div class="stop-header">
                <div class="stop-header-title">${escapeHtml(stopName)}</div>
                <div class="stop-header-distance">
                  ${escapeHtml(stopDistanceText)}
                  ${timestampText
                    ? ` · ${escapeHtml(timestampText)}`
                    : ''}
                </div>
              </div>
              <div class="stop-card-list">${cardMarkup}</div>
            </div>
          `;
        }
      ).join('');
    }

    function showError(msg) {
      document.getElementById('eta-container').innerHTML =
        `<div class="status-msg">${escapeHtml(msg)}</div>`;
      updateMetaText('錯誤');
    }

    // Pause network polling while the tab is hidden.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopEtaLoop();
      } else if (activeStopIds.length) {
        startEtaLoop();
      }
    });

    updateSearchVisibility();
    initDashboard();
  </script>
</body>
</html>
