<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HK Bus Dashboard</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --accent: #FFCC00;
      --text: #FFFFFF;
      --subtext: #A0A0A0;
      --border: #222222;
      --urgent: #FF453A;
      --warning: #FF9F0A;
      --safe: #30D158;
      --button-bg: #1A1A1A;
      --button-active: #FFCC00;
      --button-active-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 18px 22px 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .title-group h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-info {
      font-size: 1.05rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    .weather-summary {
      margin-top: 5px;
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .weather-commute {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      font-size: 0.86rem;
      color: var(--text);
      font-weight: 700;
      line-height: 1.25;
    }

    .weather-commute .weather-icon {
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .weather-commute.warn { color: var(--warning); }
    .weather-commute.alert { color: var(--urgent); }
    .weather-commute.good { color: var(--safe); }

    .weather-source { display: none; }

    #clock {
      font-size: 3.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    #mode-switch {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 14px;
      min-width: 120px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .mode-button.active {
      background: var(--button-active);
      color: var(--button-active-text);
    }

    #last-updated, #ctb-updated {
      color: var(--subtext);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .toolbar-search {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .toolbar-search.hidden { display: none; }

    .toolbar-search input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      font-family: inherit;
    }

    .toolbar-search input::placeholder { color: var(--subtext); }

    #eta-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .stop-group {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 204, 0, 0.05);
    }

    .stop-header-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stop-header-distance {
      font-size: 0.72rem;
      color: var(--subtext);
      white-space: nowrap;
    }

    .stop-card-list {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .eta-card {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 52px;
      min-height: 52px;
      max-height: 52px;
      flex-shrink: 0;
    }

    .eta-card:last-child { border-bottom: none; }

    .route-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .destination-wrap {
      min-width: 0;
      overflow: hidden;
      flex: 1;
    }

    .eta-time-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 0;
    }

    .eta-remark {
      font-size: 0.68rem;
      color: var(--warning);
      padding: 0 12px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: -2px;
      padding-top: 4px;
    }

    .eta-secondary-remark {
      max-width: 180px;
      font-size: 0.62rem;
      line-height: 1.2;
      color: var(--warning);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .eta-card:has(.eta-remark) {
      height: auto;
      min-height: 52px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      row-gap: 0;
    }

    .eta-card:has(.eta-remark) .eta-remark { grid-column: 1 / -1; }

    .route-badge {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      min-width: 58px;
      text-align: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .destination {
      font-size: 1rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .eta-times {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .eta-primary {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .eta-primary .unit {
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 1px;
    }

    .eta-secondary {
      font-size: 0.75rem;
      color: var(--subtext);
      font-weight: 500;
      white-space: nowrap;
    }

    .save-route-btn {
      background: transparent;
      color: var(--subtext);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: transform 0.1s ease, color 0.1s ease;
    }

    .save-route-btn.saved { color: var(--accent); }
    .save-route-btn:active { transform: scale(1.2); }

    .due { color: var(--urgent); animation: pulse 1.5s infinite; }
    .urgent { color: var(--urgent); }
    .warning { color: var(--warning); }
    .safe { color: var(--safe); }
    .muted { color: var(--subtext); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .status-msg {
      font-size: 1.4rem;
      color: var(--subtext);
      text-align: center;
      margin-top: 60px;
    }

    @media (min-width: 700px) {
      #eta-container.daily-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-content: start;
      }
      #eta-container.daily-columns .stop-group { margin-bottom: 0; }
    }

    .provider-status {
      display: inline-flex;
      gap: 12px;
      align-items: center;
      font-size: 14px;
    }
    .provider-status .ok { color: #22c55e; }
    .provider-status .err { color: #ef4444; }
    .provider-status .loading { color: #f59e0b; }
    .provider-status .muted { color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>即時巴士 ETA</h1>
      <div class="meta-info" id="meta-text">定位中</div>
      <div class="weather-summary" id="weather-summary">☁️ 天氣資料載入中</div>
      <div class="weather-commute" id="weather-commute"><span class="weather-icon">·</span><span id="weather-advice">正在載入通勤建議...</span></div>
      <div class="weather-source" id="weather-source">天文台</div>
    </div>
    <div id="clock">00:00</div>
  </header>

  <div class="toolbar">
    <div id="mode-switch">
      <button class="mode-button active" data-mode="nearby">附近即時</button>
      <button class="mode-button" data-mode="daily">我的路線</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="last-updated">KMB/LWB 更新 --:--</div><div id="ctb-updated">CTB 更新 --:--:--</div>
    </div>
  </div>

  <div id="toolbar-search" class="toolbar-search hidden">
    <div id="providerStatus" class="provider-status">
      <span id="kmbStatus" class="muted">KMB/LWB 更新 --:--</span>
      <span id="ctbStatus" class="muted">CTB 更新 --:--</span>
    </div>
    <input id="nearby-search" type="text" placeholder="搜尋路線號碼 (例如: 271, 1A)" autocomplete="off" />
  </div>

  <div id="eta-container">
    <div class="status-msg">正在初始化儀表板...</div>
  </div>

  <script>
  const STORAGE_KEY = 'hk-bus-dashboard.saved-routes';
  const ROUTE_DB_KEY = 'hk-bus-dashboard.route-db.v5';
  const ROUTE_DB_TTL = 86400000;
  const ETA_CACHE_TTL = 15000;
  const REQUEST_CONCURRENCY = 6;

  const PROVIDERS = {
    kmb: { id: 'kmb', code: 'KMB', label: 'KMB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' },
    lwb: { id: 'lwb', code: 'LWB', label: 'LWB', api: 'https://data.etabus.gov.hk/v1/transport/kmb' },
    ctb: { id: 'ctb', code: 'CTB', label: 'CTB', api: 'https://rt.data.gov.hk/v2/transport/citybus' }
  };

  let allStops = [];
  let stopMetaMap = {};
  let routeDb = null;
  let userLocation = null;
  const PRESET_TEST_LOCATION = { lat: 22.3193, lng: 114.1694, label: '旺角（測試位置）' };
  let locationSource = 'none';

  let activeStopIds = [];
  let nearbyStopIds = [];

  let latestEtaResults = [];
  let latestGeneratedTimestamps = new Set();
  let currentTemp = '';
  let weatherState = { summary: '', forecast: '', outlook: '', psr: '', warning: '', updated: null };
  let currentMode = 'nearby';
  let etaPollTimer = null;
  let etaRefreshGeneration = 0;
  let savedRoutes = [];
  let etaCache = new Map();
  let requestQueue = [];
  let activeRequests = 0;
  let providerRefreshTimestamps = { kmb: null, lwb: null, ctb: null };

  const providerLiveStatus = {
    kmb: { state: 'idle', lastSuccess: null, lastAttempt: null, error: '' },
    ctb: { state: 'idle', lastSuccess: null, lastAttempt: null, error: '' }
  };

  function loadSavedRoutes() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      savedRoutes = data ? JSON.parse(data) : [];
    } catch (e) { savedRoutes = []; }
  }

  function saveSavedRoutes() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRoutes)); } catch (e) {}
  }

  function getSavedRouteKey(route, dest, stopId, provider = 'kmb', serviceType = 1, dir = '') {
    return [normalizeProvider(provider), stopId, String(route).toUpperCase(), dest, serviceType, dir].join('|');
  }

  function isSavedRoute(route, dest, stopId, provider = 'kmb', serviceType = 1, dir = '') {
    const key = getSavedRouteKey(route, dest, stopId, provider, serviceType, dir);
    return savedRoutes.some(r => getSavedRouteKey(r.route, r.dest, r.stopId, r.provider, r.serviceType, r.dir) === key);
  }

  function addSavedRoute(route, dest, stopId, provider = 'kmb', serviceType = 1, dir = '') {
    if (!isSavedRoute(route, dest, stopId, provider, serviceType, dir)) {
      savedRoutes.push({
        route: String(route).toUpperCase(),
        dest,
        stopId,
        provider: normalizeProvider(provider),
        serviceType: normalizeServiceType(serviceType),
        dir: normalizeDirection(dir)
      });
      saveSavedRoutes();
    }
  }

  function removeSavedRoute(key) {
    savedRoutes = savedRoutes.filter(r => getSavedRouteKey(r.route, r.dest, r.stopId, r.provider, r.serviceType, r.dir) !== key);
    saveSavedRoutes();
  }

  function getStopKey(stopId, provider = 'kmb') {
    return `${normalizeProvider(provider)}|${String(stopId).padStart(6, '0')}`;
  }

  function buildStopMetaMap() {
    stopMetaMap = {};
    allStops.forEach(stop => {
      const id = stop.stop || stop.stop_id;
      if (!id) return;
      const key = getStopKey(id, stop.provider || stop.co);
      stopMetaMap[key] = {
        name: stop.name_tc || stop.name_en || stop.stop_name || '巴士站',
        lat: parseFloat(stop.lat),
        long: parseFloat(stop.long || stop.lng)
      };
    });
  }

  function getStopName(stopId, provider = 'kmb') {
    const key = getStopKey(stopId, provider);
    return stopMetaMap[key]?.name || `站點 ${stopId}`;
  }

  function getStopInfo(stopId, provider = 'kmb') {
    const key = getStopKey(stopId, provider);
    return stopMetaMap[key] || null;
  }

  function buildCommuteAdvice(rhr, flw, fnd, warnsum) {
    let summary = '🌤️ 天氣大致良好';
    let advice = '適合出行';
    let psr = 'GOOD';
    if (warnsum && Object.keys(warnsum).length > 0) {
      summary = '⚠️ 警告生效中';
      advice = '請留意天氣警告';
      psr = 'WARN';
    }
    return { summary, advice, psr };
  }

  function renderWeatherAdvice(advice) {
    const summaryEl = document.getElementById('weather-summary');
    const adviceEl = document.getElementById('weather-advice');
    if (summaryEl) summaryEl.textContent = advice.summary;
    if (adviceEl) adviceEl.textContent = advice.advice;
  }

  function applyLocation(lat, lng, sourceLabel) {
    userLocation = { lat, lng };
    locationSource = sourceLabel;
  }

  function usePresetMongKokLocation(reason = '') {
    applyLocation(PRESET_TEST_LOCATION.lat, PRESET_TEST_LOCATION.lng, PRESET_TEST_LOCATION.label);
  }

  function debounce(func, delay = 300) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => func(...args), delay);
    };
  }

  function getProvider(providerId = 'kmb') { return PROVIDERS[providerId] || PROVIDERS.kmb; }
  function normalizeProvider(value) {
    const code = String(value || '').toUpperCase();
    if (code === 'LWB') return 'lwb';
    if (code === 'CTB') return 'ctb';
    return 'kmb';
  }
  function getProviderApiBase(providerId = 'kmb') { return getProvider(providerId).api; }

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  function formatClockTime(timestamp, withSeconds = false) {
    if (!timestamp) return '--:--' + (withSeconds ? ':--' : '');
    const d = new Date(timestamp);
    if (!Number.isFinite(d.getTime())) return '--:--' + (withSeconds ? ':--' : '');
    return withSeconds
      ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`
      : `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function markProviderRefresh(providerId) {
    const id = normalizeProvider(providerId);
    providerRefreshTimestamps[id] = Date.now();
    const ctbEl = document.getElementById('ctb-updated');
    if (ctbEl) ctbEl.textContent = `CTB 更新 ${formatClockTime(providerRefreshTimestamps.ctb, true)}`;
    const lastEl = document.getElementById('last-updated');
    if (lastEl) {
      const kmb = providerRefreshTimestamps.kmb;
      const lwb = providerRefreshTimestamps.lwb;
      const parts = [];
      if (kmb) parts.push(`KMB ${formatClockTime(kmb)}`);
      if (lwb) parts.push(`LWB ${formatClockTime(lwb)}`);
      lastEl.textContent = parts.length ? parts.join(' · ') : 'KMB/LWB 更新 --:--';
    }
  }

  function updateLastUpdated(providerIds = ['kmb']) {
    const ids = Array.isArray(providerIds) ? providerIds : [providerIds];
    ids.forEach(id => markProviderRefresh(id));
  }

  function getCompanyColours(providerIds) {
    const companyMap = { kmb: '#E31E25', lwb: '#2A8F9C', ctb: '#0055B8' };
    const list = Array.isArray(providerIds) ? providerIds : [providerIds || 'kmb'];
    const normalized = list.filter(Boolean).map(id => companyMap[normalizeProvider(id)] || companyMap.kmb);
    if (normalized.length === 1) return normalized[0];
    if (normalized.length >= 2) return `linear-gradient(90deg, ${normalized[0]} 0 50%, ${normalized[1]} 50% 100%)`;
    return companyMap.kmb;
  }

  function formatProviderTime(ts) {
    if (!ts) return '--:--';
    const d = ts instanceof Date ? ts : new Date(ts);
    if (Number.isNaN(d.getTime())) return '--:--';
    return d.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  function setProviderLiveStatus(provider, state, extra = {}) {
    const key = provider === 'CTB' ? 'ctb' : 'kmb';
    Object.assign(providerLiveStatus[key], { state, ...extra });

    const el = document.getElementById(key === 'ctb' ? 'ctbStatus' : 'kmbStatus');
    if (!el) return;

    el.className = state === 'success' ? 'ok' : state === 'error' ? 'err' : state === 'loading' ? 'loading' : 'muted';
    if (state === 'success') {
      el.textContent = `${key === 'ctb' ? 'CTB' : 'KMB/LWB'} 更新 ${formatProviderTime(providerLiveStatus[key].lastSuccess)}`;
    } else if (state === 'error') {
      el.textContent = `${key === 'ctb' ? 'CTB' : 'KMB/LWB'} ✕ ${providerLiveStatus[key].error || 'API failed'}`;
      el.title = providerLiveStatus[key].error || '';
    } else if (state === 'loading') {
      el.textContent = `${key === 'ctb' ? 'CTB' : 'KMB/LWB'} 更新中…`;
    } else {
      el.textContent = `${key === 'ctb' ? 'CTB' : 'KMB/LWB'} 更新 --:--`;
    }
  }

  function markProviderAttempt(provider) { setProviderLiveStatus(provider, 'loading', { lastAttempt: new Date(), error: '' }); }
  function markProviderSuccess(provider) { setProviderLiveStatus(provider, 'success', { lastSuccess: new Date(), error: '' }); }
  function markProviderError(provider, error) {
    const msg = error instanceof Error ? error.message : String(error || 'API failed');
    setProviderLiveStatus(provider, 'error', { error: msg.slice(0, 80) });
  }

  async function fetchProviderJson(url, provider) {
    markProviderAttempt(provider);
    try {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      let json;
      try { json = JSON.parse(text); } catch { throw new Error(`HTTP ${response.status} / invalid JSON`); }
      markProviderSuccess(provider);
      return json;
    } catch (err) {
      markProviderError(provider, err);
      throw err;
    }
  }

  async function fetchJson(url, options = {}) {
    const response = await fetch(url, { ...options, cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  }

  function extractData(json) {
    if (!json) return [];
    if (Array.isArray(json)) return json;
    return Array.isArray(json.data) ? json.data : [];
  }

  function normalizeServiceType(value) {
    const n = parseInt(value, 10);
    return Number.isFinite(n) ? n : 1;
  }

  function normalizeDirection(value) {
    return String(value || '').toUpperCase();
  }

  function formatDataAge(timestamp) {
    if (!timestamp) return '';
    const t = new Date(timestamp).getTime();
    if (!Number.isFinite(t)) return '';
    const seconds = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (seconds < 60) return `${seconds}秒前`;
    return `${Math.round(seconds / 60)}分鐘前`;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  async function getOrFetchRouteDB() {
    if (routeDb) return routeDb;
    try {
      const cached = localStorage.getItem(ROUTE_DB_KEY);
      if (cached) {
        const { timestamp, data } = JSON.parse(cached);
        if (Date.now() - timestamp < ROUTE_DB_TTL && data) {
          routeDb = { kmb: data.kmb || {}, lwb: data.lwb || {}, ctb: data.ctb || {} };
          return routeDb;
        }
      }
    } catch (e) {}

    const db = { kmb: {}, lwb: {}, ctb: {} };
    try {
      const kmbJson = await fetchJson(`${getProviderApiBase('kmb')}/route-stop`);
      extractData(kmbJson).forEach(item => {
        if (!item?.route || !item?.stop) return;
        const provider = normalizeProvider(item.co);
        const route = String(item.route).toUpperCase();
        if (!db[provider][route]) db[provider][route] = [];
        db[provider][route].push({
          route,
          stopId: String(item.stop),
          seq: parseInt(item.seq, 10) || 0,
          dir: normalizeDirection(item.dir || item.bound),
          serviceType: normalizeServiceType(item.service_type),
          provider,
          providerCode: getProvider(provider).code
        });
      });
    } catch (e) {}

    routeDb = db;
    try { localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: Date.now(), data: db })); } catch (e) {}
    return routeDb;
  }

  const CTB_ROUTE_STOP_DB_TTL = 24 * 60 * 60 * 1000;
  let ctbRouteStopLoadPromise = null;
  let ctbRouteStopLastLoadedAt = 0;

  async function fetchCtbRouteStops(route) {
    const routeKey = String(route || '').trim().toUpperCase();
    if (!routeKey) return [];

    await getOrFetchRouteDB();
    if (routeDb.ctb[routeKey]?.length) return routeDb.ctb[routeKey];

    const results = [];
    for (const direction of ['inbound', 'outbound']) {
      try {
        const url = `https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${encodeURIComponent(routeKey)}/${direction}`;
        const json = await fetchWithCache(url);
        extractData(json).forEach(item => {
          if (!item?.route || !item?.stop) return;
          results.push({
            route: String(item.route).toUpperCase(),
            stopId: String(item.stop).padStart(6, '0'),
            seq: parseInt(item.seq, 10) || 0,
            dir: normalizeDirection(item.dir),
            serviceType: 1,
            provider: 'ctb',
            providerCode: 'CTB'
          });
        });
      } catch (e) {}
    }

    routeDb.ctb[routeKey] = results;
    try { localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: Date.now(), data: routeDb })); } catch (e) {}
    return results;
  }

  async function loadCtbRouteStopDatabase(force = false) {
    if (!force && ctbRouteStopLoadPromise) return ctbRouteStopLoadPromise;

    ctbRouteStopLoadPromise = (async () => {
      await getOrFetchRouteDB();
      if (!force && ctbRouteStopLastLoadedAt && Date.now() - ctbRouteStopLastLoadedAt < CTB_ROUTE_STOP_DB_TTL) {
        return routeDb.ctb;
      }

      try {
        const cached = JSON.parse(localStorage.getItem(ROUTE_DB_KEY) || 'null');
        if (!force && cached?.timestamp && Date.now() - cached.timestamp < CTB_ROUTE_STOP_DB_TTL && cached.data?.ctb && Object.keys(cached.data.ctb).length) {
          routeDb.ctb = cached.data.ctb;
          ctbRouteStopLastLoadedAt = cached.timestamp;
          return routeDb.ctb;
        }
      } catch (e) {}

      const routeJson = await fetchWithCache('https://rt.data.gov.hk/v2/transport/citybus/route/CTB');
      const routeRows = extractData(routeJson);
      const routes = [...new Set(routeRows.map(x => String(x.route || '').trim().toUpperCase()).filter(Boolean))];

      const nextIndex = { value: 0 };
      const worker = async () => {
        while (true) {
          const i = nextIndex.value++;
          if (i >= routes.length) return;
          await fetchCtbRouteStops(routes[i]);
        }
      };
      await Promise.all(Array.from({ length: Math.min(6, routes.length) }, worker));

      ctbRouteStopLastLoadedAt = Date.now();
      try { localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: ctbRouteStopLastLoadedAt, data: routeDb })); } catch (e) {}
      return routeDb.ctb;
    })();

    try { return await ctbRouteStopLoadPromise; } finally { ctbRouteStopLoadPromise = null; }
  }

  async function fetchWeather() {
    try {
      const base = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php';
      const [rhr, flw, fnd, warnsum] = await Promise.all([
        fetchJson(`${base}?dataType=rhrread&lang=tc`),
        fetchJson(`${base}?dataType=flw&lang=tc`),
        fetchJson(`${base}?dataType=fnd&lang=tc`),
        fetchJson(`${base}?dataType=warnsum&lang=tc`)
      ]);
      const temp = rhr?.temperature?.data?.[0]?.value;
      currentTemp = Number.isFinite(Number(temp)) ? `${temp}°C` : '';
      weatherState.updated = new Date();
      weatherState.forecast = flw?.forecastDesc || '';
      weatherState.outlook = flw?.outlook || '';
      const advice = buildCommuteAdvice(rhr, flw, fnd, warnsum);
      weatherState.psr = advice.psr;
      weatherState.summary = advice.summary;
      renderWeatherAdvice(advice);
    } catch (e) {
      currentTemp = '';
      renderWeatherAdvice({ summary: '☁️ 天氣資料暫時未能取得', advice: '天氣資料暫時未能取得', psr: 'NONE' });
    }
    updateMetaText();
  }

  fetchWeather();
  setInterval(fetchWeather, 600000);

  function updateMetaText(statusMsg = '') {
    const parts = ['香港'];
    if (currentTemp) parts.push(currentTemp);
    if (statusMsg) parts.push(statusMsg);
    document.getElementById('meta-text').textContent = parts.join(' • ');
  }

  function updateSearchVisibility() {
    const searchContainer = document.getElementById('toolbar-search');
    const searchInput = document.getElementById('nearby-search');
    if (!searchContainer || !searchInput) return;

    const shouldShow = currentMode === 'nearby';
    searchContainer.classList.toggle('hidden', !shouldShow);
    if (!shouldShow) {
      searchInput.value = '';
    }
  }

  function attachModeHandlers() {
    document.querySelectorAll('.mode-button').forEach(button => {
      button.addEventListener('click', async () => {
        const selectedMode = button.dataset.mode;
        if (selectedMode === currentMode) return;

        currentMode = selectedMode;
        document.querySelectorAll('.mode-button').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
        updateSearchVisibility();

        const etaContainerEl = document.getElementById('eta-container');
        if (etaContainerEl) etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');

        if (currentMode === 'daily') {
          if (savedRoutes.length > 0) {
            activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })))];
            updateMetaText('已儲存站點');
            startEtaLoop();
          } else {
            activeStopIds = [];
            stopEtaLoop();
            document.getElementById('eta-container').innerHTML = '<div class="status-msg">暫無已儲存路線。</div>';
            updateMetaText('已儲存站點');
          }
        } else {
          await initNearbyStops();
          renderEtas(latestEtaResults, latestGeneratedTimestamps);
        }
      });
    });

    async function fetchCtbSearchRoute(routeQuery) {
      const q = String(routeQuery || '').trim().toUpperCase();
      if (!q || currentMode !== 'nearby') return;

      const nearbyCtbStops = nearbyStopIds
        .filter(s => normalizeProvider(s.provider) === 'ctb')
        .slice()
        .sort((a, b) => (a.stopDistance ?? Infinity) - (b.stopDistance ?? Infinity))
        .slice(0, 6);

      if (!nearbyCtbStops.length) return;

      const routeMap = {};
      const generated = new Set();

      const responses = await Promise.all(
        nearbyCtbStops.map(async stop => {
          try {
            const json = await fetchCtbRouteEta(stop.stopId, q);
            return { stop, json, items: extractData(json) };
          } catch (error) {
            return { stop, json: null, items: [] };
          }
        })
      );

      responses.forEach(({ stop, json, items }) => {
        if (json?.generated_timestamp) generated.add(json.generated_timestamp);

        // If CTB API returned empty items for searched route, outer join empty entry so stop appears
        if (!items || items.length === 0) {
          ensureStopInMap(routeMap, {
            stopId: stop.stopId,
            provider: 'ctb',
            route: q,
            dest: '預設方向',
            generatedTimestamp: json?.generated_timestamp || ''
          });
          return;
        }

        items.forEach(rawItem => {
          const item = normalizeEtaItem(rawItem, {
            provider: 'ctb',
            stopId: stop.stopId,
            route: q,
            generatedTimestamp: json?.generated_timestamp || ''
          });

          if (normalizeProvider(item.provider) !== 'ctb') return;
          if (String(item.route || '').toUpperCase() !== q) return;
          addEtaRecord(routeMap, item, new Date());
        });
      });

      const ctbResults = Object.values(routeMap).map(r => {
        r.etas.sort((a, b) => a.minutes - b.minutes);
        return r;
      });

      if (!ctbResults.length) return;

      const currentQuery = document.getElementById('nearby-search')?.value.trim().toUpperCase();
      if (currentMode !== 'nearby' || currentQuery !== q) return;

      const merged = [...latestEtaResults];
      const keys = new Set(
        merged.map(r => `${normalizeProvider(r.provider)}|${r.stopId}|${r.route}|${r.dest}`)
      );

      ctbResults.forEach(r => {
        const key = `${normalizeProvider(r.provider)}|${r.stopId}|${r.route}|${r.dest}`;
        if (!keys.has(key)) {
          merged.push(r);
          keys.add(key);
        } else {
          const idx = merged.findIndex(x =>
            `${normalizeProvider(x.provider)}|${x.stopId}|${x.route}|${x.dest}` === key
          );
          if (idx >= 0) merged[idx] = r;
        }
      });

      latestEtaResults = merged;
      generated.forEach(ts => latestGeneratedTimestamps.add(ts));
      renderEtas(latestEtaResults, latestGeneratedTimestamps);
    }

    const searchInput = document.getElementById('nearby-search');
    if (searchInput) {
      searchInput.addEventListener('input', debounce(async event => {
        if (currentMode !== 'nearby') return;

        const value = event.target.value.trim().toUpperCase();

        renderEtas(latestEtaResults, latestGeneratedTimestamps);

        if (value) {
          const hasCtbMatch = latestEtaResults.some(r =>
            normalizeProvider(r.provider) === 'ctb' &&
            String(r.route || '').trim().toUpperCase() === value
          );

          if (!hasCtbMatch) {
            fetchCtbSearchRoute(value);
          }
        }
      }, 80));
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;

      if (target.dataset.action === 'save-route') {
        addSavedRoute(target.dataset.route, target.dataset.dest, target.dataset.stop, target.dataset.provider || 'kmb', target.dataset.serviceType || 1, target.dataset.dir || '');
        target.dataset.action = 'remove-saved-route';
        target.textContent = '★';
        target.classList.add('saved');
        return;
      }

      if (target.dataset.action === 'remove-saved-route') {
        removeSavedRoute(target.dataset.key);
        if (currentMode === 'daily') {
          activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })))];
          fetchEtas();
        } else {
          target.dataset.action = 'save-route';
          target.textContent = '☆';
          target.classList.remove('saved');
        }
      }
    });
  }

  function requestLocation() {
    if (!('geolocation' in navigator)) return;
    navigator.geolocation.getCurrentPosition(
      pos => {
        applyLocation(pos.coords.latitude, pos.coords.longitude, 'device');
        if (activeStopIds.length > 0) fetchEtas();
        fetchWeather();
      },
      err => {
        usePresetMongKokLocation(err?.message || 'geolocation failed');
        if (activeStopIds.length > 0) fetchEtas();
        fetchWeather();
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  async function initDashboard() {
    loadSavedRoutes();
    attachModeHandlers();

    const etaContainerEl = document.getElementById('eta-container');
    if (etaContainerEl) etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');

    await initStops();
    requestLocation();

    if (currentMode === 'daily') {
      if (savedRoutes.length > 0) {
        activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })))];
        updateMetaText('已儲存站點');
        fetchWeather();
        startEtaLoop();
        return;
      }
      activeStopIds = [];
      document.getElementById('eta-container').innerHTML = '<div class="status-msg">暫無已儲存路線。</div>';
      updateMetaText('已儲存站點');
      return;
    }

    await initNearbyStops();
  }

  async function fetchKmbStops() {
    try {
      const json = await fetchJson(`${getProviderApiBase('kmb')}/stop`);
      return extractData(json).map(stop => ({ ...stop, provider: normalizeProvider(stop.co) }));
    } catch (error) { return []; }
  }

  let ctbStopInventoryCache = null;
  let ctbStopInventoryFetchedAt = 0;
  const CTB_STOP_CACHE_TTL = 24 * 60 * 60 * 1000;
  let ctbStopLoadPromise = null;

  async function fetchCtbStops(force = false) {
    if (!force && ctbStopInventoryCache && Date.now() - ctbStopInventoryFetchedAt < CTB_STOP_CACHE_TTL) {
      return ctbStopInventoryCache;
    }
    if (!force && ctbStopLoadPromise) return ctbStopLoadPromise;

    ctbStopLoadPromise = (async () => {
      try {
        await getOrFetchRouteDB();
        const ctbDb = routeDb?.ctb || {};
        const uniqueStopIds = [...new Set(Object.values(ctbDb).flat().map(row => String(row?.stopId || '').padStart(6, '0')).filter(Boolean))];
        if (!uniqueStopIds.length) throw new Error('CTB Route-Stop cache empty');

        const results = [];
        let next = 0;
        const worker = async () => {
          while (true) {
            const index = next++;
            if (index >= uniqueStopIds.length) return;
            const stopId = uniqueStopIds[index];
            try {
              const json = await fetchJson(`https://rt.data.gov.hk/v2/transport/citybus/stop/${encodeURIComponent(stopId)}`);
              const item = json?.data && !Array.isArray(json.data) ? json.data : (extractData(json)[0] || null);
              if (item?.stop) results.push({ ...item, stop: String(item.stop).padStart(6, '0'), provider: 'ctb', co: 'CTB' });
            } catch (error) {}
          }
        };

        await Promise.all(Array.from({ length: Math.min(8, uniqueStopIds.length) }, worker));
        const byStop = new Map(results.map(stop => [String(stop.stop).padStart(6, '0'), stop]));
        ctbStopInventoryCache = [...byStop.values()];
        ctbStopInventoryFetchedAt = Date.now();
        return ctbStopInventoryCache;
      } catch (error) { return []; }
    })();

    try { return await ctbStopLoadPromise; } finally { ctbStopLoadPromise = null; }
  }

  const STATIC_DB_NAME = 'hk-bus-dashboard-static';
  const STATIC_DB_VERSION = 1;
  const STATIC_DB_STORE = 'snapshots';
  const STATIC_SNAPSHOT_KEY = 'all-providers-v2';
  const STATIC_SNAPSHOT_TTL = 24 * 60 * 60 * 1000;
  let staticDataLoadPromise = null;

  function openStaticDb() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
      const req = indexedDB.open(STATIC_DB_NAME, STATIC_DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STATIC_DB_STORE)) db.createObjectStore(STATIC_DB_STORE, { keyPath: 'key' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
    });
  }

  async function readStaticSnapshot() {
    try {
      const db = await openStaticDb();
      const snapshot = await new Promise((resolve, reject) => {
        const tx = db.transaction(STATIC_DB_STORE, 'readonly');
        const req = tx.objectStore(STATIC_DB_STORE).get(STATIC_SNAPSHOT_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
      db.close();
      if (snapshot?.fetchedAt && Date.now() - snapshot.fetchedAt < STATIC_SNAPSHOT_TTL) return snapshot;
    } catch (e) {}
    return null;
  }

  async function writeStaticSnapshot(snapshot) {
    try {
      const db = await openStaticDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STATIC_DB_STORE, 'readwrite');
        tx.objectStore(STATIC_DB_STORE).put(snapshot);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
      return true;
    } catch (e) { return false; }
  }

  function applyStaticSnapshot(snapshot) {
    if (!snapshot?.routeDb) return false;
    allStops = Array.isArray(snapshot.allStops) ? snapshot.allStops : [];
    routeDb = snapshot.routeDb || { kmb: {}, lwb: {}, ctb: {} };
    buildStopMetaMap();
    ctbRouteStopLastLoadedAt = snapshot.fetchedAt || Date.now();
    return true;
  }

  async function loadUnifiedStaticData(force = false) {
    if (!force && staticDataLoadPromise) return staticDataLoadPromise;

    staticDataLoadPromise = (async () => {
      if (!force) {
        const cached = await readStaticSnapshot();
        if (cached && applyStaticSnapshot(cached)) return true;
      }

      try {
        allStops = await fetchKmbStops();
        routeDb = { kmb: {}, lwb: {}, ctb: {} };
        try {
          const json = await fetchJson(`${getProviderApiBase('kmb')}/route-stop`);
          extractData(json).forEach(item => {
            if (!item?.route || !item?.stop) return;
            const provider = normalizeProvider(item.co);
            const route = String(item.route).toUpperCase();
            if (!routeDb[provider][route]) routeDb[provider][route] = [];
            routeDb[provider][route].push({
              route,
              stopId: String(item.stop),
              seq: parseInt(item.seq, 10) || 0,
              dir: normalizeDirection(item.dir || item.bound),
              serviceType: normalizeServiceType(item.service_type),
              provider,
              providerCode: getProvider(provider).code
            });
          });
        } catch (e) {}

        await loadCtbRouteStopDatabase(true);
        const ctbStops = await fetchCtbStops(true);

        if (ctbStops.length) {
          const seen = new Set(allStops.map(stop => getStopKey(stop.stop, stop.provider)));
          ctbStops.forEach(stop => {
            const key = getStopKey(stop.stop, stop.provider);
            if (!seen.has(key)) {
              allStops.push(stop);
              seen.add(key);
            }
          });
        }

        buildStopMetaMap();
        const fetchedAt = Date.now();
        await writeStaticSnapshot({ key: STATIC_SNAPSHOT_KEY, fetchedAt, allStops, routeDb });
        try { localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: fetchedAt, data: routeDb })); } catch (e) {}
        ctbRouteStopLastLoadedAt = fetchedAt;
        return true;
      } catch (error) { return false; }
    })();

    try { return await staticDataLoadPromise; } finally { staticDataLoadPromise = null; }
  }

  async function initStops() {
    const loaded = await loadUnifiedStaticData(false);
    if (!loaded && allStops.length === 0) {
      const [kmbStops, ctbStops] = await Promise.all([fetchKmbStops(), fetchCtbStops(false)]);
      allStops = [...kmbStops, ...ctbStops];
    }
    buildStopMetaMap();
  }

  async function initNearbyStops() {
    if (allStops.length === 0) await initStops();

    if (!('geolocation' in navigator)) {
      usePresetMongKokLocation('browser does not support geolocation');
      onLocationSuccess({ coords: { latitude: PRESET_TEST_LOCATION.lat, longitude: PRESET_TEST_LOCATION.lng } }, 'preset-mong-kok');
      return;
    }

    navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, { enableHighAccuracy: true, timeout: 10000 });
  }

  function onLocationSuccess(position, source = 'device') {
    const userLat = position.coords.latitude;
    const userLong = position.coords.longitude;
    applyLocation(userLat, userLong, source);

    const nearbyStops = allStops.filter(stop => {
      const lat = parseFloat(stop.lat);
      const lng = parseFloat(stop.long);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;
      return getDistanceKm(userLat, userLong, lat, lng) <= 0.3;
    });

    nearbyStopIds = nearbyStops.map(stop => ({ stopId: stop.stop, provider: stop.provider || 'kmb' }));
    activeStopIds = nearbyStopIds.slice();

    if (activeStopIds.length === 0) {
      document.getElementById('eta-container').innerHTML = '<div class="status-msg">300公尺範圍內沒有巴士站。</div>';
      updateMetaText('沒有附近站點');
      return;
    }

    updateMetaText(locationSource === 'preset-mong-kok' ? '旺角測試位置 · 附近站點（約300公尺）' : '附近站點（約300公尺）');
    startEtaLoop();
  }

  function onLocationError(error) {
    usePresetMongKokLocation(error?.message || 'location unavailable');
    onLocationSuccess({ coords: { latitude: PRESET_TEST_LOCATION.lat, longitude: PRESET_TEST_LOCATION.lng } }, 'preset-mong-kok');
    updateMetaText('旺角測試位置 · 約300公尺');
  }

  function stopEtaLoop() {
    if (etaPollTimer) {
      clearInterval(etaPollTimer);
      etaPollTimer = null;
    }
  }

  function scheduleNextEtaPoll() {
    stopEtaLoop();
    if (!activeStopIds.length) return;
    etaPollTimer = setTimeout(async () => {
      await fetchEtas();
      scheduleNextEtaPoll();
    }, 20000);
  }

  function cancelQueuedEtaRequests() {
    const pending = requestQueue.splice(0);
    pending.forEach(item => {
      try { item.reject(new Error('ETA refresh superseded')); } catch (e) {}
    });
  }

  async function startEtaLoop() {
    stopEtaLoop();
    const generation = ++etaRefreshGeneration;
    cancelQueuedEtaRequests();
    await fetchEtas(generation);
    if (generation === etaRefreshGeneration) scheduleNextEtaPoll();
  }

  function enqueueRequest(task) {
    return new Promise((resolve, reject) => {
      requestQueue.push({ task, resolve, reject });
      pumpRequestQueue();
    });
  }

  function pumpRequestQueue() {
    while (activeRequests < REQUEST_CONCURRENCY && requestQueue.length) {
      const item = requestQueue.shift();
      activeRequests++;
      Promise.resolve()
        .then(item.task)
        .then(item.resolve)
        .catch(item.reject)
        .finally(() => {
          activeRequests--;
          pumpRequestQueue();
        });
    }
  }

  async function fetchWithCache(url) {
    const cached = etaCache.get(url);
    if (cached && Date.now() - cached.timestamp < ETA_CACHE_TTL) return cached.json;
    const json = await enqueueRequest(() => fetchJson(url));
    etaCache.set(url, { timestamp: Date.now(), json });
    return json;
  }

  async function fetchKmbStopEta(stopId) {
    const url = `${getProviderApiBase('kmb')}/stop-eta/${encodeURIComponent(stopId)}`;
    try {
      const json = await fetchWithCache(url);
      markProviderSuccess('KMB');
      return json;
    } catch (error) {
      markProviderError('KMB', error);
      return { data: [] };
    }
  }

  async function fetchKmbRouteEta(stopId, route, serviceType = 1) {
    const safeRoute = encodeURIComponent(route);
    const safeServiceType = encodeURIComponent(normalizeServiceType(serviceType));
    const url = `${getProviderApiBase('kmb')}/eta/${encodeURIComponent(stopId)}/${safeRoute}/${safeServiceType}`;
    try {
      const json = await fetchWithCache(url);
      markProviderSuccess('KMB');
      return json;
    } catch (error) {
      markProviderError('KMB', error);
      return { data: [] };
    }
  }

  async function fetchCtbStopEta(stopId) {
    const safeStop = encodeURIComponent(String(stopId).padStart(6, '0'));
    const url = `https://rt.data.gov.hk/v1/transport/batch/stop-eta/CTB/${safeStop}?lang=zh-hant`;
    try {
      const json = await fetchProviderJson(url, 'CTB');
      markProviderRefresh('ctb');
      return json;
    } catch (error) { return { data: [] }; }
  }

  async function fetchCtbRouteEta(stopId, route) {
    const safeStop = encodeURIComponent(String(stopId).padStart(6, '0'));
    const safeRoute = encodeURIComponent(String(route).toUpperCase());
    const url = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${safeStop}/${safeRoute}`;
    try {
      const json = await fetchProviderJson(url, 'CTB');
      markProviderRefresh('ctb');
      return json;
    } catch (error) { return { data: [] }; }
  }

  function normalizeEtaRemark(remark) {
    const text = String(remark || '').trim();
    return text.includes('慢') ? text : '';
  }

  function normalizeEtaItem(item, fallback = {}) {
    return {
      co: item?.co || fallback.co || getProvider(fallback.provider).code,
      route: String(item?.route ?? fallback.route ?? ''),
      dir: normalizeDirection(item?.dir ?? fallback.dir),
      serviceType: normalizeServiceType(item?.service_type ?? fallback.serviceType),
      seq: parseInt(item?.seq ?? fallback.seq, 10) || 0,
      stop: item?.stop || fallback.stopId,
      destination: item?.dest_tc || item?.dest_en || item?.dest || fallback.dest || '未知',
      eta: item?.eta || '',
      etaSeq: item?.eta_seq ?? null,
      remark: item?.rmk_tc || item?.rmk || item?.rmk_en || '',
      generatedTimestamp: fallback.generatedTimestamp || '',
      provider: normalizeProvider(item?.co || fallback.provider)
    };
  }

  function buildDailyTasks() {
    const tasks = [];
    const seen = new Set();
    savedRoutes.forEach(savedRoute => {
      const provider = normalizeProvider(savedRoute.provider);
      const key = [provider, savedRoute.stopId, savedRoute.route, savedRoute.dest].join('|');
      if (seen.has(key)) return;
      seen.add(key);

      tasks.push({
        mode: 'specific',
        provider,
        stopId: savedRoute.stopId,
        route: savedRoute.route,
        serviceType: normalizeServiceType(savedRoute.serviceType),
        dir: normalizeDirection(savedRoute.dir),
        dest: savedRoute.dest
      });
    });
    return tasks;
  }

  function ensureStopInMap(routeMap, meta) {
    const stopId = meta.stopId;
    const provider = normalizeProvider(meta.provider);
    const route = meta.route || '---';
    const destination = meta.dest || '站點服務';
    const key = [provider, stopId, route, destination].join('|');

    if (!routeMap[key]) {
      const stopLabel = getStopName(stopId, provider);
      const stopInfo = getStopInfo(stopId, provider);
      const stopDistance = userLocation && stopInfo
        ? getDistanceKm(userLocation.lat, userLocation.lng, parseFloat(stopInfo.lat), parseFloat(stopInfo.long))
        : Number.POSITIVE_INFINITY;

      routeMap[key] = {
        route: route,
        dest: destination,
        stopId,
        provider,
        serviceType: meta.serviceType || 1,
        dir: meta.dir || '',
        stopName: stopLabel,
        stopDistance,
        generatedTimestamp: meta.generatedTimestamp || '',
        etas: []
      };
    }
    return routeMap[key];
  }

  async function fetchEtas(generation = etaRefreshGeneration) {
    if (!activeStopIds.length) return;

    const routeMap = {};
    const now = new Date();
    const generatedTimestamps = new Set();

    if (currentMode === 'daily' && savedRoutes.length > 0) {
      const tasks = buildDailyTasks();
      const responses = await Promise.all(
        tasks.map(async task => {
          try {
            const json = normalizeProvider(task.provider) === 'ctb'
              ? await fetchCtbRouteEta(task.stopId, task.route)
              : await fetchKmbRouteEta(task.stopId, task.route, task.serviceType);
            return { task, json, items: extractData(json) };
          } catch (error) { return { task, json: null, items: [] }; }
        })
      );

      responses.forEach(({ task, json, items }) => {
        if (json?.generated_timestamp) generatedTimestamps.add(json.generated_timestamp);
        
        // Fact Table entry: guarantee stop presence even with no ETA
        ensureStopInMap(routeMap, {
          stopId: task.stopId,
          provider: task.provider,
          route: task.route,
          dest: task.dest,
          serviceType: task.serviceType,
          dir: task.dir,
          generatedTimestamp: json?.generated_timestamp || ''
        });

        const savedMatches = savedRoutes.filter(saved =>
          saved.stopId === task.stopId &&
          normalizeProvider(saved.provider) === normalizeProvider(task.provider) &&
          String(saved.route).toUpperCase() === String(task.route).toUpperCase() &&
          normalizeServiceType(saved.serviceType) === task.serviceType
        );

        items.forEach(rawItem => {
          const item = normalizeEtaItem(rawItem, {
            provider: normalizeProvider(task.provider),
            stopId: task.stopId,
            route: task.route,
            serviceType: task.serviceType,
            dir: task.dir,
            dest: task.dest,
            generatedTimestamp: json?.generated_timestamp || ''
          });

          if (normalizeProvider(item.provider) !== normalizeProvider(task.provider)) return;
          if (item.route.toUpperCase() !== String(task.route).toUpperCase()) return;
          if (task.dir && item.dir && item.dir !== task.dir) return;

          const savedMatch = savedMatches.find(saved => normalizeProvider(task.provider) === 'ctb' ? true : (saved.dir ? saved.dir === item.dir : true));
          if (!savedMatch) return;

          addEtaRecord(routeMap, item, now);
        });
      });
    } else {
      const stopTasks = [...new Map(activeStopIds.map(item => [
        `${normalizeProvider(item.provider)}|${item.stopId}`,
        { ...item, normProvider: normalizeProvider(item.provider) }
      ])).values()];

      const responses = await Promise.all(
        stopTasks.map(async task => {
          try {
            const json = task.normProvider === 'ctb'
              ? await fetchCtbStopEta(task.stopId)
              : await fetchKmbStopEta(task.stopId);

            return { task, json, items: extractData(json) };
          } catch (error) {
            return { task, json: null, items: [] };
          }
        })
      );

      responses.forEach(({ task, json, items }) => {
        if (json?.generated_timestamp) generatedTimestamps.add(json.generated_timestamp);

        // FACT TABLE OUTER JOIN: Force initialization of the stop in routeMap 
        // even if the API yields an empty payload for CTB / KMB
        ensureStopInMap(routeMap, {
          stopId: task.stopId,
          provider: task.normProvider,
          generatedTimestamp: json?.generated_timestamp || ''
        });

        items.forEach(rawItem => {
          const item = normalizeEtaItem(rawItem, {
            provider: task.normProvider,
            stopId: task.stopId,
            generatedTimestamp: json?.generated_timestamp || ''
          });

          if (normalizeProvider(item.provider) !== task.normProvider) return;
          addEtaRecord(routeMap, item, now);
        });
      });
    }

// Add a filter step at the end of fetchEtas() before passing data to renderEtas()
const groupedList = Object.values(routeMap)
  .filter(r => {
    // If it's a dummy placeholder with no route number and no ETAs, discard it
    if (r.route === '---' && r.etas.length === 0) return false;
    return true;
  })
  .map(r => {
    r.etas.sort((a, b) => a.minutes - b.minutes);
    return r;
  });

    if (generation !== etaRefreshGeneration) return;

    latestEtaResults = groupedList;
    latestGeneratedTimestamps = new Set(generatedTimestamps);

    renderEtas(latestEtaResults, latestGeneratedTimestamps);
    updateLastUpdated([...new Set(groupedList.map(item => item.provider))]);
  }

  function addEtaRecord(routeMap, item, now) {
    if (!item.route || !item.stop) return;

    const stopId = item.stop;
    const provider = normalizeProvider(item.provider);
    const destination = item.destination;

    const record = ensureStopInMap(routeMap, {
      stopId,
      provider,
      route: item.route,
      dest: destination,
      serviceType: item.serviceType,
      dir: item.dir,
      generatedTimestamp: item.generatedTimestamp
    });

    if (item.eta && String(item.eta).trim() !== '') {
      const etaTime = new Date(item.eta);
      const diffMins = Math.round((etaTime - now) / 60000);

      if (diffMins >= 0 && diffMins <= 180) {
        record.etas.push({
          minutes: diffMins,
          timestamp: item.eta,
          etaSeq: item.etaSeq,
          remark: normalizeEtaRemark(item.remark)
        });
      }
    }
  }

  function renderEtas(routes, generatedTimestamps = new Set()) {
    const container = document.getElementById('eta-container');
    const searchInput = document.getElementById('nearby-search');
    const searchQuery = currentMode === 'nearby' && searchInput
      ? searchInput.value.trim().toUpperCase()
      : '';

    if (searchQuery) {
      routes = routes.filter(r =>
        String(r.route || '').trim().toUpperCase() === searchQuery
      );
    }

    if (routes.length === 0) {
      container.innerHTML = `<div class="status-msg">${searchQuery ? '沒有符合搜尋條件的巴士。' : '沒有即將到達的巴士。'}</div>`;
      return;
    }

    const stopsMap = new Map();

    routes.forEach(r => {
      const stopId = r.stopId || 'unknown';
      const provider = normalizeProvider(r.provider);
      const stopKey = `${provider}|${stopId}`;

      if (!stopsMap.has(stopKey)) {
        stopsMap.set(stopKey, {
          stopId,
          provider,
          stopName: r.stopName || '站點資料未提供',
          stopDistance: r.stopDistance,
          items: []
        });
      }
      stopsMap.get(stopKey).items.push(r);
    });

    const sortedStops = [...stopsMap.values()].sort((a, b) => {
      const distA = Number.isFinite(a.stopDistance) ? a.stopDistance : Infinity;
      const distB = Number.isFinite(b.stopDistance) ? b.stopDistance : Infinity;

      if (distA !== distB) return distA - distB;

      if (currentMode === 'daily') {
        const indexA = savedRoutes.findIndex(item => item.stopId === a.stopId);
        const indexB = savedRoutes.findIndex(item => item.stopId === b.stopB);
        return (indexA !== -1 ? indexA : 999) - (indexB !== -1 ? indexB : 999);
      }

      return a.stopName.localeCompare(b.stopName, 'zh-HK');
    });

    container.innerHTML = sortedStops.map(({ stopId, stopName, stopDistance, items }) => {
      const stopDistanceText = Number.isFinite(stopDistance) ? `${Math.round(stopDistance * 1000)}m` : '站點';

      items.sort((a, b) => {
        const etaA = a.etas[0]?.minutes ?? 9999;
        const etaB = b.etas[0]?.minutes ?? 9999;
        if (etaA !== etaB) return etaA - etaB;
        return a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' });
      });

      const cardMarkup = items.map(r => {
        const firstEta = r.etas[0]?.minutes;
        const nextEtas = r.etas.slice(1, 3).map(eta => `${eta.minutes}分`).reverse().join(' | ');

        const primaryEtaRemark = normalizeEtaRemark(r.etas[0]?.remark);
        const secondaryRemarks = r.etas.slice(1, 3)
          .map((eta, index) => ({ label: eta.minutes, remark: normalizeEtaRemark(eta.remark), ordinal: index + 2 }))
          .filter(item => item.remark);

        let timeClass = 'safe';
        let displayTime = firstEta != null ? `${firstEta}<span class="unit">分</span>` : '暫無';

        if (firstEta == null) {
          timeClass = 'muted';
        } else if (firstEta === 0) {
          timeClass = 'due';
          displayTime = '到站';
        } else if (firstEta <= 3) {
          timeClass = 'urgent';
        } else if (firstEta <= 7) {
          timeClass = 'warning';
        }

        const provider = r.provider || 'kmb';
        const isSaved = isSavedRoute(r.route, r.dest, stopId, provider, r.serviceType, r.dir);

        const action = isSaved ? 'remove-saved-route' : 'save-route';
        const starIcon = isSaved ? '★' : '☆';
        const savedClass = isSaved ? 'saved' : '';
        const key = getSavedRouteKey(r.route, r.dest, stopId, provider, r.serviceType, r.dir);

        const remarkMarkup = primaryEtaRemark
          ? `<div class="eta-remark" title="${escapeHtml(primaryEtaRemark)}">${escapeHtml(primaryEtaRemark)}</div>`
          : '';

        const secondaryRemarkMarkup = secondaryRemarks.length
          ? `<div class="eta-secondary-remark" title="${escapeHtml(secondaryRemarks.map(x => `${x.label}分：${x.remark}`).join('；'))}">${escapeHtml(secondaryRemarks.map(x => `${x.label}分：${x.remark}`).join('；'))}</div>`
          : '';

        return `
          <div class="eta-card">
            <div class="route-info">
              <div class="route-badge" style="background:${getCompanyColours(provider)};" title="${escapeHtml(getProvider(provider).label)}">
                ${escapeHtml(r.route)}
              </div>
              <div class="destination-wrap">
                <div class="destination">${escapeHtml(r.dest)}</div>
              </div>
            </div>

            <div class="eta-times">
              <div class="eta-time-stack">
                ${nextEtas ? `<div class="eta-secondary">${nextEtas}</div>` : ''}
                <div class="eta-primary ${timeClass}">${displayTime}</div>
                ${secondaryRemarkMarkup}
              </div>
              <button
                class="save-route-btn ${savedClass}"
                data-action="${action}"
                data-key="${escapeHtml(key)}"
                data-route="${escapeHtml(r.route)}"
                data-dest="${escapeHtml(r.dest)}"
                data-stop="${escapeHtml(stopId)}"
                data-provider="${escapeHtml(provider)}"
                data-service-type="${escapeHtml(r.serviceType)}"
                data-dir="${escapeHtml(r.dir)}"
                title="${isSaved ? '取消儲存' : '儲存路線'}">
                ${starIcon}
              </button>
            </div>
            ${remarkMarkup}
          </div>
        `;
      }).join('');

      const timestampText = [...generatedTimestamps][0] ? `資料 ${formatDataAge([...generatedTimestamps][0])}` : '';

      return `
        <div class="stop-group">
          <div class="stop-header">
            <div class="stop-header-title">${escapeHtml(stopName)}</div>
            <div class="stop-header-distance">
              ${escapeHtml(stopDistanceText)}
              ${timestampText ? ` · ${escapeHtml(timestampText)}` : ''}
            </div>
          </div>
          <div class="stop-card-list">${cardMarkup}</div>
        </div>
      `;
    }).join('');
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopEtaLoop();
    else if (activeStopIds.length) startEtaLoop();
  });

  updateSearchVisibility();
  initDashboard();
  </script>
</body>
</html>
