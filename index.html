    async function fetchCtbSearchRoute(routeQuery) {
      const q = String(routeQuery || '').trim().toUpperCase();
      if (!q || currentMode !== 'nearby') return;

      const nearbyCtbStops = nearbyStopIds
        .filter(s => normalizeProvider(s.provider) === 'ctb')
        .slice()
        .sort((a, b) => (a.stopDistance ?? Infinity) - (b.stopDistance ?? Infinity))
        .slice(0, 6);

      if (!nearbyCtbStops.length) return;

      const routeMap = {};
      const generated = new Set();

      const responses = await Promise.all(
        nearbyCtbStops.map(async stop => {
          try {
            const json = await fetchCtbRouteEta(stop.stopId, q);
            return { stop, json, items: extractData(json) };
          } catch (error) {
            return { stop, json: null, items: [] };
          }
        })
      );

      responses.forEach(({ stop, json, items }) => {
        if (json?.generated_timestamp) generated.add(json.generated_timestamp);

        if (!items || items.length === 0) {
          ensureStopInMap(routeMap, {
            stopId: stop.stopId,
            provider: 'ctb',
            route: q,
            dest: '預設方向',
            generatedTimestamp: json?.generated_timestamp || ''
          });
          return;
        }

        items.forEach(rawItem => {
          const item = normalizeEtaItem(rawItem, {
            provider: 'ctb',
            stopId: stop.stopId,
            route: q,
            generatedTimestamp: json?.generated_timestamp || ''
          });

          if (normalizeProvider(item.provider) !== 'ctb') return;
          if (String(item.route || '').toUpperCase() !== q) return;
          addEtaRecord(routeMap, item, new Date());
        });
      });

      const ctbResults = Object.values(routeMap).map(r => {
        r.etas.sort((a, b) => a.minutes - b.minutes);
        return r;
      });

      if (!ctbResults.length) return;

      const currentQuery = document.getElementById('nearby-search')?.value.trim().toUpperCase();
      if (currentMode !== 'nearby' || currentQuery !== q) return;

      const merged = [...latestEtaResults];
      const keys = new Set(
        merged.map(r => `${normalizeProvider(r.provider)}|${r.stopId}|${r.route}|${r.dest}`)
      );

      ctbResults.forEach(r => {
        const key = `${normalizeProvider(r.provider)}|${r.stopId}|${r.route}|${r.dest}`;
        if (!keys.has(key)) {
          merged.push(r);
          keys.add(key);
        } else {
          const idx = merged.findIndex(x =>
            `${normalizeProvider(x.provider)}|${x.stopId}|${x.route}|${x.dest}` === key
          );
          if (idx >= 0) merged[idx] = r;
        }
      });

      latestEtaResults = merged;
      generated.forEach(ts => latestGeneratedTimestamps.add(ts));
      renderEtas(latestEtaResults, latestGeneratedTimestamps);
    }

    const searchInput = document.getElementById('nearby-search');
    if (searchInput) {
      searchInput.addEventListener('input', debounce(async event => {
        if (currentMode !== 'nearby') return;

        const value = event.target.value.trim().toUpperCase();

        renderEtas(latestEtaResults, latestGeneratedTimestamps);

        if (value) {
          const hasCtbMatch = latestEtaResults.some(r =>
            normalizeProvider(r.provider) === 'ctb' &&
            String(r.route || '').trim().toUpperCase() === value
          );

          if (!hasCtbMatch) {
            fetchCtbSearchRoute(value);
          }
        }
      }, 80));
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;

      if (target.dataset.action === 'save-route') {
        addSavedRoute(target.dataset.route, target.dataset.dest, target.dataset.stop, target.dataset.provider || 'kmb', target.dataset.serviceType || 1, target.dataset.dir || '');
        target.dataset.action = 'remove-saved-route';
        target.textContent = '★';
        target.classList.add('saved');
        return;
      }

      if (target.dataset.action === 'remove-saved-route') {
        removeSavedRoute(target.dataset.key);
        if (currentMode === 'daily') {
          activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })))];
          fetchEtas();
        } else {
          target.dataset.action = 'save-route';
          target.textContent = '☆';
          target.classList.remove('saved');
        }
      }
    });
  }

  function requestLocation() {
    if (!('geolocation' in navigator)) return;
    navigator.geolocation.getCurrentPosition(
      pos => {
        applyLocation(pos.coords.latitude, pos.coords.longitude, 'device');
        if (activeStopIds.length > 0) fetchEtas();
        fetchWeather();
      },
      err => {
        usePresetMongKokLocation(err?.message || 'geolocation failed');
        if (activeStopIds.length > 0) fetchEtas();
        fetchWeather();
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  async function initDashboard() {
    loadSavedRoutes();
    attachModeHandlers();

    const etaContainerEl = document.getElementById('eta-container');
    if (etaContainerEl) etaContainerEl.classList.toggle('daily-columns', currentMode === 'daily');

    await initStops();
    requestLocation();

    if (currentMode === 'daily') {
      if (savedRoutes.length > 0) {
        activeStopIds = [...new Set(savedRoutes.map(item => ({ stopId: item.stopId, provider: item.provider || 'kmb' })))];
        updateMetaText('已儲存站點');
        fetchWeather();
        startEtaLoop();
        return;
      }
      activeStopIds = [];
      document.getElementById('eta-container').innerHTML = '<div class="status-msg">暫無已儲存路線。</div>';
      updateMetaText('已儲存站點');
      return;
    }

    await initNearbyStops();
  }

  async function fetchKmbStops() {
    try {
      const json = await fetchJson(`${getProviderApiBase('kmb')}/stop`);
      return extractData(json).map(stop => ({ ...stop, provider: normalizeProvider(stop.co) }));
    } catch (error) { return []; }
  }

  let ctbStopInventoryCache = null;
  let ctbStopInventoryFetchedAt = 0;
  const CTB_STOP_CACHE_TTL = 24 * 60 * 60 * 1000;
  let ctbStopLoadPromise = null;

  async function fetchCtbStops(force = false) {
    if (!force && ctbStopInventoryCache && Date.now() - ctbStopInventoryFetchedAt < CTB_STOP_CACHE_TTL) {
      return ctbStopInventoryCache;
    }
    if (!force && ctbStopLoadPromise) return ctbStopLoadPromise;

    ctbStopLoadPromise = (async () => {
      try {
        await getOrFetchRouteDB();
        const ctbDb = routeDb?.ctb || {};
        const uniqueStopIds = [...new Set(Object.values(ctbDb).flat().map(row => String(row?.stopId || '').padStart(6, '0')).filter(Boolean))];
        if (!uniqueStopIds.length) throw new Error('CTB Route-Stop cache empty');

        const results = [];
        let next = 0;
        const worker = async () => {
          while (true) {
            const index = next++;
            if (index >= uniqueStopIds.length) return;
            const stopId = uniqueStopIds[index];
            try {
              const json = await fetchJson(`https://rt.data.gov.hk/v2/transport/citybus/stop/${encodeURIComponent(stopId)}`);
              const item = json?.data && !Array.isArray(json.data) ? json.data : (extractData(json)[0] || null);
              if (item?.stop) results.push({ ...item, stop: String(item.stop).padStart(6, '0'), provider: 'ctb', co: 'CTB' });
            } catch (error) {}
          }
        };

        await Promise.all(Array.from({ length: Math.min(8, uniqueStopIds.length) }, worker));
        const byStop = new Map(results.map(stop => [String(stop.stop).padStart(6, '0'), stop]));
        ctbStopInventoryCache = [...byStop.values()];
        ctbStopInventoryFetchedAt = Date.now();
        return ctbStopInventoryCache;
      } catch (error) { return []; }
    })();

    try { return await ctbStopLoadPromise; } finally { ctbStopLoadPromise = null; }
  }

  const STATIC_DB_NAME = 'hk-bus-dashboard-static';
  const STATIC_DB_VERSION = 1;
  const STATIC_DB_STORE = 'snapshots';
  const STATIC_SNAPSHOT_KEY = 'all-providers-v2';
  const STATIC_SNAPSHOT_TTL = 24 * 60 * 60 * 1000;
  let staticDataLoadPromise = null;

  function openStaticDb() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
      const req = indexedDB.open(STATIC_DB_NAME, STATIC_DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STATIC_DB_STORE)) db.createObjectStore(STATIC_DB_STORE, { keyPath: 'key' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
    });
  }

  async function readStaticSnapshot() {
    try {
      const db = await openStaticDb();
      const snapshot = await new Promise((resolve, reject) => {
        const tx = db.transaction(STATIC_DB_STORE, 'readonly');
        const req = tx.objectStore(STATIC_DB_STORE).get(STATIC_SNAPSHOT_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
      db.close();
      if (snapshot?.fetchedAt && Date.now() - snapshot.fetchedAt < STATIC_SNAPSHOT_TTL) return snapshot;
    } catch (e) {}
    return null;
  }

  async function writeStaticSnapshot(snapshot) {
    try {
      const db = await openStaticDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STATIC_DB_STORE, 'readwrite');
        tx.objectStore(STATIC_DB_STORE).put(snapshot);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
      return true;
    } catch (e) { return false; }
  }

  function applyStaticSnapshot(snapshot) {
    if (!snapshot?.routeDb) return false;
    allStops = Array.isArray(snapshot.allStops) ? snapshot.allStops : [];
    routeDb = snapshot.routeDb || { kmb: {}, lwb: {}, ctb: {} };
    buildStopMetaMap();
    ctbRouteStopLastLoadedAt = snapshot.fetchedAt || Date.now();
    logDebug(`Applied static snapshot with ${allStops.length} stops.`);
    return true;
  }

  async function loadUnifiedStaticData(force = false) {
    if (!force && staticDataLoadPromise) return staticDataLoadPromise;

    staticDataLoadPromise = (async () => {
      if (!force) {
        const cached = await readStaticSnapshot();
        if (cached && applyStaticSnapshot(cached)) return true;
      }

      try {
        allStops = await fetchKmbStops();
        routeDb = { kmb: {}, lwb: {}, ctb: {} };
        try {
          const json = await fetchJson(`${getProviderApiBase('kmb')}/route-stop`);
          extractData(json).forEach(item => {
            if (!item?.route || !item?.stop) return;
            const provider = normalizeProvider(item.co);
            const route = String(item.route).toUpperCase();
            if (!routeDb[provider][route]) routeDb[provider][route] = [];
            routeDb[provider][route].push({
              route,
              stopId: String(item.stop),
              seq: parseInt(item.seq, 10) || 0,
              dir: normalizeDirection(item.dir || item.bound),
              serviceType: normalizeServiceType(item.service_type),
              provider,
              providerCode: getProvider(provider).code
            });
          });
        } catch (e) {}

        await loadCtbRouteStopDatabase(true);
        const ctbStops = await fetchCtbStops(true);

        if (ctbStops.length) {
          const seen = new Set(allStops.map(stop => getStopKey(stop.stop, stop.provider)));
          ctbStops.forEach(stop => {
            const key = getStopKey(stop.stop, stop.provider);
            if (!seen.has(key)) {
              allStops.push(stop);
              seen.add(key);
            }
          });
        }

        buildStopMetaMap();
        const fetchedAt = Date.now();
        await writeStaticSnapshot({ key: STATIC_SNAPSHOT_KEY, fetchedAt, allStops, routeDb });
        try { localStorage.setItem(ROUTE_DB_KEY, JSON.stringify({ timestamp: fetchedAt, data: routeDb })); } catch (e) {}
        ctbRouteStopLastLoadedAt = fetchedAt;
        return true;
      } catch (error) { return false; }
    })();

    try { return await staticDataLoadPromise; } finally { staticDataLoadPromise = null; }
  }

  async function initStops() {
    const loaded = await loadUnifiedStaticData(false);
    if (!loaded && allStops.length === 0) {
      const [kmbStops, ctbStops] = await Promise.all([fetchKmbStops(), fetchCtbStops(false)]);
      allStops = [...kmbStops, ...ctbStops];
    }
    buildStopMetaMap();
  }

  async function initNearbyStops() {
    if (allStops.length === 0) await initStops();

    if (!('geolocation' in navigator)) {
      usePresetMongKokLocation('browser does not support geolocation');
      onLocationSuccess({ coords: { latitude: PRESET_TEST_LOCATION.lat, longitude: PRESET_TEST_LOCATION.lng } }, 'preset-mong-kok');
      return;
    }

    navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, { enableHighAccuracy: true, timeout: 10000 });
  }

  function onLocationSuccess(position, source = 'device') {
    const userLat = position.coords.latitude;
    const userLong = position.coords.longitude;
    applyLocation(userLat, userLong, source);

    const nearbyStops = allStops.filter(stop => {
      const lat = parseFloat(stop.lat);
      const lng = parseFloat(stop.long);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;
      return getDistanceKm(userLat, userLong, lat, lng) <= 0.3;
    });

    nearbyStopIds = nearbyStops.map(stop => ({ stopId: stop.stop, provider: stop.provider || 'kmb' }));
    activeStopIds = nearbyStopIds.slice();

    if (activeStopIds.length === 0) {
      document.getElementById('eta-container').innerHTML = '<div class="status-msg">300公尺範圍內沒有巴士站。</div>';
      updateMetaText('沒有附近站點');
      return;
    }

    updateMetaText(locationSource === 'preset-mong-kok' ? '旺角測試位置 (約300m)' : '附近站點 (約300m)');
    startEtaLoop();
  }

  function onLocationError(error) {
    usePresetMongKokLocation(error?.message || 'location unavailable');
    onLocationSuccess({ coords: { latitude: PRESET_TEST_LOCATION.lat, longitude: PRESET_TEST_LOCATION.lng } }, 'preset-mong-kok');
  }

  function stopEtaLoop() {
    if (etaPollTimer) {
      clearInterval(etaPollTimer);
      etaPollTimer = null;
    }
  }

  function scheduleNextEtaPoll() {
    stopEtaLoop();
    if (!activeStopIds.length) return;
    etaPollTimer = setTimeout(async () => {
      await fetchEtas();
      scheduleNextEtaPoll();
    }, 20000);
  }

  function cancelQueuedEtaRequests() {
    const pending = requestQueue.splice(0);
    pending.forEach(item => {
      try { item.reject(new Error('ETA refresh superseded')); } catch (e) {}
    });
  }

  async function startEtaLoop() {
    stopEtaLoop();
    const generation = ++etaRefreshGeneration;
    cancelQueuedEtaRequests();
    await fetchEtas(generation);
    if (generation === etaRefreshGeneration) scheduleNextEtaPoll();
  }

  function enqueueRequest(task) {
    return new Promise((resolve, reject) => {
      requestQueue.push({ task, resolve, reject });
      pumpRequestQueue();
    });
  }

  function pumpRequestQueue() {
    while (activeRequests < REQUEST_CONCURRENCY && requestQueue.length) {
      const item = requestQueue.shift();
      activeRequests++;
      Promise.resolve()
        .then(item.task)
        .then(item.resolve)
        .catch(item.reject)
        .finally(() => {
          activeRequests--;
          pumpRequestQueue();
        });
    }
  }

  async function fetchWithCache(url) {
    const cached = etaCache.get(url);
    if (cached && Date.now() - cached.timestamp < ETA_CACHE_TTL) return cached.json;
    const json = await enqueueRequest(() => fetchJson(url));
    etaCache.set(url, { timestamp: Date.now(), json });
    return json;
  }

  async function fetchKmbStopEta(stopId) {
    const url = `${getProviderApiBase('kmb')}/stop-eta/${encodeURIComponent(stopId)}`;
    try {
      const json = await fetchWithCache(url);
      markProviderSuccess('KMB');
      return json;
    } catch (error) {
      markProviderError('KMB', error);
      return { data: [] };
    }
  }

  async function fetchKmbRouteEta(stopId, route, serviceType = 1) {
    const safeRoute = encodeURIComponent(route);
    const safeServiceType = encodeURIComponent(normalizeServiceType(serviceType));
    const url = `${getProviderApiBase('kmb')}/eta/${encodeURIComponent(stopId)}/${safeRoute}/${safeServiceType}`;
    try {
      const json = await fetchWithCache(url);
      markProviderSuccess('KMB');
      return json;
    } catch (error) {
      markProviderError('KMB', error);
      return { data: [] };
    }
  }

  async function fetchCtbStopEta(stopId) {
    const safeStop = encodeURIComponent(String(stopId).padStart(6, '0'));
    const url = `https://rt.data.gov.hk/v1/transport/batch/stop-eta/CTB/${safeStop}?lang=zh-hant`;
    try {
      const json = await fetchProviderJson(url, 'CTB');
      markProviderRefresh('ctb');
      return json;
    } catch (error) { return { data: [] }; }
  }

  async function fetchCtbRouteEta(stopId, route) {
    const safeStop = encodeURIComponent(String(stopId).padStart(6, '0'));
    const safeRoute = encodeURIComponent(String(route).toUpperCase());
    const url = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${safeStop}/${safeRoute}`;
    try {
      const json = await fetchProviderJson(url, 'CTB');
      markProviderRefresh('ctb');
      return json;
    } catch (error) { return { data: [] }; }
  }

  function normalizeEtaRemark(remark) {
    const text = String(remark || '').trim();
    return text.includes('慢') ? text : '';
  }

  function normalizeEtaItem(item, fallback = {}) {
    return {
      co: item?.co || fallback.co || getProvider(fallback.provider).code,
      route: String(item?.route ?? fallback.route ?? ''),
      dir: normalizeDirection(item?.dir ?? fallback.dir),
      serviceType: normalizeServiceType(item?.service_type ?? fallback.serviceType),
      seq: parseInt(item?.seq ?? fallback.seq, 10) || 0,
      stop: item?.stop || fallback.stopId,
      destination: item?.dest_tc || item?.dest_en || item?.dest || fallback.dest || '未知',
      eta: item?.eta || '',
      etaSeq: item?.eta_seq ?? null,
      remark: item?.rmk_tc || item?.rmk || item?.rmk_en || '',
      generatedTimestamp: fallback.generatedTimestamp || '',
      provider: normalizeProvider(item?.co || fallback.provider)
    };
  }

  function buildDailyTasks() {
    const tasks = [];
    const seen = new Set();
    savedRoutes.forEach(savedRoute => {
      const provider = normalizeProvider(savedRoute.provider);
      const key = [provider, savedRoute.stopId, savedRoute.route, savedRoute.dest].join('|');
      if (seen.has(key)) return;
      seen.add(key);

      tasks.push({
        mode: 'specific',
        provider,
        stopId: savedRoute.stopId,
        route: savedRoute.route,
        serviceType: normalizeServiceType(savedRoute.serviceType),
        dir: normalizeDirection(savedRoute.dir),
        dest: savedRoute.dest
      });
    });
    return tasks;
  }

  function ensureStopInMap(routeMap, meta) {
    const stopId = meta.stopId;
    const provider = normalizeProvider(meta.provider);
    const route = meta.route || '---';
    const destination = meta.dest || '站點服務';
    const key = [provider, stopId, route, destination].join('|');

    if (!routeMap[key]) {
      const stopLabel = getStopName(stopId, provider);
      const stopInfo = getStopInfo(stopId, provider);
      const stopDistance = userLocation && stopInfo
        ? getDistanceKm(userLocation.lat, userLocation.lng, parseFloat(stopInfo.lat), parseFloat(stopInfo.long))
        : Number.POSITIVE_INFINITY;

      routeMap[key] = {
        route: route,
        dest: destination,
        stopId,
        provider,
        serviceType: meta.serviceType || 1,
        dir: meta.dir || '',
        stopName: stopLabel,
        stopDistance,
        generatedTimestamp: meta.generatedTimestamp || '',
        etas: []
      };
    }
    return routeMap[key];
  }

  async function fetchEtas(generation = etaRefreshGeneration) {
    if (!activeStopIds.length) return;

    logDebug(`Fetching ETAs for ${activeStopIds.length} stops...`);
    const routeMap = {};
    const now = new Date();
    const generatedTimestamps = new Set();

    if (currentMode === 'daily' && savedRoutes.length > 0) {
      const tasks = buildDailyTasks();
      const responses = await Promise.all(
        tasks.map(async task => {
          try {
            const json = normalizeProvider(task.provider) === 'ctb'
              ? await fetchCtbRouteEta(task.stopId, task.route)
              : await fetchKmbRouteEta(task.stopId, task.route, task.serviceType);
            return { task, json, items: extractData(json) };
          } catch (error) { return { task, json: null, items: [] }; }
        })
      );

      responses.forEach(({ task, json, items }) => {
        if (json?.generated_timestamp) generatedTimestamps.add(json.generated_timestamp);
        
        ensureStopInMap(routeMap, {
          stopId: task.stopId,
          provider: task.provider,
          route: task.route,
          dest: task.dest,
          serviceType: task.serviceType,
          dir: task.dir,
          generatedTimestamp: json?.generated_timestamp || ''
        });

        const savedMatches = savedRoutes.filter(saved =>
          saved.stopId === task.stopId &&
          normalizeProvider(saved.provider) === normalizeProvider(task.provider) &&
          String(saved.route).toUpperCase() === String(task.route).toUpperCase() &&
          normalizeServiceType(saved.serviceType) === task.serviceType
        );

        items.forEach(rawItem => {
          const item = normalizeEtaItem(rawItem, {
            provider: normalizeProvider(task.provider),
            stopId: task.stopId,
            route: task.route,
            serviceType: task.serviceType,
            dir: task.dir,
            dest: task.dest,
            generatedTimestamp: json?.generated_timestamp || ''
          });

          if (normalizeProvider(item.provider) !== normalizeProvider(task.provider)) return;
          if (item.route.toUpperCase() !== String(task.route).toUpperCase()) return;
          if (task.dir && item.dir && item.dir !== task.dir) return;

          const savedMatch = savedMatches.find(saved => normalizeProvider(task.provider) === 'ctb' ? true : (saved.dir ? saved.dir === item.dir : true));
          if (!savedMatch) return;

          addEtaRecord(routeMap, item, now);
        });
      });
    } else {
      const stopTasks = [...new Map(activeStopIds.map(item => [
        `${normalizeProvider(item.provider)}|${item.stopId}`,
        { ...item, normProvider: normalizeProvider(item.provider) }
      ])).values()];

      const responses = await Promise.all(
        stopTasks.map(async task => {
          try {
            const json = task.normProvider === 'ctb'
              ? await fetchCtbStopEta(task.stopId)
              : await fetchKmbStopEta(task.stopId);

            return { task, json, items: extractData(json) };
          } catch (error) {
            return { task, json: null, items: [] };
          }
        })
      );

      responses.forEach(({ task, json, items }) => {
        if (json?.generated_timestamp) generatedTimestamps.add(json.generated_timestamp);

        ensureStopInMap(routeMap, {
          stopId: task.stopId,
          provider: task.normProvider,
          generatedTimestamp: json?.generated_timestamp || ''
        });

        items.forEach(rawItem => {
          const item = normalizeEtaItem(rawItem, {
            provider: task.normProvider,
            stopId: task.stopId,
            generatedTimestamp: json?.generated_timestamp || ''
          });

          if (normalizeProvider(item.provider) !== task.normProvider) return;
          addEtaRecord(routeMap, item, now);
        });
      });
    }

    const groupedList = Object.values(routeMap)
      .filter(r => !(r.route === '---' && r.etas.length === 0))
      .map(r => {
        r.etas.sort((a, b) => a.minutes - b.minutes);
        return r;
      });

    if (generation !== etaRefreshGeneration) return;

    latestEtaResults = groupedList;
    latestGeneratedTimestamps = new Set(generatedTimestamps);

    logDebug(`ETAs fetched: ${groupedList.length} route records processed.`);
    renderEtas(latestEtaResults, latestGeneratedTimestamps);
    updateLastUpdated([...new Set(groupedList.map(item => item.provider))]);
    if (currentMode === 'debug') updateDebugPanel();
  }

  function addEtaRecord(routeMap, item, now) {
    if (!item.route || !item.stop) return;

    const stopId = item.stop;
    const provider = normalizeProvider(item.provider);
    const destination = item.destination;

    const record = ensureStopInMap(routeMap, {
      stopId,
      provider,
      route: item.route,
      dest: destination,
      serviceType: item.serviceType,
      dir: item.dir,
      generatedTimestamp: item.generatedTimestamp
    });

    if (item.eta && String(item.eta).trim() !== '') {
      const etaTime = new Date(item.eta);
      const diffMins = Math.round((etaTime - now) / 60000);

      if (diffMins >= 0 && diffMins <= 180) {
        record.etas.push({
          minutes: diffMins,
          timestamp: item.eta,
          etaSeq: item.etaSeq,
          remark: normalizeEtaRemark(item.remark)
        });
      }
    }
  }

  function renderEtas(routes, generatedTimestamps = new Set()) {
    const container = document.getElementById('eta-container');
    const searchInput = document.getElementById('nearby-search');
    const searchQuery = currentMode === 'nearby' && searchInput
      ? searchInput.value.trim().toUpperCase()
      : '';

    if (searchQuery) {
      routes = routes.filter(r =>
        String(r.route || '').trim().toUpperCase() === searchQuery
      );
    }

    if (routes.length === 0) {
      container.innerHTML = `<div class="status-msg">${searchQuery ? '沒有符合搜尋條件的巴士。' : '沒有即將到達的巴士。'}</div>`;
      return;
    }

    const stopsMap = new Map();

    routes.forEach(r => {
      const stopId = r.stopId || 'unknown';
      const provider = normalizeProvider(r.provider);
      const stopKey = `${provider}|${stopId}`;

      if (!stopsMap.has(stopKey)) {
        stopsMap.set(stopKey, {
          stopId,
          provider,
          stopName: r.stopName || '站點資料未提供',
          stopDistance: r.stopDistance,
          items: []
        });
      }
      stopsMap.get(stopKey).items.push(r);
    });

    const sortedStops = [...stopsMap.values()].sort((a, b) => {
      const distA = Number.isFinite(a.stopDistance) ? a.stopDistance : Infinity;
      const distB = Number.isFinite(b.stopDistance) ? b.stopDistance : Infinity;

      if (distA !== distB) return distA - distB;

      if (currentMode === 'daily') {
        const indexA = savedRoutes.findIndex(item => item.stopId === a.stopId);
        const indexB = savedRoutes.findIndex(item => item.stopId === b.stopB);
        return (indexA !== -1 ? indexA : 999) - (indexB !== -1 ? indexB : 999);
      }

      return a.stopName.localeCompare(b.stopName, 'zh-HK');
    });

    container.innerHTML = sortedStops.map(({ stopId, stopName, stopDistance, items }) => {
      const stopDistanceText = Number.isFinite(stopDistance) ? `${Math.round(stopDistance * 1000)}m` : '站點';

      items.sort((a, b) => {
        const etaA = a.etas[0]?.minutes ?? 9999;
        const etaB = b.etas[0]?.minutes ?? 9999;
        if (etaA !== etaB) return etaA - etaB;
        return a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' });
      });

      const cardMarkup = items.map(r => {
        const firstEta = r.etas[0]?.minutes;
        const nextEtas = r.etas.slice(1, 3).map(eta => `${eta.minutes}分`).reverse().join(' | ');

        const primaryEtaRemark = normalizeEtaRemark(r.etas[0]?.remark);
        const secondaryRemarks = r.etas.slice(1, 3)
          .map((eta, index) => ({ label: eta.minutes, remark: normalizeEtaRemark(eta.remark), ordinal: index + 2 }))
          .filter(item => item.remark);

        let timeClass = 'safe';
        let displayTime = firstEta != null ? `${firstEta}<span class="unit">分</span>` : '暫無';

        if (firstEta == null) {
          timeClass = 'muted';
        } else if (firstEta === 0) {
          timeClass = 'due';
          displayTime = '到站';
        } else if (firstEta <= 3) {
          timeClass = 'urgent';
        } else if (firstEta <= 7) {
          timeClass = 'warning';
        }

        const provider = r.provider || 'kmb';
        const isSaved = isSavedRoute(r.route, r.dest, stopId, provider, r.serviceType, r.dir);

        const action = isSaved ? 'remove-saved-route' : 'save-route';
        const starIcon = isSaved ? '★' : '☆';
        const savedClass = isSaved ? 'saved' : '';
        const key = getSavedRouteKey(r.route, r.dest, stopId, provider, r.serviceType, r.dir);

        const remarkMarkup = primaryEtaRemark
          ? `<div class="eta-remark" title="${escapeHtml(primaryEtaRemark)}">${escapeHtml(primaryEtaRemark)}</div>`
          : '';

        const secondaryRemarkMarkup = secondaryRemarks.length
          ? `<div class="eta-secondary-remark" title="${escapeHtml(secondaryRemarks.map(x => `${x.label}分：${x.remark}`).join('；'))}">${escapeHtml(secondaryRemarks.map(x => `${x.label}分：${x.remark}`).join('；'))}</div>`
          : '';

        return `
          <div class="eta-card">
            <div class="route-info">
              <div class="route-badge" style="background:${getCompanyColours(provider)};" title="${escapeHtml(getProvider(provider).label)}">
                ${escapeHtml(r.route)}
              </div>
              <div class="destination-wrap">
                <div class="destination">${escapeHtml(r.dest)}</div>
              </div>
            </div>

            <div class="eta-times">
              <div class="eta-time-stack">
                ${nextEtas ? `<div class="eta-secondary">${nextEtas}</div>` : ''}
                <div class="eta-primary ${timeClass}">${displayTime}</div>
                ${secondaryRemarkMarkup}
              </div>
              <button
                class="save-route-btn ${savedClass}"
                data-action="${action}"
                data-key="${escapeHtml(key)}"
                data-route="${escapeHtml(r.route)}"
                data-dest="${escapeHtml(r.dest)}"
                data-stop="${escapeHtml(stopId)}"
                data-provider="${escapeHtml(provider)}"
                data-service-type="${escapeHtml(r.serviceType)}"
                data-dir="${escapeHtml(r.dir)}"
                title="${isSaved ? '取消儲存' : '儲存路線'}">
                ${starIcon}
              </button>
            </div>
            ${remarkMarkup}
          </div>
        `;
      }).join('');

      const timestampText = [...generatedTimestamps][0] ? `資料 ${formatDataAge([...generatedTimestamps][0])}` : '';

      return `
        <div class="stop-group">
          <div class="stop-header">
            <div class="stop-header-title">${escapeHtml(stopName)}</div>
            <div class="stop-header-distance">
              ${escapeHtml(stopDistanceText)}
              ${timestampText ? ` · ${escapeHtml(timestampText)}` : ''}
            </div>
          </div>
          <div class="stop-card-list">${cardMarkup}</div>
        </div>
      `;
    }).join('');
  }


  let rainMap = null, rainHeatLayer = null, rainUserMarker = null;
  let rainParsedDataset = [];
  let rainTimeColumns = [];
  let selectedTimeIdx = 0;
  let playbackTimer = null;
  let isPlaying = false;

  const HKO_RAINFALL_CSV_URL = 'https://tight-meadow-e6e3.pangshuntak12493.workers.dev/';

  function initRainMap() {
    if (rainMap || typeof L === 'undefined') return;
    const el = document.getElementById('rain-map');
    if (!el) return;

    rainMap = L.map('rain-map', {
      zoomControl: true,
      attributionControl: true,
      preferCanvas: true
    }).setView([22.3193, 114.1694], 11);

    const hkBounds = L.latLngBounds([22.15, 113.80], [22.55, 114.35]);
    rainMap.fitBounds(hkBounds);

    setTimeout(() => rainMap.invalidateSize(), 200);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2gm9_1_9b68fea67e86e6b53ba39bcd', {
      attribution: '&copy; OSM &copy; CARTO | Data: HKO / CSDI',
      subdomains: 'abcd',
      maxZoom: 18
    }).addTo(rainMap);

    setupPlaybackControls();
  }

  function updateRainUserMarker() {
    if (!rainMap || !userLocation) return;
    const ll = [userLocation.lat, userLocation.lng];
    if (rainUserMarker) rainUserMarker.setLatLng(ll);
    else rainUserMarker = L.circleMarker(ll, {
      radius: 7, color: '#FFCC00', weight: 2, fillColor: '#FFCC00', fillOpacity: 0.9
    }).addTo(rainMap).bindTooltip('你的位置');
    if (!rainMap.getBounds().contains(ll)) rainMap.panTo(ll);
  }

  function parseCSV(text) {
    const lines = [];
    let curLine = [];
    let curToken = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (inQuotes && nextChar === '"') {
          curToken += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        curLine.push(curToken.trim());
        curToken = '';
      } else if ((char === '\r' || char === '\n') && !inQuotes) {
        if (char === '\r' && nextChar === '\n') i++;
        curLine.push(curToken.trim());
        if (curLine.some(cell => cell.length > 0)) lines.push(curLine);
        curLine = [];
        curToken = '';
      } else {
        curToken += char;
      }
    }
    if (curToken || curLine.length) {
      curLine.push(curToken.trim());
      if (curLine.some(cell => cell.length > 0)) lines.push(curLine);
    }
    return lines;
  }

  function parseHKOTimeString(str) {
    if (!str) return '';
    const match = str.match(/(\d{4})(\d{2})(\d{2})[-_]?(\d{2})(\d{2})/);
    if (match) {
      return `${match[4]}:${match[5]}`;
    }
    return str.slice(-5);
  }

  function renderHeatmapForColumn(colIndex) {
    if (!rainMap || !rainParsedDataset.length) return;

    const heatPoints = [];
    rainParsedDataset.forEach(row => {
      const val = row.values[colIndex] || 0;
      if (val > 0.5) {
        const intensity = Math.min(1.0, Math.max(0.1, val / 35.0));
        heatPoints.push([row.lat, row.lng, intensity]);
      }
    });

    if (rainHeatLayer) {
      rainHeatLayer.setLatLngs(heatPoints);
    } else if (typeof L.heatLayer === 'function') {
      rainHeatLayer = L.heatLayer(heatPoints, {
        radius: 25,
        blur: 14,
        maxZoom: 14,
        gradient: {
          0.0: '#00FF00',
          0.2: '#FFA500',
          0.5: '#FF0000',
          0.9: '#800080'
        }
      }).addTo(rainMap);
    }

    updatePlaybackUI();
  }

  function setupPlaybackControls() {
    const toggleBtn = document.getElementById('play-toggle-btn');
    const prevBtn = document.getElementById('play-prev-btn');
    const nextBtn = document.getElementById('play-next-btn');
    const slider = document.getElementById('playback-slider');

    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        if (isPlaying) stopRainPlayback();
        else startRainPlayback();
      });
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        stopRainPlayback();
        if (rainTimeColumns.length > 0) {
          selectedTimeIdx = (selectedTimeIdx - 1 + rainTimeColumns.length) % rainTimeColumns.length;
          renderHeatmapForColumn(selectedTimeIdx);
        }
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        stopRainPlayback();
        if (rainTimeColumns.length > 0) {
          selectedTimeIdx = (selectedTimeIdx + 1) % rainTimeColumns.length;
          renderHeatmapForColumn(selectedTimeIdx);
        }
      });
    }

    if (slider) {
      slider.addEventListener('input', (e) => {
        stopRainPlayback();
        selectedTimeIdx = parseInt(e.target.value, 10) || 0;
        renderHeatmapForColumn(selectedTimeIdx);
      });
    }
  }

  function startRainPlayback() {
    if (rainTimeColumns.length <= 1) return;
    isPlaying = true;
    const toggleBtn = document.getElementById('play-toggle-btn');
    if (toggleBtn) toggleBtn.textContent = '⏸';

    playbackTimer = setInterval(() => {
      selectedTimeIdx = (selectedTimeIdx + 1) % rainTimeColumns.length;
      renderHeatmapForColumn(selectedTimeIdx);
    }, 1200);
  }

  function stopRainPlayback() {
    isPlaying = false;
    if (playbackTimer) {
      clearInterval(playbackTimer);
      playbackTimer = null;
    }
    const toggleBtn = document.getElementById('play-toggle-btn');
    if (toggleBtn) toggleBtn.textContent = '▶';
  }

  function updatePlaybackUI() {
    const timeDisplay = document.getElementById('playback-time-display');
    const slider = document.getElementById('playback-slider');

    if (rainTimeColumns[selectedTimeIdx]) {
      if (timeDisplay) timeDisplay.textContent = rainTimeColumns[selectedTimeIdx].label;
    }
    if (slider) {
      slider.max = Math.max(0, rainTimeColumns.length - 1);
      slider.value = selectedTimeIdx;
    }
  }

async function fetchAndRenderRain() {
    const uEl = document.getElementById('rain-updated');
    logDebug('Fetching rain CSV forecast...');

    try {
      if (!rainMap) initRainMap();

      const response = await fetch(HKO_RAINFALL_CSV_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const csvText = await response.text();
      const rows = parseCSV(csvText);
      if (rows.length < 2) throw new Error('Empty or invalid CSV structure');

      let headerIdx = -1;
      let latIdx = -1;
      let lngIdx = -1;
      let endingTimeIdx = -1;
      let rainfallValIdx = -1;
      let updateTimeStr = '';
      let headerRow = [];

      // Find the header row and inspect column indices
      for (let i = 0; i < Math.min(10, rows.length); i++) {
        const row = rows[i];
        
        row.forEach((cell, cellIdx) => {
          if (cell.includes('Updated Date and Time')) {
            updateTimeStr = row[cellIdx + 1] || cell.split(':')[1] || '';
          }
        });

        const lIdx = row.findIndex(c => c.toLowerCase().includes('lat'));
        const gIdx = row.findIndex(c => c.toLowerCase().includes('lon') || c.toLowerCase().includes('lng'));
        
        if (lIdx !== -1 && gIdx !== -1) {
          headerIdx = i;
          headerRow = row;
          latIdx = lIdx;
          lngIdx = gIdx;
          endingTimeIdx = row.findIndex(c => c.includes('Ending Date and Time') || c.includes('結束時間') || c.includes('Ending'));
          
          // 1. Locate the rainfall column index
          rainfallValIdx = headerRow.findIndex(c => 
            String(c).includes('Half-hourly Nowcast Accumulated Rainfall (mm)') || 
            String(c).includes('Rainfall') || 
            String(c).includes('降雨量')
          );
          break;
        }
      }

      // 2. Process and display debug table if rainfall column is checked
      const dataRows = rows.slice(headerIdx + 1);
      
      if (rainfallValIdx === -1) {
        console.error('Debug Error: Rainfall header column could not be found.');
        console.log('Available Headers:', headerRow);
      } else {
        // Map row data into an array of objects for grid display
        const rainfallGrid = dataRows.map((dataRow, index) => {
          // Assuming Column 0 is Location/Station name; adjust index if needed
          const location = dataRow[0] || `Row ${index + 1}`; 
          const rainfallValue = dataRow[rainfallValIdx];

          return {
            'Row #': index + 1,
            'Location / Station': location,
            'Rainfall (mm)': rainfallValue !== undefined && rainfallValue !== '' ? rainfallValue : 'N/A'
          };
        });

        // 3. Output as a clean, interactive grid table in the Debug console
        console.log(`Debug Info: Found rainfall data at column index [${rainfallValIdx}]`);
        console.table(rainfallGrid);
      }

      if (headerIdx === -1 || latIdx === -1 || lngIdx === -1) {
        throw new Error('Coordinate or column headers missing in CSV');
      }

      const rawUpdate = updateTimeStr.trim();
      if (uEl) {
        if (rawUpdate) {
          const formattedRefresh = parseHKOTimeString(rawUpdate) || rawUpdate;
          uEl.textContent = `更新 ${formattedRefresh}`;
        } else {
          const n = new Date();
          uEl.textContent = `更新 ${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
        }
      }

      const timeSeriesMap = new Map();

      for (let i = 0; i < dataRows.length; i++) {
        const row = dataRows[i];
        if (row.length <= Math.max(latIdx, lngIdx)) continue;

        const lat = parseFloat(row[latIdx]);
        const lng = parseFloat(row[lngIdx]);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

        const endingTimeRaw = endingTimeIdx !== -1 ? row[endingTimeIdx] : '預報';
        const endingLabel = parseHKOTimeString(endingTimeRaw);
        
        const rainfallValue = rainfallValIdx !== -1 ? (parseFloat(row[rainfallValIdx]) || 0) : 0;

        if (!timeSeriesMap.has(endingLabel)) {
          timeSeriesMap.set(endingLabel, []);
        }
        timeSeriesMap.get(endingLabel).push({ lat, lng, value: rainfallValue });
      }

      const timeLabels = Array.from(timeSeriesMap.keys());
      rainTimeColumns = timeLabels.map((label, idx) => ({ indexInValList: idx, label }));

      rainParsedDataset = [];
      const totalPoints = timeSeriesMap.get(timeLabels[0])?.length || 0;

      for (let ptIdx = 0; ptIdx < totalPoints; ptIdx++) {
        const firstPt = timeSeriesMap.get(timeLabels[0])[ptIdx];
        const values = timeLabels.map(label => timeSeriesMap.get(label)[ptIdx]?.value || 0);
        rainParsedDataset.push({ lat: firstPt.lat, lng: firstPt.lng, values });
      }

      if (selectedTimeIdx < 0 || selectedTimeIdx >= rainTimeColumns.length) {
        selectedTimeIdx = 0;
      }

      logDebug(`Rain CSV parsed successfully: ${rows.length} rows, ${timeLabels.length} time frames.`);
      const rainValues = rainParsedDataset.map(pt => pt.values[selectedTimeIdx] || 0);
const minRainVal = rainValues.length > 0 ? Math.min(...rainValues) : 0;
const maxRainVal = rainValues.length > 0 ? Math.max(...rainValues) : 0;
      // Filter points that fall within Hong Kong's geographic boundaries
const hkPoints = rainParsedDataset.filter(pt => 
  pt.lat >= 22.15 && pt.lat <= 22.58 && 
  pt.lng >= 113.83 && pt.lng <= 114.44
);

// Get all rainfall values only for stations inside Hong Kong
const hkRainValues = hkPoints.flatMap(pt => pt.values);

const hkMin = hkRainValues.length ? Math.min(...hkRainValues) : 0;
const hkMax = hkRainValues.length ? Math.max(...hkRainValues) : 0;
      const debugRainEl = document.getElementById('debug-rain-info');
      if (debugRainEl) {
        debugRainEl.innerHTML = `
          <b>Status:</b> Success<br>
          <b>CSV Raw Rows:</b> ${rows.length}<br>
          <b>Parsed Points:</b> ${rainParsedDataset.length}<br>
          <b>Rainfall Col Index:</b> ${rainfallValIdx}<br>
          <b>Rainfall Range:</b> ${minRainVal} mm - ${maxRainVal} mm<br>
          <b>HK Rainfall Range:</b> ${hkMin} mm - ${hkMax} mm<br>
          <b>Time Slots:</b> ${timeLabels.join(', ')}
        `;
      }

      renderHeatmapForColumn(selectedTimeIdx);
      updateRainUserMarker();
    } catch (e) {
      console.warn('Rain CSV parse error:', e);
      logDebug(`[ERROR] Rain CSV Error: ${e.message}`);
      if (uEl) uEl.textContent = '載入失敗';
      const debugRainEl = document.getElementById('debug-rain-info');
      if (debugRainEl) debugRainEl.innerHTML = `<span style="color:#ef4444">Error loading CSV: ${e.message}</span>`;
    }
  }

  setTimeout(() => { initRainMap(); fetchAndRenderRain(); }, 800);
  setInterval(fetchAndRenderRain, 12 * 60 * 1000);

  const _origApply = applyLocation;
  applyLocation = function(lat, lng, src) {
    _origApply(lat, lng, src);
    updateRainUserMarker();
  };

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopEtaLoop();
    else if (activeStopIds.length) startEtaLoop();
  });

  updateSearchVisibility();
  updateRainMapVisibility();
  initDashboard();
  </script>
